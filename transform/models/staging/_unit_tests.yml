version: 2

# Hand-written envelopes shaped like the recorded fixtures in
# tests/fixtures/tfl/. Inputs are SQL so the `request` struct and the JSON
# payload text keep their real types. Unit tests run in the warehouse.

unit_tests:
  - name: stg_line_status_keeps_every_entry_and_drops_failed_polls
    description: >
      Victoria carries Severe Delays and a planned Part Closure at once: both
      entries are kept (ADR-004), the closure is planned and the delay is
      not. Bakerloo's Good Service has no validity periods and keeps one row
      with null period columns. A 503 and a timed-out request add no rows.
    model: stg_line_status
    # Fixtures sit on 2026-11-03. Pinning the window keeps these tests
    # independent of a backfill's --vars or a later raw_start_date.
    overrides: &full_history_window
      macros:
        is_incremental: false
      vars:
        start_date: null
        end_date: null
        raw_start_date: "2026-11-01"
        station_initial_days: null
    given:
      - input: source('raw', 'line_status')
        format: sql
        rows: |
          select
              'p1' as poll_id,
              '2026-11-03T08:15:00.123Z' as polled_at,
              'line_status' as feed,
              cast(row('/Line/Mode/tube/Status') as row(path varchar)) as request,
              200 as http_status,
              180 as latency_ms,
              cast(null as varchar) as error,
              '[{"id": "victoria", "name": "Victoria", "modeName": "tube", "lineStatuses": [
                  {"statusSeverity": 6, "statusSeverityDescription": "Severe Delays",
                   "reason": "Victoria Line: Severe delays due to a signal failure.",
                   "created": "0001-01-01T00:00:00",
                   "validityPeriods": [{"fromDate": "2026-11-03T08:01:00Z",
                                        "toDate": "2026-11-03T09:30:00Z", "isNow": true}],
                   "disruption": {"category": "RealTime", "description": "Signal failure."}},
                  {"statusSeverity": 5, "statusSeverityDescription": "Part Closure",
                   "reason": "No service between Seven Sisters and Walthamstow Central.",
                   "validityPeriods": [{"fromDate": "2026-11-03T00:00:00Z",
                                        "toDate": "2026-11-03T23:59:00Z", "isNow": true}],
                   "disruption": {"category": "PlannedWork", "description": "Planned works."}}]},
                {"id": "bakerloo", "name": "Bakerloo", "modeName": "tube", "lineStatuses": [
                  {"statusSeverity": 10, "statusSeverityDescription": "Good Service",
                   "created": "0001-01-01T00:00:00", "validityPeriods": []}]}]' as payload,
              '2026-11-03' as dt,
              '08' as hour
          union all
          select
              'p2',
              '2026-11-03T08:16:00.045Z',
              'line_status',
              cast(row('/Line/Mode/tube/Status') as row(path varchar)),
              503,
              95,
              cast(null as varchar),
              cast(null as varchar),
              '2026-11-03',
              '08'
          union all
          select
              'p3',
              '2026-11-03T08:17:00.001Z',
              'line_status',
              cast(row('/Line/Mode/tube/Status') as row(path varchar)),
              cast(null as integer),
              45000,
              'timeout',
              cast(null as varchar),
              '2026-11-03',
              '08'
    expect:
      rows:
        - poll_id: p1
          polled_at: "2026-11-03 08:15:00.123"
          poll_minute: "2026-11-03 08:15:00"
          line_id: victoria
          mode_name: tube
          status_ordinal: 1
          status_severity: 6
          is_planned: false
          validity_ordinal: 1
          valid_from: "2026-11-03 08:01:00"
          valid_to: "2026-11-03 09:30:00"
        - poll_id: p1
          polled_at: "2026-11-03 08:15:00.123"
          poll_minute: "2026-11-03 08:15:00"
          line_id: victoria
          mode_name: tube
          status_ordinal: 2
          status_severity: 5
          is_planned: true
          validity_ordinal: 1
          valid_from: "2026-11-03 00:00:00"
          valid_to: "2026-11-03 23:59:00"
        - poll_id: p1
          polled_at: "2026-11-03 08:15:00.123"
          poll_minute: "2026-11-03 08:15:00"
          line_id: bakerloo
          mode_name: tube
          status_ordinal: 1
          status_severity: 10
          is_planned: false
          validity_ordinal: null
          valid_from: null
          valid_to: null

  - name: stg_arrivals_parses_a_prediction_and_nulls_placeholder_dates
    description: >
      One Oxford Circus prediction, listed twice by TfL, gives one row. The
      seven-digit fraction on TfL's timestamp is read to the millisecond, and
      the 0001-01-01 placeholder in timeToLive becomes null.
    model: stg_arrivals
    overrides: *full_history_window
    given:
      - input: source('raw', 'arrivals')
        format: sql
        rows: |
          select
              'p1' as poll_id,
              '2026-11-03T08:15:00.123Z' as polled_at,
              'arrivals' as feed,
              cast(row('/StopPoint/940GZZLUOXC/Arrivals') as row(path varchar)) as request,
              200 as http_status,
              184 as latency_ms,
              cast(null as varchar) as error,
              '[{"id": "351445571", "vehicleId": "223", "naptanId": "940GZZLUOXC",
                 "stationName": "Oxford Circus Underground Station", "lineId": "bakerloo",
                 "lineName": "Bakerloo", "platformName": "Southbound - Platform 3",
                 "direction": "inbound", "bearing": "", "destinationNaptanId": "940GZZLUEAC",
                 "destinationName": "Elephant & Castle Underground Station",
                 "timestamp": "2026-11-03T08:14:26.5894441Z", "timeToStation": 163,
                 "currentLocation": "Between Regent''s Park and Oxford Circus",
                 "towards": "Elephant and Castle", "expectedArrival": "2026-11-03T08:17:09Z",
                 "timeToLive": "0001-01-01T00:00:00", "modeName": "tube"},
                {"id": "351445571", "vehicleId": "223", "naptanId": "940GZZLUOXC",
                 "lineId": "bakerloo", "platformName": "Southbound - Platform 3",
                 "direction": "inbound", "destinationNaptanId": "940GZZLUEAC",
                 "timestamp": "2026-11-03T08:14:26.5894441Z",
                 "timeToStation": 163, "expectedArrival": "2026-11-03T08:17:09Z",
                 "timeToLive": "0001-01-01T00:00:00", "modeName": "tube"}]' as payload,
              '2026-11-03' as dt,
              '08' as hour
    expect:
      rows:
        - poll_id: p1
          request_path: /StopPoint/940GZZLUOXC/Arrivals
          prediction_id: "351445571"
          vehicle_id: "223"
          naptan_id: 940GZZLUOXC
          line_id: bakerloo
          platform_name: Southbound - Platform 3
          direction: inbound
          station_name: Oxford Circus Underground Station
          destination_naptan_id: 940GZZLUEAC
          towards: Elephant and Castle
          current_location: Between Regent's Park and Oxford Circus
          time_to_station: 163
          expected_arrival: "2026-11-03 08:17:09"
          prediction_timestamp: "2026-11-03 08:14:26.589"
          time_to_live: null

  - name: stg_arrivals_keeps_different_predictions_that_share_an_id
    description: >
      Shapes from the week-one review (docs/data-quality/2026-11-08-week-one.md,
      Q5). Canning Town's DLR board lists three trains under one id
      (-846781707): all three are kept. At Baker Street, Metropolitan vehicle
      402 is listed under one id on two platforms, arriving to terminate and
      leaving again: both are kept. The same prediction listed twice with an
      older and a newer TfL timestamp is one row, the newer copy. Keying on
      the id alone kept 1 of the 3 DLR trains and 1 of the 2 Metropolitan
      listings.
    model: stg_arrivals
    overrides: *full_history_window
    given:
      - input: source('raw', 'arrivals')
        format: sql
        rows: |
          select
              'p1' as poll_id,
              '2026-11-06T08:40:00.250Z' as polled_at,
              'arrivals' as feed,
              cast(row('/StopPoint/940GZZDLCAN/Arrivals') as row(path varchar)) as request,
              200 as http_status,
              150 as latency_ms,
              cast(null as varchar) as error,
              '[{"id": "-846781707", "naptanId": "940GZZDLCAN", "lineId": "dlr",
                 "platformName": "1", "direction": "inbound", "vehicleId": "",
                 "destinationNaptanId": "940GZZDLWLA", "timeToStation": 102,
                 "timestamp": "2026-11-06T08:39:20Z", "expectedArrival": "2026-11-06T08:41:02Z"},
                {"id": "-846781707", "naptanId": "940GZZDLCAN", "lineId": "dlr",
                 "platformName": "3", "direction": "inbound", "vehicleId": "",
                 "destinationNaptanId": "940GZZDLBEC", "timeToStation": 102,
                 "timestamp": "2026-11-06T08:39:20Z", "expectedArrival": "2026-11-06T08:41:02Z"},
                {"id": "-846781707", "naptanId": "940GZZDLCAN", "lineId": "dlr",
                 "platformName": "1", "direction": "inbound", "vehicleId": "",
                 "destinationNaptanId": "940GZZDLWLA", "timeToStation": 402,
                 "timestamp": "2026-11-06T08:39:20Z", "expectedArrival": "2026-11-06T08:46:02Z"}]' as payload,
              '2026-11-06' as dt,
              '08' as hour
          union all
          select
              'p1',
              '2026-11-06T08:40:00.250Z',
              'arrivals',
              cast(row('/StopPoint/940GZZLUBST/Arrivals') as row(path varchar)),
              200,
              160,
              cast(null as varchar),
              '[{"id": "-1336847038", "naptanId": "940GZZLUBST", "lineId": "metropolitan",
                 "platformName": "Platform 1", "direction": "", "vehicleId": "402",
                 "destinationNaptanId": "940GZZLUBST", "timeToStation": 100,
                 "timestamp": "2026-11-06T08:39:20Z", "expectedArrival": "2026-11-06T08:42:00Z"},
                {"id": "-1336847038", "naptanId": "940GZZLUBST", "lineId": "metropolitan",
                 "platformName": "Platform 4", "direction": "outbound", "vehicleId": "402",
                 "destinationNaptanId": "940GZZLUAMS", "timeToStation": 1120,
                 "timestamp": "2026-11-06T08:39:20Z", "expectedArrival": "2026-11-06T08:59:00Z"},
                {"id": "-1336847038", "naptanId": "940GZZLUBST", "lineId": "metropolitan",
                 "platformName": "Platform 4", "direction": "outbound", "vehicleId": "402",
                 "destinationNaptanId": "940GZZLUAMS", "timeToStation": 1150,
                 "timestamp": "2026-11-06T08:38:50Z", "expectedArrival": "2026-11-06T08:59:00Z"}]',
              '2026-11-06',
              '08'
    expect:
      rows:
        - {request_path: /StopPoint/940GZZDLCAN/Arrivals, platform_name: "1", destination_naptan_id: 940GZZDLWLA, expected_arrival: "2026-11-06 08:41:02", time_to_station: 102}
        - {request_path: /StopPoint/940GZZDLCAN/Arrivals, platform_name: "3", destination_naptan_id: 940GZZDLBEC, expected_arrival: "2026-11-06 08:41:02", time_to_station: 102}
        - {request_path: /StopPoint/940GZZDLCAN/Arrivals, platform_name: "1", destination_naptan_id: 940GZZDLWLA, expected_arrival: "2026-11-06 08:46:02", time_to_station: 402}
        - {request_path: /StopPoint/940GZZLUBST/Arrivals, platform_name: Platform 1, destination_naptan_id: 940GZZLUBST, expected_arrival: "2026-11-06 08:42:00", time_to_station: 100}
        - {request_path: /StopPoint/940GZZLUBST/Arrivals, platform_name: Platform 4, destination_naptan_id: 940GZZLUAMS, expected_arrival: "2026-11-06 08:59:00", time_to_station: 1120}

  - name: stg_line_status_keeps_only_the_first_listing_of_a_repeated_line
    description: >
      TfL lists Victoria twice in one response with different entries. Only
      the first listing's entries are kept, so entries are never mixed. A
      line with no status entries yields no rows (it is missing, not Good
      Service).
    model: stg_line_status
    overrides: *full_history_window
    given:
      - input: source('raw', 'line_status')
        format: sql
        rows: |
          select
              'p1' as poll_id,
              '2026-11-03T08:15:00.123Z' as polled_at,
              'line_status' as feed,
              cast(row('/Line/Mode/tube/Status') as row(path varchar)) as request,
              200 as http_status,
              180 as latency_ms,
              cast(null as varchar) as error,
              '[{"id": "victoria", "name": "Victoria", "modeName": "tube", "lineStatuses": [
                  {"statusSeverity": 9, "statusSeverityDescription": "Minor Delays",
                   "validityPeriods": []}]},
                {"id": "central", "name": "Central", "modeName": "tube", "lineStatuses": []},
                {"id": "victoria", "name": "Victoria", "modeName": "tube", "lineStatuses": [
                  {"statusSeverity": 10, "statusSeverityDescription": "Good Service",
                   "validityPeriods": []},
                  {"statusSeverity": 6, "statusSeverityDescription": "Severe Delays",
                   "validityPeriods": []}]}]' as payload,
              '2026-11-03' as dt,
              '08' as hour
    expect:
      rows:
        - poll_id: p1
          line_id: victoria
          status_ordinal: 1
          status_severity: 9

  - name: stg_polls_flags_failed_requests_and_dedupes_envelopes
    description: >
      is_ok needs a 2xx, no collector error and a payload. A 503, a timeout,
      a 200 without a payload and a 200 with an error are all not ok. An
      envelope written twice (failed copy, then successful copy) keeps one
      row, the successful one. Other feeds are empty.
    model: stg_polls
    overrides: *full_history_window
    given:
      - input: source('raw', 'line_status')
        format: sql
        rows: |
          select
              'p1' as poll_id,
              '2026-11-03T08:15:00.100Z' as polled_at,
              'line_status' as feed,
              cast(row('/Line/Mode/tube/Status') as row(path varchar)) as request,
              200 as http_status,
              150 as latency_ms,
              cast(null as varchar) as error,
              '[]' as payload,
              '2026-11-03' as dt,
              '08' as hour
          union all
          select 'p2', '2026-11-03T08:16:00.100Z', 'line_status',
              cast(row('/Line/Mode/tube/Status') as row(path varchar)),
              503, 90, cast(null as varchar), cast(null as varchar), '2026-11-03', '08'
          union all
          select 'p3', '2026-11-03T08:17:00.100Z', 'line_status',
              cast(row('/Line/Mode/tube/Status') as row(path varchar)),
              cast(null as integer), 45000, 'timeout', cast(null as varchar), '2026-11-03', '08'
          union all
          select 'p4', '2026-11-03T08:18:00.100Z', 'line_status',
              cast(row('/Line/Mode/tube/Status') as row(path varchar)),
              200, 120, cast(null as varchar), cast(null as varchar), '2026-11-03', '08'
          union all
          select 'p5', '2026-11-03T08:19:00.100Z', 'line_status',
              cast(row('/Line/Mode/tube/Status') as row(path varchar)),
              200, 120, 'body_read_error', '[]', '2026-11-03', '08'
          union all
          select 'p6', '2026-11-03T08:20:00.100Z', 'line_status',
              cast(row('/Line/Mode/tube/Status') as row(path varchar)),
              503, 80, cast(null as varchar), cast(null as varchar), '2026-11-03', '08'
          union all
          select 'p6', '2026-11-03T08:20:00.100Z', 'line_status',
              cast(row('/Line/Mode/tube/Status') as row(path varchar)),
              200, 140, cast(null as varchar), '[]', '2026-11-03', '08'
      - input: source('raw', 'line_disruption')
        format: sql
        rows: &empty_envelopes |
          select
              cast(null as varchar) as poll_id,
              cast(null as varchar) as polled_at,
              cast(null as varchar) as feed,
              cast(null as row(path varchar)) as request,
              cast(null as integer) as http_status,
              cast(null as integer) as latency_ms,
              cast(null as varchar) as error,
              cast(null as varchar) as payload,
              cast(null as varchar) as dt,
              cast(null as varchar) as hour
          where false
      - input: source('raw', 'arrivals')
        format: sql
        rows: *empty_envelopes
      - input: source('raw', 'stop_disruption')
        format: sql
        rows: *empty_envelopes
      - input: source('raw', 'ref_route_sequence')
        format: sql
        rows: *empty_envelopes
      - input: source('raw', 'ref_timetable')
        format: sql
        rows: *empty_envelopes
      - input: source('raw', 'ref_severity')
        format: sql
        rows: *empty_envelopes
    expect:
      rows:
        - {poll_id: p1, feed: line_status, http_status: 200, is_ok: true, poll_minute: "2026-11-03 08:15:00"}
        - {poll_id: p2, feed: line_status, http_status: 503, is_ok: false, poll_minute: "2026-11-03 08:16:00"}
        - {poll_id: p3, feed: line_status, http_status: null, is_ok: false, poll_minute: "2026-11-03 08:17:00"}
        - {poll_id: p4, feed: line_status, http_status: 200, is_ok: false, poll_minute: "2026-11-03 08:18:00"}
        - {poll_id: p5, feed: line_status, http_status: 200, is_ok: false, poll_minute: "2026-11-03 08:19:00"}
        - {poll_id: p6, feed: line_status, http_status: 200, is_ok: true, poll_minute: "2026-11-03 08:20:00"}

  - name: stg_stop_disruption_keeps_points_without_concerned_lines
    description: >
      Most recorded points have no concernedLines key; each keeps one row
      with null line columns. A point with two lines gives two rows.
    model: stg_stop_disruption
    overrides: *full_history_window
    given:
      - input: source('raw', 'stop_disruption')
        format: sql
        rows: |
          select
              'p1' as poll_id,
              '2026-11-03T08:15:00.123Z' as polled_at,
              'stop_disruption' as feed,
              cast(row('/StopPoint/Mode/tube/Disruption') as row(path varchar)) as request,
              200 as http_status,
              300 as latency_ms,
              cast(null as varchar) as error,
              '[{"atcoCode": "940GZZLUOXC", "fromDate": "2026-11-01T00:00:00Z",
                 "toDate": "2026-11-30T23:59:00Z", "type": "Information",
                 "appearance": "RealTime", "description": "Lift out of service."},
                {"atcoCode": "940GZZLUBSC", "fromDate": "2026-07-06T03:30:00Z",
                 "toDate": "2026-11-30T01:29:00Z", "type": "Part Closure",
                 "appearance": "PlannedWork", "description": "Westbound trains will not call.",
                 "concernedLines": [{"id": "district", "direction": "inbound"},
                                    {"id": "piccadilly", "direction": "inbound"}]}]' as payload,
              '2026-11-03' as dt,
              '08' as hour
    expect:
      rows:
        - {disruption_ordinal: 1, atco_code: 940GZZLUOXC, is_planned: false, line_ordinal: null, line_id: null, valid_from: "2026-11-01 00:00:00"}
        - {disruption_ordinal: 2, atco_code: 940GZZLUBSC, is_planned: true, line_ordinal: 1, line_id: district, valid_from: "2026-07-06 03:30:00"}
        - {disruption_ordinal: 2, atco_code: 940GZZLUBSC, is_planned: true, line_ordinal: 2, line_id: piccadilly, valid_from: "2026-07-06 03:30:00"}

  - name: stg_line_disruption_parses_entries
    description: >
      Two disruptions keep their response positions; the planned one is
      flagged. TfL gives most entries no affected routes.
    model: stg_line_disruption
    overrides: *full_history_window
    given:
      - input: source('raw', 'line_disruption')
        format: sql
        rows: |
          select
              'p1' as poll_id,
              '2026-11-03T08:15:00.123Z' as polled_at,
              'line_disruption' as feed,
              cast(row('/Line/Mode/tube/Disruption') as row(path varchar)) as request,
              200 as http_status,
              200 as latency_ms,
              cast(null as varchar) as error,
              '[{"category": "RealTime", "type": "lineInfo",
                 "description": "Waterloo and City Line: Service will resume at 06:00.",
                 "affectedRoutes": [], "affectedStops": []},
                {"category": "PlannedWork", "type": "routeBlocking",
                 "description": "Victoria Line: Part closure.",
                 "affectedRoutes": [{"lineId": "victoria"}, {"lineId": "victoria"}]}]' as payload,
              '2026-11-03' as dt,
              '08' as hour
    expect:
      rows:
        - {disruption_ordinal: 1, category: RealTime, disruption_type: lineInfo, is_planned: false}
        - {disruption_ordinal: 2, category: PlannedWork, disruption_type: routeBlocking, is_planned: true}

  - name: stg_timetable_reads_journeys_past_midnight_and_skips_disambiguations
    description: >
      Hour 27 is 03:xx the next morning, so 27:09 is minute 1629 of the
      service day. A disambiguation response has no timetable and gives no rows.
    model: stg_timetable
    overrides: *full_history_window
    given:
      - input: source('raw', 'ref_timetable')
        format: sql
        rows: |
          select
              'p1' as poll_id,
              '2026-11-03T02:00:00.000Z' as polled_at,
              'ref_timetable' as feed,
              cast(row('/Line/victoria/Timetable/940GZZLUOXC?direction=inbound') as row(path varchar)) as request,
              200 as http_status,
              400 as latency_ms,
              cast(null as varchar) as error,
              '{"lineId": "victoria", "lineName": "Victoria", "direction": "inbound",
                "timetable": {"departureStopId": "940GZZLUOXC", "routes": [
                  {"stationIntervals": [],
                   "schedules": [{"name": "Saturday (also Good Friday)", "knownJourneys": [
                     {"hour": "3", "minute": "19", "intervalId": 0},
                     {"hour": "27", "minute": "9", "intervalId": 0}]}]}]}}' as payload,
              '2026-11-03' as dt,
              '02' as hour
          union all
          select 'p1', '2026-11-03T02:00:00.000Z', 'ref_timetable',
              cast(row('/Line/victoria/Timetable/940GZZLUOXC') as row(path varchar)),
              200, 300, cast(null as varchar),
              '{"lineId": "victoria", "disambiguation": {"disambiguationOptions": [
                 {"uri": "/Line/victoria/Timetable/940GZZLUOXC?direction=inbound"}]}}',
              '2026-11-03', '02'
    expect:
      rows:
        - {line_id: victoria, departure_stop_id: 940GZZLUOXC, schedule_name: "Saturday (also Good Friday)", journey_ordinal: 1, departure_hour: 3, departure_minute: 19, departure_minute_of_service_day: 199}
        - {line_id: victoria, departure_stop_id: 940GZZLUOXC, schedule_name: "Saturday (also Good Friday)", journey_ordinal: 2, departure_hour: 27, departure_minute: 9, departure_minute_of_service_day: 1629}

  - name: stg_route_sequence_numbers_stops_along_each_route
    description: Each stop of an ordered route gets its 1-based position along it.
    model: stg_route_sequence
    overrides: *full_history_window
    given:
      - input: source('raw', 'ref_route_sequence')
        format: sql
        rows: |
          select
              'p1' as poll_id,
              '2026-11-03T02:00:00.000Z' as polled_at,
              'ref_route_sequence' as feed,
              cast(row('/Line/victoria/Route/Sequence/inbound') as row(path varchar)) as request,
              200 as http_status,
              300 as latency_ms,
              cast(null as varchar) as error,
              '{"lineId": "victoria", "lineName": "Victoria", "direction": "inbound", "mode": "tube",
                "orderedLineRoutes": [{"name": "Walthamstow Central  &harr;  Brixton ",
                  "naptanIds": ["940GZZLUWWL", "940GZZLUBLR"], "serviceType": "Regular"}]}' as payload,
              '2026-11-03' as dt,
              '02' as hour
    expect:
      rows:
