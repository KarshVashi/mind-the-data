version: 2

seeds:
  - name: lines
    description: >
      Lines in scope, copied from config/lines.yaml (a unit test keeps the
      two in step). Feeds dim_lines.
    columns:
      - name: line_id
        description: TfL line id.
        data_tests: [unique, not_null]
      - name: line_name
        description: Display name.
        data_tests: [not_null]
      - name: mode_name
        description: TfL mode.
        data_tests: [not_null]
      - name: colour
        description: Line colour, hex.
      - name: is_low_volume
        description: Shown but flagged as low volume (PLAN 7.4).
        data_tests: [not_null]

  - name: severity_weights
    description: >
      Weight of each TfL status severity code (PLAN 7.1, ADR-004). The
      higher weight wins a minute. `weight_planned` applies when the entry's
      disruption is filed as planned work; only Bus Service differs.
      Codes 4 and 5 are closures: a minute whose worst status is a closure is
      engineering works and leaves the score. Code 20 (Service Closed) is not
      in the plan; it is TfL's overnight status and is weighted 0 and left out
      of the score (DECISIONS.md D16). A code missing here fails
      assert_line_status_codes_are_weighted rather than defaulting.
    columns:
      - name: severity_code
        description: TfL statusSeverity.
        data_tests: [unique, not_null]
      - name: description
        description: TfL's text for the code, checked against what TfL sends.
        data_tests: [not_null]
      - name: weight_unplanned
        description: Weight when the entry is not planned work.
        data_tests: [not_null]
      - name: weight_planned
        description: Weight when the entry is planned work.
        data_tests: [not_null]
      - name: is_closure
        description: Planned Closure or Part Closure.
        data_tests: [not_null]
      - name: is_service_closed
        description: TfL's Service Closed status.
        data_tests: [not_null]
      - name: source
        description: "`plan` (PLAN 7.1) or the DECISIONS.md item that set it."
        data_tests: [not_null]

  - name: time_bands
    description: >
      Time weights by London wall-clock time (PLAN 7.1): weekday 07:00 to
      10:00 and 16:00 to 19:00 weigh 2, other weekday minutes 1, Saturday and
      Sunday 0.75. Night Tube runs only into Saturday and Sunday mornings, so
      it falls in the weekend band. Bands are [start, end) minutes after
      London midnight and cover each day class exactly once (unit test).
    columns:
      - name: day_class
        description: weekday or weekend, from day_types.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [weekday, weekend]
      - name: time_band
        description: Band name.
        data_tests: [not_null]
      - name: band_start_minute
        description: First minute of the band after London midnight.
        data_tests: [not_null]
      - name: band_end_minute
        description: Minute after the band's last, after London midnight.
        data_tests: [not_null]
      - name: time_weight
        description: The band's weight.
        data_tests: [not_null]

  - name: day_types
    description: >
      ISO day of week (London date) to the operating-hours day type and the
      time-band day class. Public holidays are not modelled in v1.
    columns:
      - name: iso_day_of_week
        description: 1 = Monday to 7 = Sunday.
        data_tests: [unique, not_null]
      - name: day_name
        description: Day name.
      - name: day_type
        description: mon_thu, fri, sat or sun, the day types of line_operating_hours.
        data_tests: [not_null]
      - name: day_class
        description: weekday or weekend.
        data_tests: [not_null]

  - name: line_operating_hours
    description: >
      v1 scheduled hours per line and day type, in minutes after the London
      midnight that starts the service day; an end past 1440 runs into the
      next day (Night Tube Fridays and Saturdays). [start, end).
      `tfl_timetable_2026_11_05`: first and last departures at the line's
      measurement stations in TfL's Line/{id}/Timetable responses recorded on
      2026-11-05 (stg_timetable), rounded out to 5 minutes. Waterloo & City
      has no weekend rows because TfL timetables no weekend service.
      `estimate_2026_11_08`: TfL returns 404 for Elizabeth line and Overground
      timetables, so these lines use 05:30 to 00:30 (Sunday 07:30 to 00:00),
      cut back where boards showed earlier last trains (Liberty, Suffragette).
      DECISIONS.md D17 tracks replacing them.
    columns:
      - name: line_id
        description: TfL line id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('lines')
                field: line_id
      - name: day_type
        description: Day type of the service day.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [mon_thu, fri, sat, sun]
      - name: service_start_minute
        description: First scheduled minute after the service day's London midnight.
        data_tests: [not_null]
      - name: service_end_minute
        description: Minute after the last scheduled one; may pass 1440.
        data_tests: [not_null]
      - name: source
        description: Where the hours come from (see the model description).
        data_tests: [not_null]

  - name: timetable_schedule_day_types
    description: >
      TfL timetable schedule names (`stg_timetable.schedule_name`) to the
      day types of line_operating_hours. A name covering several day types
      has a row for each. Holidays named in a schedule ("also Good Friday",
      "and Public Holidays") are not modelled (day_types has no holidays). A
      name missing here drops its departures from int_scheduled_headways, so
      assert_timetable_schedules_are_mapped fails the build instead.
    columns:
      - name: schedule_name
        description: TfL's schedule name, exactly as sent.
        data_tests: [not_null]
      - name: day_type
        description: Day type the schedule runs on.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [mon_thu, fri, sat, sun]

  - name: timetable_schedules_unmodelled
    description: >
      TfL schedule names known and left out on purpose (D67): their
      departures are dropped from int_scheduled_headways, as for any name not
      in timetable_schedule_day_types, but assert_timetable_schedules_are_mapped
      accepts them. From 18 November 2026 TfL sends single-weekday schedules
      ("Tuesdays", "Wednesdays", "Thursdays") for some District and
      Metropolitan stops. int_scheduled_headways sums every schedule of a day
      type, so mapping each to mon_thu would count it once per listed
      weekday. Until a weekday can be modelled on its own, a stop-direction
      whose timetable version holds only such schedules has no timetable
      for the day types they would cover; int_station_measured_hours then
      uses its no-timetable rule (hours in which a train was seen, never a
      gap, so a suspension is not detected there). Never Good Service. At a
      measurement station the mapping test still fails.
    columns:
      - name: schedule_name
        description: TfL's schedule name, exactly as sent.
        data_tests: [unique, not_null]
      - name: reason
        description: Why it is left out.
        data_tests: [not_null]

  - name: seed_line_frequencies
    description: >
      Fallback scheduled frequencies (PLAN 6.2) for measurement stations
      whose TfL timetable is unusable: TfL returns 404 for every Elizabeth
      line and Overground timetable request. Trains per hour in each
      scheduled direction, over service-day hours [from_hour, to_hour) (hours
      past 23 run into the next morning). A terminus has only the direction
      its board labels trains with; other stations have `both`. Only whole hours inside line_operating_hours
      are covered, so a part hour at either end of service has no scheduled
      headway and is not measured. Weekday peaks are 07:00 to 10:00 and
      16:00 to 19:00, as in time_bands. `estimate_2026_11_08`: from published
      service patterns, checked at mid-line stations against one weekday of
      inferred arrivals; lower where the two disagree (DECISIONS.md D33).
      Every row int_scheduled_headways takes from here is flagged
      `is_fallback`. A station that also has a timetable uses the timetable.
    columns:
      - name: line_id
        description: TfL line id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('lines')
                field: line_id
      - name: naptan_id
        description: Measurement station (config/stations.yaml; a unit test keeps them in step).
        data_tests: [not_null]
      - name: direction
        description: "`inbound`, `outbound` or `both`."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [inbound, outbound, both]
      - name: day_type
        description: Day type of the service day.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [mon_thu, fri, sat, sun]
      - name: from_hour
        description: First service-day hour the frequency covers.
        data_tests: [not_null]
      - name: to_hour
        description: Hour after the last one covered; may pass 24.
        data_tests: [not_null]
      - name: trains_per_hour
        description: Scheduled trains per hour in each direction.
        data_tests: [not_null]
      - name: source
        description: Where the frequency comes from (see the seed description).
        data_tests: [not_null]

  - name: seed_vehicle_id_lines
    description: >
      Which lines link a train's sightings by vehicle id in
      int_inferred_arrivals (PLAN 7.2 rule 1, "where it is stable";
      DECISIONS.md D26, D27). Flip `link_by_vehicle_id` and rebuild to change
      a line. Settled on 2026-11-15: Victoria and the eight lines whose ids
      the gate recheck found stable (Bakerloo, Central, Circle, Hammersmith
      & City, Jubilee, Metropolitan, Northern, Piccadilly) link by vehicle
      id; District stays on expected arrival (ids not stable), and so do
      the termini-only and unmeasured lines. `review_recommendation` holds
      the reason per line.
    columns:
      - name: line_id
        description: TfL line id.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('lines')
                field: line_id
      - name: link_by_vehicle_id
        description: True to link sightings by vehicle id on this line; false to use expected arrival only.
        data_tests: [not_null]
      - name: decision_status
        description: "`settled_<date>_d26_d27` once the owner has settled D26 and D27."
        data_tests: [not_null]
      - name: review_recommendation
        description: The week-one review's advice for the line.

  - name: seed_measurement_stations
    description: >
      Measurement stations per line with their role (core, branch,
      terminus), copied from config/stations.yaml; a unit test keeps the two
      in step. The M4 quality gate is judged on core stations (PLAN M4).
    columns:
      - name: line_id
        description: TfL line id.
        data_tests: [not_null]
      - name: naptan_id
        description: Station-level NaPTAN id whose board is polled.
        data_tests: [not_null]
      - name: station_name
        description: Station name.
      - name: role
        description: "`core`, `branch` or `terminus` (config/stations.yaml)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [core, branch, terminus]

  - name: seed_measured_lines
    description: >
      Which lines the measured view scores. A line set to false gets a
      "not measured" flag in fct_line_weekly_measured instead of numbers. Set to the
      week-one review's recommendation (docs/data-quality/2026-11-08-week-one.md):
      the DLR, trams, Waterloo & City and the Suffragette line are not
      measured. Waiting for the owner, as `decision_status` shows
      (DECISIONS.md D43).
    columns:
      - name: line_id
        description: TfL line id.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('lines')
                field: line_id
      - name: is_measured
        description: True to score the line in the measured view.
        data_tests: [not_null]
      - name: reason
        description: Why a line is not measured; empty when it is.
      - name: decision_status
        description: "`pending_owner` until the owner settles D43; then the date and outcome."
        data_tests: [not_null]

  - name: seed_industrial_action
    description: >
      Industrial action on the lines in scope (PLAN 7.4, DECISIONS.md D60),
      one row per action, each with the public source it was taken from.
      `applies_to` is `mode` (every line of that TfL mode, e.g. the whole
      Tube) or `line`. The dates are the London service days the action
      touches, inclusive: a noon-to-noon strike covers both days. Only
      `held` and `announced` actions take days out of the "strikes
      excluded" league (rpt_league_strikes_excluded); the others are kept
      for the record. An `announced` row is updated to `held` or
      `called_off` once the day has passed.
    columns:
      - name: action_id
        description: Stable id, union-scope-first day.
        data_tests: [unique, not_null]
      - name: union_name
        description: The union that called the action.
        data_tests: [not_null]
      - name: applies_to
        description: "`mode` or `line`."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [mode, line]
      - name: applies_to_id
        description: A `mode_name` or `line_id` from the lines seed.
        data_tests: [not_null]
      - name: start_london_date
        description: First London service day touched.
        data_tests: [not_null]
      - name: end_london_date
        description: Last London service day touched (inclusive).
        data_tests: [not_null]
      - name: status
        description: >
          `held`, `announced`, `called_off`, `held_no_service_impact` or
          `outcome_unknown`.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [held, announced, called_off, held_no_service_impact, outcome_unknown]
      - name: description
        description: Who struck and the hours, as the source gives them.
      - name: source_publisher
        description: Publisher of the source.
        data_tests: [not_null]
      - name: source_title
        description: Title of the source.
        data_tests: [not_null]
      - name: source_date
        description: Publication date of the source.
        data_tests: [not_null]
      - name: source_url
        description: Link to the source.
        data_tests: [not_null]

  - name: sensitivity_weight_sets
    description: >
      The alternative weight sets of the sensitivity analysis (PLAN 7.5,
      DECISIONS.md D61). Each row replaces one weight of the base seeds
      for one set: `factor` `severity` replaces a severity code's weight
      (unplanned, and planned where the base planned weight is above 0),
      `time_band` a time band's weight. Anything a set does not name keeps
      its base weight. Read by the publish code, which re-ranks each week
      from rpt_weekly_status_mix; not used by any model.
    columns:
      - name: weight_set
        description: Name of the set.
        data_tests: [not_null]
      - name: description
        description: What the set changes, in words.
        data_tests: [not_null]
      - name: factor
        description: "`severity` or `time_band`."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [severity, time_band]
      - name: factor_key
        description: A severity code or a time band name.
        data_tests: [not_null]
      - name: weight
        description: The replacement weight.
        data_tests: [not_null]

  - name: seed_line_demand
    description: >
      Typical passenger demand per NUMBAT line, service day type and London
      clock hour (ADR-020), from TfL's NUMBAT 2025 (typical autumn 2025
      day). Written by scripts/fetch_demand_data.py from pinned files;
      never edited by hand. A NUMBAT traffic day runs 05:00 to 04:59, so
      hours 0 to 4 belong to the previous calendar day's `service_day_type`.
      `mon_thu` is NUMBAT's Monday and Tuesday-to-Thursday days mixed 1:3.
      Lines without demand in a day type (trams; Waterloo & City at
      weekends) have no rows, so no data is never read as zero. Powered by
      TfL Open Data.
    columns:
      - name: numbat_line
        description: Line name as NUMBAT gives it; seed_demand_line_map maps it to TfL ids.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('seed_demand_line_map')
                field: numbat_line
      - name: service_day_type
        description: Project day type of the NUMBAT traffic day (day_types).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [mon_thu, fri, sat, sun]
      - name: hour_of_day
        description: London clock hour, 0 to 23.
        data_tests: [not_null]
      - name: boarders
        description: Passengers boarding the line in the hour (each boarding once).
        data_tests: [not_null]
      - name: link_load_sum
        description: >
          Link loads of every link of the line, both directions, summed over
          the hour: passenger-links, so a passenger riding five stops counts
          five times.
        data_tests: [not_null]

  - name: seed_demand_line_map
    description: >
      Maps each NUMBAT line to TfL line ids with the share of its demand
      each takes (D78). NUMBAT reports Circle and Hammersmith & City as one
      line; the split is an assumption. Trams are absent: NUMBAT 2025 gives
      them no demand.
    columns:
      - name: numbat_line
        description: NUMBAT line name.
        data_tests: [not_null]
      - name: line_id
        description: TfL line id.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('lines')
                field: line_id
      - name: demand_share
        description: Share of the NUMBAT line's demand given to this line; a line's shares sum to 1.
        data_tests: [not_null]
      - name: note
        description: Why a share is not 1.

  - name: seed_link_demand
    description: >
      Each NUMBAT link (adjacent platforms on one line and direction) with
      its typical daily load per project day type and its Monday-to-Thursday
      07:00 to 10:00 load (ADR-020). Read by
      scripts/analysis/critical_links.py. Written by
      scripts/fetch_demand_data.py. Powered by TfL Open Data.
    columns:
      - name: link_id
        description: NUMBAT's link code, unique within a line.
        data_tests: [not_null]
      - name: numbat_line
        description: NUMBAT line name.
        data_tests: [not_null]
      - name: direction
        description: NUMBAT direction code (NB, SB, EB, WB, IR, OR, IB, OB).
        data_tests: [not_null]
      - name: link_order
        description: Position of the link along the line in NUMBAT's listing.
      - name: from_asc
        description: NUMBAT station code of the link's start.
        data_tests: [not_null]
      - name: from_station
        description: Station name at the link's start.
      - name: to_asc
        description: NUMBAT station code of the link's end.
        data_tests: [not_null]
      - name: to_station
        description: Station name at the link's end.
      - name: mon_thu_load
        description: Passengers over the link on a typical Monday to Thursday.
      - name: fri_load
        description: Passengers over the link on a typical Friday.
      - name: sat_load
        description: Passengers over the link on a typical Saturday.
      - name: sun_load
        description: Passengers over the link on a typical Sunday.
      - name: am_peak_load
        description: Passengers over the link 07:00 to 10:00, Monday to Thursday.

  - name: seed_station_demand
    description: >
      Typical entries plus exits per station from TfL's 2025 annual counts
      (ADR-020). Null where TfL marks a station not counted ("---"), never
      zero. Written by scripts/fetch_demand_data.py. Powered by TfL Open
      Data.
    columns:
      - name: mode
        description: LU, LO, DLR or EZL as TfL lists them.
        data_tests: [not_null]
      - name: mnlc
        description: TfL's master national location code.
        data_tests: [not_null]
      - name: masc
        description: TfL's station code.
      - name: station
        description: Station name.
        data_tests: [not_null]
      - name: weekday_entries_exits
        description: Typical Tuesday-to-Thursday entries plus exits.
      - name: saturday_entries_exits
        description: Typical Saturday entries plus exits.
      - name: sunday_entries_exits
        description: Typical Sunday entries plus exits.
      - name: annual_entries_exits
        description: TfL's annualised entries plus exits.
