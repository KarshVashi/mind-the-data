version: 2

# Most tests on int_line_minute_status cover the last 7 days of `dt`; older
# days were tested when first built. The weight test covers all history,
# because a seed edit changes every row.

models:
  - name: int_utc_minutes
    description: >
      Every UTC minute from `raw_start_date` up to `minute_settle_minutes`
      before the run. The spine of int_line_minute_status, so a minute with
      no poll still gets a row and shows as missing.
    columns:
      - name: minute_utc
        description: Start of the minute, UTC.
        data_tests: [unique, not_null]
      - name: dt
        description: UTC date of the minute.
        data_tests: [not_null]

  - name: int_line_minute_status
    description: >
      One row per in-scope line per UTC minute (ADR-004). The latest
      successful line-status poll in the minute that lists the line is read;
      a minute can hold more than one poll (post-deploy smoke test, overlap).
      Of that poll's entries for the line, those with no validity period or a
      period overlapping the minute count, and the highest weight wins, then
      the lowest code, then the reason. A minute with no such entry is
      missing, never Good Service. London date, day type, time band and
      scheduled service come from the seeds day_types, time_bands and
      line_operating_hours. Rebuilt in full from `raw_start_date` each run
      (ADR-012), so a seed edit reaches every past minute and the spine has
      no holes; only the newest `tail_trim_minutes` (30) can wait for the
      next build if staging has not caught up.
    columns:
      - name: line_minute_key
        description: Row key, a hash of (line_id, minute_utc). Merge key.
        data_tests:
          - unique:
              config: &recent
                where: "dt >= current_date - interval '7' day"
          - not_null:
              config: *recent
      - name: line_id
        description: TfL line id.
        data_tests:
          - not_null:
              config: *recent
          - relationships:
              arguments:
                to: ref('dim_lines')
                field: line_id
              config: *recent
      - name: minute_utc
        description: Start of the minute, UTC.
        data_tests:
          - not_null:
              config: *recent
      - name: london_ts
        description: The minute in London wall-clock time.
        data_tests:
          - not_null:
              config: *recent
      - name: london_date
        description: London calendar date of the minute.
        data_tests:
          - not_null:
              config: *recent
      - name: week_start
        description: Monday of the minute's ISO week, London time.
        data_tests:
          - not_null:
              config: *recent
      - name: day_type
        description: Day type of the London date (seed day_types).
      - name: day_class
        description: weekday or weekend.
      - name: time_band
        description: Time band of the London minute (seed time_bands).
        data_tests:
          - not_null:
              config: *recent
      - name: time_weight
        description: Weight of the time band.
        data_tests:
          - not_null:
              config: *recent
      - name: is_scheduled
        description: Inside the line's scheduled hours (seed line_operating_hours).
        data_tests:
          - not_null:
              config: *recent
      - name: successful_polls
        description: Successful line-status requests that started in the minute.
      - name: status_poll_id
        description: Poll the minute's status was read from; null when missing.
      - name: status_severity
        description: TfL code of the worst current status; null when missing.
      - name: status_severity_description
        description: TfL text of that code.
      - name: reason
        description: TfL reason text of the worst status.
      - name: is_planned
        description: >
          TfL filed the worst status as PlannedWork, or the D69 rule classed
          it as planned works by its reason text. It is not TfL's raw
          category alone.
      - name: severity_weight
        description: >
          Weight of the worst status (seed severity_weights). Never null on an
          observed minute: an unweighted code wins its minute and fails this
          test, over all history.
        data_tests:
          - not_null:
              config:
                where: "not is_missing"
      - name: current_entries
        description: Current status entries for the line in the chosen poll.
      - name: has_closure_entry
        description: Any current entry is a closure, whether or not it won the minute.
      - name: is_missing
        description: No status known for the line in this minute.
        data_tests:
          - not_null:
              config: *recent
      - name: missing_reason
        description: >
          `no_successful_poll`, `line_not_in_poll` or `no_current_entry`;
          null when not missing.
        data_tests:
          - accepted_values:
              arguments:
                values: [no_successful_poll, line_not_in_poll, no_current_entry]
              config: *recent
      - name: is_engineering_works
        description: >
          The worst status is a closure, or planned works under a suspension
          or delay code (D69), so nothing else has a weight above 0 (ADR-004).
      - name: planned_works_basis
        description: >
          Why the worst status counts as planned works although its code is a
          suspension or delay (D69): `planned_category` (TfL filed it as
          planned work) or `reason_text` (its reason matches a
          `planned_works_reasons` pattern). Null otherwise, and always null
          when the reason says the works overran.
        data_tests:
          - accepted_values:
              arguments:
                values: [planned_category, reason_text]
              config: *recent
      - name: is_service_closed
        description: The worst status is TfL's Service Closed (D16).
      - name: is_scored
        description: Counts toward the Disruption Index and Good Service %.
        data_tests:
          - not_null:
              config: *recent
      - name: dt
        description: UTC date of the minute.
        data_tests:
          - not_null:
              config: *recent

  - name: int_status_intervals
    description: >
      Runs of consecutive minutes in one state per line, where a state is
      the worst status code and its planned flag, or missing. Reasons are
      reworded within a run; the run keeps its first. Rebuilt in full each
      run from int_line_minute_status.
    columns:
      - name: status_interval_key
        description: Row key, a hash of (line_id, interval_start_utc).
        data_tests: [unique, not_null]
      - name: line_id
        description: TfL line id.
        data_tests: [not_null]
      - name: interval_start_utc
        description: First minute of the run, UTC.
        data_tests: [not_null]
      - name: interval_end_utc
        description: Minute after the run's last, UTC.
        data_tests: [not_null]
      - name: duration_minutes
        description: Minutes in the run.
        data_tests: [not_null]
      - name: scheduled_minutes
        description: Minutes of the run inside scheduled hours.
      - name: is_missing
        description: A run of missing minutes.
        data_tests: [not_null]
      - name: status_severity
        description: TfL code; null for a missing run.
      - name: status_severity_description
        description: TfL text for the code.
      - name: is_planned
        description: >
          TfL filed the status as PlannedWork, or the D69 rule classed it as
          planned works.
      - name: severity_weight
        description: Weight of the status.
      - name: reason
        description: Reason text at the start of the run.

  - name: int_incidents
    description: >
      Unplanned disruptions per line (PLAN 6.2, D18). An incident minute is a
      scored minute whose worst status is unplanned with a weight above 0.
      Other observed minutes are quiet, including those outside service
      hours. Missing minutes are bridged, neither starting nor ending an
      incident. Incident minutes separated by fewer than
      `incident_merge_gap_minutes` (5) quiet minutes are one incident. An
      incident belongs to the London date and week it starts in. Rebuilt in
      full each run.
    columns:
      - name: incident_key
        description: Row key, a hash of (line_id, started_at).
        data_tests: [unique, not_null]
      - name: line_id
        description: TfL line id.
        data_tests: [not_null]
      - name: started_at
        description: First incident minute, UTC.
        data_tests: [not_null]
      - name: ended_at
        description: Minute after the last incident minute, UTC.
        data_tests: [not_null]
      - name: start_london_date
        description: London date of the start.
        data_tests: [not_null]
      - name: start_week_start
        description: Monday of the start's London week.
        data_tests: [not_null]
      - name: incident_minutes
        description: Incident minutes, excluding bridged gaps.
      - name: severity_weighted_minutes
        description: >
          Sum of the severity weight of each incident minute (no time
          weight); orders the week's single worst incident (M6, D48).
        data_tests: [not_null]
      - name: duration_minutes
        description: Wall-clock minutes from start to the last incident minute, inclusive.
      - name: is_open
        description: >
          Fewer quiet minutes than the merge gap follow the incident, so a
          later minute could still extend it.
        data_tests: [not_null]
      - name: recovery_minutes
        description: >
          Minutes from start until the line left the incident for good
          (duration of a closed incident); null while open (D18).
      - name: peak_severity_weight
        description: Highest weight in the incident.
      - name: worst_status_severity
        description: Code of the highest-weight status.
      - name: worst_status_description
        description: TfL text for that code.
      - name: first_reason
        description: Reason at the first incident minute.

  - name: int_scheduled_headways
    description: >
      Scheduled service per line x measurement station x direction x day type
      x weekday (single-weekday schedules only) x service-day hour x timetable version (PLAN 6.2, 7.3), the baseline for
      excess wait, long gaps and the quality gate. From TfL timetables
      (stg_timetable): every listed departure from the station, pooled over
      the timetable's routes, mapped to day types by
      timetable_schedule_day_types (a schedule for one weekday, such as
      "Tuesdays", applies only on it: `iso_day_of_week`, D67). Timetables have no platforms, so the grain
      is station and direction (D29). A gap between consecutive departures
      belongs to the hour of the later one (D30); two departures in one
      minute both count (D31). Each day's fetch is a version valid from that
      UTC date until the next; the first version also covers earlier days
      (D32). Station-directions with no timetable in any fetch take flat
      frequencies from seed_line_frequencies, flagged `is_fallback` (D33). Hours with no
      scheduled departure have no row and are not measured. The headway sums
      are additive, so rows of two service days in one London hour (Night
      Tube) can be added. Rebuilt in full each run (ADR-012, D24).
    columns:
      - name: scheduled_headway_key
        description: Row key, a hash of (line_id, naptan_id, direction, day_type, iso_day_of_week, service_hour, valid_from).
        data_tests: [unique, not_null]
      - name: line_id
        description: TfL line id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('lines')
                field: line_id
      - name: naptan_id
        description: Measurement station (the timetable's departure stop).
        data_tests: [not_null]
      - name: direction
        description: "`inbound` or `outbound`, as TfL names timetable directions."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [inbound, outbound]
      - name: day_type
        description: Day type of the service day (day_types).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [mon_thu, fri, sat, sun]
      - name: iso_day_of_week
        description: >
          ISO weekday (1 to 7) the row applies on, set for a single-weekday
          schedule and for the copies of a generic schedule in a version
          whose day type also has single-weekday schedules; null when the row
          applies on every day of its day type. Consumers match
          `iso_day_of_week is null or = the day's weekday` (D67).
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7]
                quote: false
      - name: service_hour
        description: Hour of the London service-day clock, 0 to 27; 24 and later are the next calendar morning.
        data_tests: [not_null]
      - name: london_hour
        description: "`service_hour` mod 24: the London wall-clock hour."
        data_tests: [not_null]
      - name: is_next_calendar_day
        description: The hour falls on the calendar day after the service day.
        data_tests: [not_null]
      - name: valid_from
        description: First date the version applies to (UTC date of its fetch); null for the first version, which also covers earlier days.
      - name: valid_to
        description: Date the next version takes over; null for the current one.
      - name: scheduled_departures
        description: Scheduled trains in the hour. The quality gate's denominator (PLAN 7.2).
        data_tests: [not_null]
      - name: headway_count
        description: Gaps ending in the hour. Less than scheduled_departures where the first train of the day is in the hour.
        data_tests: [not_null]
      - name: sum_headway_seconds
        description: Sum of those gaps, seconds.
        data_tests: [not_null]
      - name: sum_headway_squared_seconds
        description: Sum of the squared gaps, seconds squared.
        data_tests: [not_null]
      - name: mean_headway_seconds
        description: sum_headway_seconds / headway_count; null when there is no gap or every gap is 0 (same-minute pairs).
      - name: max_headway_seconds
        description: Longest scheduled gap ending in the hour (D34); null when there is no gap longer than 0.
      - name: scheduled_average_wait_seconds
        description: >
          PLAN 7.3 scheduled average wait for a passenger arriving at random,
          sum(H squared) / (2 x sum(H)); H / 2 when the gaps are even. Null
          without a gap.
      - name: schedule_source
        description: "`timetable` or `seed_line_frequencies`."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [timetable, seed_line_frequencies]
      - name: is_fallback
        description: The row comes from seed_line_frequencies, not a TfL timetable (PLAN 6.2).
        data_tests: [not_null]
      - name: source_detail
        description: TfL schedule name, or the seed row's source.
        data_tests: [not_null]
      - name: timetable_fetched_at
        description: When the timetable version was fetched, UTC; null for fallback rows.

  - name: int_arrivals_directed
    description: >
      stg_arrivals with a missing direction filled (D65,
      macros/fill_missing_direction.sql): from the same vehicle id's other
      sightings on the platform that UTC day, on the lines
      seed_vehicle_id_lines links by vehicle id; otherwise from a platform
      that lists one direction that day, except at a stop where any of the
      line's trains terminate that day. Never for a train terminating at
      the stop or on "Platform Unknown". The measurement-station inference reads this
      view; every lookup is per day.
    columns:
      - name: direction
        description: Listed direction, or the filled one; null when neither rule applies.
      - name: direction_source
        description: listed, vehicle or platform; null when the direction is still missing.
        data_tests:
          - accepted_values:
              arguments:
                values: [listed, vehicle, platform]
              config:
                where: "dt >= current_date - interval '2' day"
      - name: dt
        description: UTC date of the poll.

  - name: int_inferred_arrivals
    description: >
      One row per train arrival inferred at a board (PLAN 6.2, 7.2). A board
      is one platform and direction of one station request (D28). The SQL
      twin of src/mind_the_data/analysis/arrivals.py: duplicates within 15 s
      on a board are one train (D25); sightings in a station's consecutive
      successful polls link as mutual nearest pairs, by vehicle id on the
      lines seed_vehicle_id_lines switches on and by expected arrival within
      45 s elsewhere, with a standing link at the platform (D26, D27); a
      train's last sighting is an arrival when it was at most 120 s to go and
      the next successful poll does not carry it on, or when it is due at the
      end of the input; two arrivals on a board within 45 s are one (board
      flicker). Time to go is `expected_arrival - polled_at`, not TfL's
      stale `time_to_station` (D40). Placeholder vehicle ids (var
      `placeholder_vehicle_ids`) count as no id. Arrivals at the end of the
      data are provisional until the next build. Rebuilt in full each run
      (ADR-012, D24, D41).
    columns:
      - name: arrival_key
        description: Row key, a hash of (board_key, last_poll_id, arrival_time).
        data_tests: [unique, not_null]
      - name: board_key
        description: Hash of (request_path, naptan_id, line_id, platform_name, direction), nulls included.
        data_tests: [not_null]
      - name: request_path
        description: TfL path requested, which names the measurement station.
        data_tests: [not_null]
      - name: naptan_id
        description: NaPTAN id of the stop point the board is for.
        data_tests: [not_null]
      - name: line_id
        description: TfL line id.
        data_tests: [not_null]
      - name: platform_name
        description: Platform as TfL names it.
      - name: direction
        description: "`inbound` or `outbound`; null on boards that list trains arriving to terminate."
      - name: arrival_time
        description: The train's last expected arrival, UTC (PLAN 7.2 rule 3).
        data_tests: [not_null]
      - name: rule
        description: "`at_platform` when the last sighting was 0 s to go, else `left_board`."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [at_platform, left_board]
      - name: last_poll_id
        description: Poll of the train's last sighting.
        data_tests: [not_null]
      - name: last_prediction_id
        description: TfL prediction id of the last sighting.
        data_tests: [not_null]
      - name: last_seconds_to_arrival
        description: Whole seconds from the last sighting's poll to its expected arrival, floored at 0; what the 120 s rule reads.
        data_tests: [not_null]
      - name: last_time_to_station
        description: TfL's time_to_station at the last sighting, about 40 s stale; diagnostic only.
        data_tests: [not_null]
      - name: last_vehicle_id
        description: Vehicle id at the last sighting, placeholders as null. Diagnostic.
      - name: links_by_vehicle_id
        description: The line linked sightings by vehicle id in this build (seed_vehicle_id_lines).
        data_tests: [not_null]
      - name: last_seen_at
        description: Poll time of the last sighting, UTC.
        data_tests: [not_null]
      - name: confirmed_at
        description: >
          Poll time of the station's next successful poll, in which the train
          was absent, UTC. Null for an at-platform arrival at the end of the
          data. A long wait after last_seen_at is a collection gap, not a
          long headway (D28).
      - name: dt
        description: UTC date of arrival_time.
        data_tests: [not_null]

  - name: int_headways
    description: >
      Gaps between consecutive inferred arrivals per line, measurement
      station and direction (PLAN 6.2, 7.3), platforms pooled (D29). Only the
      lines each station is measured for, and only boards with a direction:
      null-direction boards list trains arriving to terminate, which have no
      timetable. A gap belongs to the London hour of the arrival that ends
      it (D30). A gap across a collection gap at the station is flagged and
      left out of the metrics (D28).
    columns:
      - name: headway_key
        description: arrival_key of the arrival that ends the gap.
        data_tests: [unique, not_null]
      - name: line_id
        description: TfL line id.
        data_tests: [not_null]
      - name: naptan_id
        description: Measurement station.
        data_tests: [not_null]
      - name: request_path
        description: TfL path requested for the station.
        data_tests: [not_null]
      - name: direction
        description: "`inbound` or `outbound`."
        data_tests: [not_null]
      - name: previous_arrival_time
        description: Arrival that starts the gap, UTC.
        data_tests: [not_null]
      - name: arrival_time
        description: Arrival that ends the gap, UTC.
        data_tests: [not_null]
      - name: headway_seconds
        description: Gap in seconds.
        data_tests: [not_null]
      - name: spans_collection_gap
        description: The station went more than `collection_gap_seconds` between successful polls inside the gap.
        data_tests: [not_null]
      - name: previous_london_ts
        description: previous_arrival_time in London time.
      - name: london_ts
        description: arrival_time in London time.
      - name: london_date
        description: London date of arrival_time.
      - name: london_hour
        description: London hour of arrival_time, which owns the gap (D30).
      - name: week_start
        description: Monday of the London ISO week.

  - name: int_vehicle_passes
    description: >
      Trains seen on the arrival boards, by vehicle id (ADR-014): one row
      per visit of a vehicle id to a station and direction (sightings no
      more than `vehicle_pass_visit_gap_seconds` apart, any platform) that
      came within `vehicle_pass_threshold_seconds` of the station. The pass
      time is the expected arrival of the visit's last sighting. Placeholder
      ids and sightings without an id or a direction are left out. Feeds the
      quality gate and trains run in int_measured_hours.
    columns:
      - name: vehicle_pass_key
        description: Row key, a hash of (line_id, naptan_id, direction, vehicle_id, first_seen_at).
        data_tests: [unique, not_null]
      - name: line_id
        description: TfL line id of the board's prediction.
        data_tests: [not_null]
      - name: naptan_id
        description: Stop the prediction is for.
        data_tests: [not_null]
      - name: direction
        description: TfL direction on the board.
        data_tests: [not_null]
      - name: vehicle_id
        description: TfL vehicle id.
        data_tests: [not_null]
      - name: visit_number
        description: The visit's position among the id's visits to the station and direction.
      - name: first_seen_at
        description: First sighting in the visit, UTC.
      - name: last_seen_at
        description: Last sighting in the visit, UTC.
      - name: sightings
        description: Sightings in the visit.
      - name: min_seconds_to_arrival
        description: Closest the train came, seconds to go as of the poll (D40).
      - name: pass_time
        description: Expected arrival of the visit's last sighting, UTC.
        data_tests: [not_null]
      - name: london_date
        description: London date of pass_time.
        data_tests: [not_null]
      - name: london_hour
        description: London hour of pass_time.
        data_tests: [not_null]

  - name: int_measured_hours
    description: >
      The measured view per line x measurement station x direction x London
      date x London hour, for every hour with scheduled service on a day the
      collector ran (PLAN 7.2, 7.3). Holds the quality gate (ADR-014:
      inferred trains against the trains observed on the boards), trains run
      against the timetable, headway sums, long gaps and excess wait. Scheduled service adds the day's service hour and the
      previous day's Night Tube hour (D30). An hour is observed with at least
      54 successful arrivals polls and no collection gap; only observed hours
      are gated. An hour counts for Experienced Reliability when its line is
      measured (seed_measured_lines, D43) and it is inside the band.
    columns:
      - name: measured_hour_key
        description: Row key, a hash of (line_id, naptan_id, direction, london_date, london_hour).
        data_tests: [unique, not_null]
      - name: line_id
        description: TfL line id.
        data_tests: [not_null]
      - name: naptan_id
        description: Measurement station.
        data_tests: [not_null]
      - name: request_path
        description: TfL path requested for the station.
      - name: direction
        description: "`inbound` or `outbound`."
        data_tests: [not_null]
      - name: role
        description: Station role from config/stations.yaml; the M4 gate is judged on `core`.
        data_tests: [not_null]
      - name: london_date
        description: London date.
        data_tests: [not_null]
      - name: london_hour
        description: London hour, 0 to 23.
        data_tests: [not_null]
      - name: week_start
        description: Monday of the London ISO week.
      - name: is_line_measured
        description: seed_measured_lines scores the line.
        data_tests: [not_null]
      - name: is_fallback
        description: Scheduled service comes from seed_line_frequencies (D33); a gate pass is weak evidence.
      - name: successful_polls
        description: Successful arrivals polls of the station in the hour.
      - name: is_observed
        description: At least `min_polls_per_hour` (54) successful polls, no collection gap touching the hour, and one UTC hour (not the October fall-back hour).
        data_tests: [not_null]
      - name: scheduled_departures
        description: Scheduled trains in the hour.
        data_tests: [not_null]
      - name: inferred_arrivals
        description: Inferred arrivals in the hour, platforms pooled.
        data_tests: [not_null]
      - name: vehicle_passes
        description: Vehicle-id passes in the hour (int_vehicle_passes), platforms pooled.
        data_tests: [not_null]
      - name: inferred_without_vehicle_id
        description: Inferred arrivals whose last sighting had no vehicle id (or a placeholder); counted as observed as they are.
        data_tests: [not_null]
      - name: observed_trains
        description: Trains observed on the boards, vehicle_passes + inferred_without_vehicle_id (ADR-014).
        data_tests: [not_null]
      - name: arrival_ratio
        description: inferred_arrivals / scheduled_departures, the PLAN 7.2 gate's ratio before ADR-014; kept for comparison.
      - name: trains_run_ratio
        description: observed_trains / scheduled_departures, trains run against the timetable. The boards may omit trains, so this is a lower bound on what ran.
      - name: fidelity_ratio
        description: inferred_arrivals / observed_trains, the gate's ratio; null with no train on the boards.
      - name: is_gate_judged
        description: Observed with at least one train on the boards; the gate test's denominator.
        data_tests: [not_null]
      - name: is_in_band
        description: Judged and fidelity_ratio within `gate_low_ratio` to `gate_high_ratio` (0.8 to 1.2).
        data_tests: [not_null]
      - name: counts_for_reliability
        description: The line is measured and the hour is in band; only these hours feed fct_line_weekly_measured's metrics.
        data_tests: [not_null]
      - name: headways
        description: Observed headways ending in the hour, gaps across collection gaps left out.
      - name: sum_headway_seconds
        description: Sum of those headways.
      - name: sum_headway_squared_seconds
        description: Sum of their squares.
      - name: max_headway_seconds
        description: Longest observed headway in the hour.
      - name: long_gaps
        description: Headways over twice scheduled_max_headway_seconds (D34).
      - name: good_service_long_gaps
        description: >
          Of long_gaps, those whose whole span, from the minute of the train
          before to the minute of the train that ends the gap, the line's
          declared status was Good Service with no missing minute (D68). The
          Honesty Gap's evidence.
        data_tests: [not_null]
      - name: scheduled_max_headway_seconds
        description: Longest scheduled gap in the hour.
      - name: actual_average_wait_seconds
        description: PLAN 7.3 sum(h squared) / (2 x sum(h)) over observed headways.
      - name: scheduled_average_wait_seconds
        description: The same over scheduled headways.
      - name: excess_wait_seconds
        description: actual minus scheduled average wait; negative kept.

  - name: int_station_arrivals_directed
    description: >
      stg_line_arrivals with a missing direction filled (D65,
      macros/fill_missing_direction.sql): from the same vehicle id's other
      sightings on the platform that UTC day, on the lines
      seed_vehicle_id_lines links by vehicle id; otherwise from a platform
      that lists one direction that day, except at a stop where any of the
      line's trains terminate that day. Never for a train terminating at
      the stop or on "Platform Unknown". The every-station inference reads this
      view; every lookup is per day.
    columns:
      - name: direction
        description: Listed direction, or the filled one; null when neither rule applies.
      - name: direction_source
        description: listed, vehicle or platform; null when the direction is still missing.
        data_tests:
          - accepted_values:
              arguments:
                values: [listed, vehicle, platform]
              config:
                where: "dt >= current_date - interval '2' day"
      - name: dt
        description: UTC date of the poll.

  - name: int_station_inferred_arrivals
    description: >
      Train arrivals at every station on every line (M8), inferred from the
      line feed (stg_line_arrivals, stg_line_arrival_polls) with exactly the
      rules of int_inferred_arrivals (macros/inference.sql). A board is one
      stop's platform and direction within a line's response, and the next
      poll is the line's next successful poll. Incremental: each run deletes
      and recomputes the arrivals dated in the staging window, reading one
      day of polls before it (macros/window_rebuild.sql), because the line
      feed is too large to rebuild in full. Tests cover the last 7 days.
    columns:
      - name: arrival_key
        description: Row key, a hash of (board_key, last poll, expected arrival). Merge key.
        data_tests:
          - unique:
              config:
                where: "dt >= current_date - interval '7' day"
          - not_null:
              config:
                where: "dt >= current_date - interval '7' day"
      - name: board_key
        description: Hash of (request_path, naptan_id, line_id, platform_name, direction).
      - name: request_path
        description: "Line request, `/Line/{lineId}/Arrivals`."
      - name: naptan_id
        description: Stop the train arrived at.
      - name: line_id
        description: TfL line id.
      - name: platform_name
        description: Platform as TfL names it.
      - name: direction
        description: "`inbound` or `outbound`; null for trains arriving to terminate."
      - name: arrival_time
        description: Inferred arrival, UTC (the last sighting's expected arrival).
      - name: rule
        description: "`left_board` or `at_platform`, as in int_inferred_arrivals."
      - name: last_poll_id
        description: Poll of the train's last sighting.
      - name: last_prediction_id
        description: TfL prediction id at the last sighting.
      - name: last_seconds_to_arrival
        description: Seconds to go at the last sighting, from the poll time.
      - name: last_time_to_station
        description: TfL's timeToStation at the last sighting.
      - name: last_vehicle_id
        description: Vehicle id at the last sighting; null for none or a placeholder.
      - name: links_by_vehicle_id
        description: True when the line links sightings by vehicle id (seed_vehicle_id_lines).
      - name: last_seen_at
        description: Poll time of the last sighting, UTC.
      - name: confirmed_at
        description: The next successful poll, which no longer carried the train; null at the end of the input.
      - name: dt
        description: UTC date of the arrival. Partition column.

  - name: int_station_vehicle_passes
    description: >
      Trains seen on every station's boards in the line feed, counted by
      vehicle id, with exactly the rules of int_vehicle_passes
      (macros/inference.sql); the station quality gate's count of trains on
      the boards. Incremental like int_station_inferred_arrivals, by the
      London date of the pass. Tests cover the last 7 days.
    columns:
      - name: vehicle_pass_key
        description: Row key, a hash of (line_id, naptan_id, direction, vehicle_id, first_seen_at). Merge key.
        data_tests:
          - unique:
              config:
                where: "london_date >= current_date - interval '7' day"
          - not_null:
              config:
                where: "london_date >= current_date - interval '7' day"
      - name: line_id
        description: TfL line id.
      - name: naptan_id
        description: Stop.
      - name: direction
        description: "`inbound` or `outbound`."
      - name: vehicle_id
        description: TfL vehicle id.
      - name: visit_number
        description: Visit count within the run's read window; not stable across runs.
      - name: first_seen_at
        description: First sighting of the visit, UTC.
      - name: last_seen_at
        description: Last sighting of the visit, UTC.
      - name: sightings
        description: Sightings in the visit.
      - name: min_seconds_to_arrival
        description: Closest the train came, in seconds to go.
      - name: pass_time
        description: Expected arrival at the last sighting, UTC.
      - name: london_date
        description: London date of the pass. Partition column.
      - name: london_hour
        description: London hour of the pass.

  - name: int_station_headways
    description: >
      Gaps between consecutive inferred arrivals per line, station and
      direction for every station (M8), from int_station_inferred_arrivals,
      with exactly the rules of int_headways (macros/inference.sql): platforms
      pooled, terminating trains left out, each gap in the London hour of the
      arrival that ends it, and gaps across a gap in the line feed's polls
      flagged (D28).
    columns:
      - name: headway_key
        description: The arrival_key of the arrival that ends the gap.
        data_tests: [unique, not_null]
      - name: line_id
        description: TfL line id.
        data_tests: [not_null]
      - name: naptan_id
        description: Station.
        data_tests: [not_null]
      - name: request_path
        description: Line request.
        data_tests: [not_null]
      - name: direction
        description: "`inbound` or `outbound`."
        data_tests: [not_null]
      - name: previous_arrival_time
        description: Arrival that starts the gap, UTC.
        data_tests: [not_null]
      - name: arrival_time
        description: Arrival that ends the gap, UTC.
        data_tests: [not_null]
      - name: headway_seconds
        description: Length of the gap in seconds.
        data_tests: [not_null]
      - name: spans_collection_gap
        description: True when the line went more than collection_gap_seconds between successful polls inside the gap.
        data_tests: [not_null]
      - name: previous_london_ts
        description: previous_arrival_time in London time.
      - name: london_ts
        description: arrival_time in London time.
      - name: london_date
        description: London date of the ending arrival.
      - name: london_hour
        description: London hour of the ending arrival.
      - name: week_start
        description: Monday of the London week of the ending arrival.

  - name: int_station_measured_hours
    description: >
      The measured view's hours for every station (M8): one row per line,
      station, direction and London hour of service, with the quality gate
      of int_measured_hours (ADR-014) on the line feed. Hours of service are
      the timetable's where the station-direction has one that day
      (is_scheduled), otherwise the hours in which any train was inferred or
      seen (Elizabeth line and Overground stations have no TfL timetable).
      Only days on which the line's feed had a successful poll. The model
      comment has the full rules.
    columns:
      - name: station_measured_hour_key
        description: Row key, a hash of (line_id, naptan_id, direction, london_date, london_hour).
        data_tests: [unique, not_null]
      - name: line_id
        description: TfL line id.
        data_tests: [not_null]
      - name: naptan_id
        description: Station.
        data_tests: [not_null]
      - name: request_path
        description: The line's request, whose polls decide whether the hour was observed.
        data_tests: [not_null]
      - name: direction
        description: "`inbound` or `outbound`."
        data_tests: [not_null]
      - name: london_date
        description: London date.
        data_tests: [not_null]
      - name: london_hour
        description: London hour, 0 to 23.
        data_tests: [not_null]
      - name: week_start
        description: Monday of the London week.
        data_tests: [not_null]
      - name: is_scheduled
        description: True when the hour comes from a timetable; false when it is an hour with trains at a station-direction with no timetable that day.
        data_tests: [not_null]
      - name: is_fallback
        description: True when the timetable is seed_line_frequencies' estimate; null without a timetable.
      - name: successful_polls
        description: Successful line_arrivals polls of the line in the hour.
        data_tests: [not_null]
      - name: is_observed
        description: At least min_polls_per_hour polls, no collection gap touching the hour, and one UTC hour.
        data_tests: [not_null]
      - name: scheduled_departures
        description: Timetabled trains in the hour; null without a timetable.
      - name: scheduled_sum_headway_seconds
        description: Sum of the hour's scheduled gaps; null without a timetable.
      - name: scheduled_sum_headway_squared_seconds
        description: Sum of the squares of the hour's scheduled gaps; null without a timetable.
      - name: scheduled_max_headway_seconds
        description: Longest scheduled gap of the hour, for the long-gap rule (D34); null without a timetable.
      - name: inferred_arrivals
        description: Trains inferred in the hour (int_station_inferred_arrivals).
        data_tests: [not_null]
      - name: vehicle_passes
        description: Vehicle-id passes in the hour (int_station_vehicle_passes).
        data_tests: [not_null]
      - name: inferred_without_vehicle_id
        description: Inferred trains with no vehicle id.
        data_tests: [not_null]
      - name: observed_trains
        description: Trains on the boards, vehicle_passes + inferred_without_vehicle_id.
        data_tests: [not_null]
      - name: fidelity_ratio
        description: inferred_arrivals / observed_trains; null with no train on the boards.
      - name: is_gate_judged
        description: Observed, with anything on the boards or inferred.
        data_tests: [not_null]
      - name: is_in_band
        description: Observed and the fidelity ratio within gate_low_ratio to gate_high_ratio.
        data_tests: [not_null]
      - name: scheduled_average_wait_seconds
        description: Expected wait for a passenger arriving at random, from the timetable; null without one.

  - name: int_station_service_headways
    description: >
      The gaps the station measured view uses (M8): gaps from
      int_station_headways that span no collection gap and whose every
      London hour is an hour of service in int_station_measured_hours, so an
      overnight break or a run of hours without trains at an untimetabled
      station is never one long gap. Each carries the hour it ends in.
    columns:
      - name: headway_key
        description: The arrival_key of the arrival that ends the gap.
        data_tests: [unique, not_null]
      - name: line_id
        description: TfL line id.
        data_tests: [not_null]
      - name: naptan_id
        description: Station.
        data_tests: [not_null]
      - name: direction
        description: "`inbound` or `outbound`."
        data_tests: [not_null]
      - name: london_date
        description: London date of the ending arrival.
        data_tests: [not_null]
      - name: london_hour
        description: London hour of the ending arrival.
        data_tests: [not_null]
      - name: week_start
        description: Monday of the London week of the ending arrival.
        data_tests: [not_null]
      - name: previous_arrival_time
        description: Arrival that starts the gap, UTC.
      - name: arrival_time
        description: Arrival that ends the gap, UTC.
      - name: headway_seconds
        description: Length of the gap in seconds.
        data_tests: [not_null]
      - name: is_scheduled
        description: Whether the ending hour has a timetable.
        data_tests: [not_null]
      - name: scheduled_max_headway_seconds
        description: Longest scheduled gap of the ending hour; null without a timetable.
      - name: is_in_band
        description: Whether the ending hour passed the quality gate.
        data_tests: [not_null]
      - name: is_long_gap
        description: More than twice the ending hour's longest scheduled gap (D34); null without a timetable (no scheduled gap to judge it by).
