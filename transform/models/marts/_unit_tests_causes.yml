version: 2

unit_tests:
  - name: rpt_disruption_causes_weekly_shares_by_hand
    description: >
      D74, weeks of 9 and 16 November 2026. Central has 8 disrupted minutes
      in the first: 4 train cancellations (weights 1, 1, 1, 3 = 6), 2 points
      failures (both suspended, weights 8 and 5 = 13) and 2 with no cause
      (weight 2). Shares of disrupted minutes 4/8 = 0.5, 2/8 = 0.25 and
      0.25. Its suspended minutes are the 2 points failures, so their
      suspended share is 2/2 = 1 and the others' 0. Victoria has 8: 4 train
      cancellations (4), 2 points failures (2) and 2 signal failures (3 + 3
      = 6), none suspended, so its suspended share is null (no suspended
      minutes, not zero). The network row adds the lines: 16 disrupted
      minutes, train cancellations 8 (0.5, weighted 10), points failures 4
      (0.25, weighted 15, suspended 2 of 2 = 1), signal failures 2 (0.125,
      6), no cause 2 (0.125, 2). A cause with no minutes has no row. The
      second week stays apart.
    model: rpt_disruption_causes_weekly
    given:
      - input: ref('int_status_causes')
        rows:
          - {line_id: central, week_start: "2026-11-09", cause: Train cancellations, is_suspended: false, severity_weight: 1}
          - {line_id: central, week_start: "2026-11-09", cause: Train cancellations, is_suspended: false, severity_weight: 1}
          - {line_id: central, week_start: "2026-11-09", cause: Train cancellations, is_suspended: false, severity_weight: 1}
          - {line_id: central, week_start: "2026-11-09", cause: Train cancellations, is_suspended: false, severity_weight: 3}
          - {line_id: central, week_start: "2026-11-09", cause: Points failures, is_suspended: true, severity_weight: 8}
          - {line_id: central, week_start: "2026-11-09", cause: Points failures, is_suspended: true, severity_weight: 5}
          - {line_id: central, week_start: "2026-11-09", cause: No cause given, is_suspended: false, severity_weight: 1}
          - {line_id: central, week_start: "2026-11-09", cause: No cause given, is_suspended: false, severity_weight: 1}
          - {line_id: victoria, week_start: "2026-11-09", cause: Train cancellations, is_suspended: false, severity_weight: 1}
          - {line_id: victoria, week_start: "2026-11-09", cause: Train cancellations, is_suspended: false, severity_weight: 1}
          - {line_id: victoria, week_start: "2026-11-09", cause: Train cancellations, is_suspended: false, severity_weight: 1}
          - {line_id: victoria, week_start: "2026-11-09", cause: Train cancellations, is_suspended: false, severity_weight: 1}
          - {line_id: victoria, week_start: "2026-11-09", cause: Points failures, is_suspended: false, severity_weight: 1}
          - {line_id: victoria, week_start: "2026-11-09", cause: Points failures, is_suspended: false, severity_weight: 1}
          - {line_id: victoria, week_start: "2026-11-09", cause: Signal failures, is_suspended: false, severity_weight: 3}
          - {line_id: victoria, week_start: "2026-11-09", cause: Signal failures, is_suspended: false, severity_weight: 3}
          - {line_id: victoria, week_start: "2026-11-16", cause: Signal failures, is_suspended: false, severity_weight: 3}
    expect:
      rows:
        - {week_start: "2026-11-09", line_id: central, is_network: false, cause: Train cancellations, minutes: 4, disrupted_minutes: 8, share_of_disrupted: 0.5, suspended_minutes: 0, share_of_suspended: 0, weighted_minutes: 6}
        - {week_start: "2026-11-09", line_id: central, is_network: false, cause: Points failures, minutes: 2, disrupted_minutes: 8, share_of_disrupted: 0.25, suspended_minutes: 2, share_of_suspended: 1, weighted_minutes: 13}
        - {week_start: "2026-11-09", line_id: central, is_network: false, cause: No cause given, minutes: 2, disrupted_minutes: 8, share_of_disrupted: 0.25, suspended_minutes: 0, share_of_suspended: 0, weighted_minutes: 2}
        - {week_start: "2026-11-09", line_id: victoria, is_network: false, cause: Train cancellations, minutes: 4, disrupted_minutes: 8, share_of_disrupted: 0.5, suspended_minutes: 0, share_of_suspended: null, weighted_minutes: 4}
        - {week_start: "2026-11-09", line_id: victoria, is_network: false, cause: Points failures, minutes: 2, disrupted_minutes: 8, share_of_disrupted: 0.25, suspended_minutes: 0, share_of_suspended: null, weighted_minutes: 2}
        - {week_start: "2026-11-09", line_id: victoria, is_network: false, cause: Signal failures, minutes: 2, disrupted_minutes: 8, share_of_disrupted: 0.25, suspended_minutes: 0, share_of_suspended: null, weighted_minutes: 6}
        - {week_start: "2026-11-09", line_id: network, is_network: true, cause: Train cancellations, minutes: 8, disrupted_minutes: 16, share_of_disrupted: 0.5, suspended_minutes: 0, share_of_suspended: 0, weighted_minutes: 10}
        - {week_start: "2026-11-09", line_id: network, is_network: true, cause: Points failures, minutes: 4, disrupted_minutes: 16, share_of_disrupted: 0.25, suspended_minutes: 2, share_of_suspended: 1, weighted_minutes: 15}
        - {week_start: "2026-11-09", line_id: network, is_network: true, cause: No cause given, minutes: 2, disrupted_minutes: 16, share_of_disrupted: 0.125, suspended_minutes: 0, share_of_suspended: 0, weighted_minutes: 2}
        - {week_start: "2026-11-09", line_id: network, is_network: true, cause: Signal failures, minutes: 2, disrupted_minutes: 16, share_of_disrupted: 0.125, suspended_minutes: 0, share_of_suspended: 0, weighted_minutes: 6}
        - {week_start: "2026-11-16", line_id: victoria, is_network: false, cause: Signal failures, minutes: 1, disrupted_minutes: 1, share_of_disrupted: 1, suspended_minutes: 0, share_of_suspended: null, weighted_minutes: 3}
        - {week_start: "2026-11-16", line_id: network, is_network: true, cause: Signal failures, minutes: 1, disrupted_minutes: 1, share_of_disrupted: 1, suspended_minutes: 0, share_of_suspended: null, weighted_minutes: 3}
