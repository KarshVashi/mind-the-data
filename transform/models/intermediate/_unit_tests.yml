  - name: int_line_minute_status_london_calendar_and_clock_changes
    description: >
      London date, ISO week, time band and service hours across both clock
      changes, with no polls (every minute missing, never Good Service).
      2026-10-25 00:30 and 01:30 UTC are both 01:30 London on Sunday 25
      October (BST, then GMT), weekend band 0.75, week of Monday 19 October;
      Victoria runs Saturday's Night Tube until 03:15 (1635 - 1440 minutes),
      Bakerloo is closed. 2026-10-26 00:05 UTC is Monday 00:05 GMT: new week
      (26 October), weekday early band (1); Victoria's Sunday service runs to
      00:10 (1450) so it is in service, Bakerloo's ends at midnight (1440).
      2027-03-28 01:30 UTC is 02:30 BST on Sunday 28 March (week of 22
      March), Victoria Night Tube in service. 2027-03-28 23:05 UTC is
      already Monday 29 March 00:05 BST: week of 29 March, Victoria in
      service until 00:10. 2026-11-07 02:00 UTC is Saturday 02:00 GMT:
      Friday's Night Tube keeps Victoria in service. 2026-11-04 17:30 UTC is
      Wednesday pm_peak (2); 2026-10-21 07:30 UTC is 08:30 BST Wednesday,
      am_peak (2); both lines in service.
    model: int_line_minute_status
    # No staged poll at all, so the tail trim keeps every spine minute.
    overrides:
      vars:
        raw_start_date: "2026-10-01"
    given:
      - input: ref('int_utc_minutes')
        rows:
          - {minute_utc: "2026-10-25 00:30:00", dt: "2026-10-25"}
          - {minute_utc: "2026-10-25 01:30:00", dt: "2026-10-25"}
          - {minute_utc: "2026-10-26 00:05:00", dt: "2026-10-26"}
          - {minute_utc: "2027-03-28 01:30:00", dt: "2027-03-28"}
          - {minute_utc: "2027-03-28 23:05:00", dt: "2027-03-28"}
          - {minute_utc: "2026-11-07 02:00:00", dt: "2026-11-07"}
          - {minute_utc: "2026-11-04 17:30:00", dt: "2026-11-04"}
          - {minute_utc: "2026-10-21 07:30:00", dt: "2026-10-21"}
      - input: ref('dim_lines')
        rows:
          - {line_id: victoria}
          - {line_id: bakerloo}
      - input: ref('day_types')
        rows: *day_types
      - input: ref('time_bands')
        rows: *time_bands
      - input: ref('line_operating_hours')
        rows: *operating_hours
      - input: ref('severity_weights')
        rows: *severity_weights
      - input: ref('stg_polls')
        rows: []
      - input: ref('stg_line_status')
        rows: []
    expect:
      rows:
        - {line_id: victoria, minute_utc: "2026-10-25 00:30:00", london_ts: "2026-10-25 01:30:00", london_date: "2026-10-25", week_start: "2026-10-19", time_band: weekend, time_weight: 0.75, is_scheduled: true, is_missing: true, missing_reason: no_successful_poll, is_scored: false}
        - {line_id: bakerloo, minute_utc: "2026-10-25 00:30:00", london_ts: "2026-10-25 01:30:00", london_date: "2026-10-25", week_start: "2026-10-19", time_band: weekend, time_weight: 0.75, is_scheduled: false, is_missing: true, missing_reason: no_successful_poll, is_scored: false}
        - {line_id: victoria, minute_utc: "2026-10-25 01:30:00", london_ts: "2026-10-25 01:30:00", london_date: "2026-10-25", week_start: "2026-10-19", time_band: weekend, time_weight: 0.75, is_scheduled: true, is_missing: true, missing_reason: no_successful_poll, is_scored: false}
        - {line_id: bakerloo, minute_utc: "2026-10-25 01:30:00", london_ts: "2026-10-25 01:30:00", london_date: "2026-10-25", week_start: "2026-10-19", time_band: weekend, time_weight: 0.75, is_scheduled: false, is_missing: true, missing_reason: no_successful_poll, is_scored: false}
        - {line_id: victoria, minute_utc: "2026-10-26 00:05:00", london_ts: "2026-10-26 00:05:00", london_date: "2026-10-26", week_start: "2026-10-26", time_band: early, time_weight: 1, is_scheduled: true, is_missing: true, missing_reason: no_successful_poll, is_scored: false}
