  - name: int_arrivals_directed_fills_a_missing_direction
    description: >
      D65 by hand: min 3 predictions per platform, share 0.75, vehicle-id
      linking on the Metropolitan only. At stop X: 201's null on P1 takes
      outbound from its own sighting (vehicle); placeholder 000 and 205
      (empty direction) take P1's outbound (platform). P2 lists inbound once
      and outbound twice (0.67), and 202 lists both ways there, so 202's
      null stays null. 201 on 11 Nov stays null (same UTC day only). 201 on
      "Platform Unknown" is never filled. 207 with no platform name fills
      from its own sighting. 208's inbound on P5 does not fill its null on
      P6. P7 lists outbound 3 times and inbound once (exactly 0.75): 213's
      own inbound beats it, 214 takes outbound. The District does not link
      by vehicle id, but D1 lists outbound 3 times, so 301 takes it from the
      platform; on D2 (one prediction) 304 stays null. Stop Y is a turnback
      that day (404 terminates there): 404 is never filled, 405 gets no
      platform fill although Q1 lists outbound 3 times, and 401 still fills
      from its own sighting.
    model: int_arrivals_directed
    overrides:
      vars:
        placeholder_vehicle_ids: ["000", "001"]
        direction_fill_platform_share: 0.75
        direction_fill_min_predictions: 3
    given:
      - input: ref('seed_vehicle_id_lines')
        rows:
          - {line_id: metropolitan, link_by_vehicle_id: true}
          - {line_id: district, link_by_vehicle_id: false}
