version: 2

# Hand-written envelopes shaped like the recorded fixtures in
# tests/fixtures/tfl/. Inputs are SQL so the `request` struct and the JSON
# payload text keep their real types. Unit tests run in the warehouse.

unit_tests:
  - name: stg_line_status_keeps_every_entry_and_drops_failed_polls
    description: >
      Victoria carries Severe Delays and a planned Part Closure at once: both
      entries are kept (ADR-004), the closure is planned and the delay is
      not. Bakerloo's Good Service has no validity periods and keeps one row
      with null period columns. A 503 and a timed-out request add no rows.
    model: stg_line_status
    given:
      - input: source('raw', 'line_status')
        format: sql
        rows: |
          select
              'p1' as poll_id,
              '2026-11-03T08:15:00.123Z' as polled_at,
              'line_status' as feed,
              cast(row('/Line/Mode/tube/Status') as row(path varchar)) as request,
              200 as http_status,
              180 as latency_ms,
              cast(null as varchar) as error,
              '[{"id": "victoria", "name": "Victoria", "modeName": "tube", "lineStatuses": [
                  {"statusSeverity": 6, "statusSeverityDescription": "Severe Delays",
                   "reason": "Victoria Line: Severe delays due to a signal failure.",
                   "created": "0001-01-01T00:00:00",
                   "validityPeriods": [{"fromDate": "2026-11-03T08:01:00Z",
                                        "toDate": "2026-11-03T09:30:00Z", "isNow": true}],
                   "disruption": {"category": "RealTime", "description": "Signal failure."}},
                  {"statusSeverity": 5, "statusSeverityDescription": "Part Closure",
                   "reason": "No service between Seven Sisters and Walthamstow Central.",
                   "validityPeriods": [{"fromDate": "2026-11-03T00:00:00Z",
                                        "toDate": "2026-11-03T23:59:00Z", "isNow": true}],
                   "disruption": {"category": "PlannedWork", "description": "Planned works."}}]},
                {"id": "bakerloo", "name": "Bakerloo", "modeName": "tube", "lineStatuses": [
                  {"statusSeverity": 10, "statusSeverityDescription": "Good Service",
                   "created": "0001-01-01T00:00:00", "validityPeriods": []}]}]' as payload,
              '2026-11-03' as dt,
              '08' as hour
          union all
          select
              'p2',
              '2026-11-03T08:16:00.045Z',
              'line_status',
              cast(row('/Line/Mode/tube/Status') as row(path varchar)),
              503,
              95,
              cast(null as varchar),
              cast(null as varchar),
              '2026-11-03',
              '08'
          union all
          select
              'p3',
              '2026-11-03T08:17:00.001Z',
              'line_status',
              cast(row('/Line/Mode/tube/Status') as row(path varchar)),
              cast(null as integer),
              45000,
              'timeout',
              cast(null as varchar),
              '2026-11-03',
              '08'
    expect:
      rows:
        - poll_id: p1
          polled_at: "2026-11-03 08:15:00.123"
          poll_minute: "2026-11-03 08:15:00"
          line_id: victoria
          mode_name: tube
          status_ordinal: 1
          status_severity: 6
          is_planned: false
          validity_ordinal: 1
          valid_from: "2026-11-03 08:01:00"
          valid_to: "2026-11-03 09:30:00"
        - poll_id: p1
          polled_at: "2026-11-03 08:15:00.123"
          poll_minute: "2026-11-03 08:15:00"
          line_id: victoria
          mode_name: tube
          status_ordinal: 2
          status_severity: 5
          is_planned: true
          validity_ordinal: 1
          valid_from: "2026-11-03 00:00:00"
          valid_to: "2026-11-03 23:59:00"
        - poll_id: p1
          polled_at: "2026-11-03 08:15:00.123"
          poll_minute: "2026-11-03 08:15:00"
          line_id: bakerloo
          mode_name: tube
          status_ordinal: 1
          status_severity: 10
          is_planned: false
          validity_ordinal: null
          valid_from: null
          valid_to: null

  - name: stg_arrivals_parses_a_prediction_and_nulls_placeholder_dates
    description: >
      One Oxford Circus prediction, listed twice by TfL, gives one row. The
      seven-digit fraction on TfL's timestamp is read to the millisecond, and
      the 0001-01-01 placeholder in timeToLive becomes null.
    model: stg_arrivals
    given:
      - input: source('raw', 'arrivals')
        format: sql
        rows: |
          select
              'p1' as poll_id,
              '2026-11-03T08:15:00.123Z' as polled_at,
              'arrivals' as feed,
              cast(row('/StopPoint/940GZZLUOXC/Arrivals') as row(path varchar)) as request,
              200 as http_status,
              184 as latency_ms,
              cast(null as varchar) as error,
              '[{"id": "351445571", "vehicleId": "223", "naptanId": "940GZZLUOXC",
                 "stationName": "Oxford Circus Underground Station", "lineId": "bakerloo",
                 "lineName": "Bakerloo", "platformName": "Southbound - Platform 3",
                 "direction": "inbound", "bearing": "", "destinationNaptanId": "940GZZLUEAC",
                 "destinationName": "Elephant & Castle Underground Station",
                 "timestamp": "2026-11-03T08:14:26.5894441Z", "timeToStation": 163,
                 "currentLocation": "Between Regent''s Park and Oxford Circus",
                 "towards": "Elephant and Castle", "expectedArrival": "2026-11-03T08:17:09Z",
                 "timeToLive": "0001-01-01T00:00:00", "modeName": "tube"},
                {"id": "351445571", "vehicleId": "223", "naptanId": "940GZZLUOXC",
                 "lineId": "bakerloo", "platformName": "Southbound - Platform 3",
                 "direction": "inbound", "timestamp": "2026-11-03T08:14:26.5894441Z",
                 "timeToStation": 163, "expectedArrival": "2026-11-03T08:17:09Z",
                 "timeToLive": "0001-01-01T00:00:00", "modeName": "tube"}]' as payload,
              '2026-11-03' as dt,
              '08' as hour
    expect:
      rows:
        - poll_id: p1
          request_path: /StopPoint/940GZZLUOXC/Arrivals
          prediction_id: "351445571"
          vehicle_id: "223"
          naptan_id: 940GZZLUOXC
          line_id: bakerloo
          platform_name: Southbound - Platform 3
          direction: inbound
          station_name: Oxford Circus Underground Station
          destination_naptan_id: 940GZZLUEAC
          towards: Elephant and Castle
          current_location: Between Regent's Park and Oxford Circus
          time_to_station: 163
          expected_arrival: "2026-11-03 08:17:09"
          prediction_timestamp: "2026-11-03 08:14:26.589"
          time_to_live: null
