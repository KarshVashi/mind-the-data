name: infra

# Pull requests that touch infra/ get a read-only plan. Merging into main is
# the approval: the run on main plans and applies (ADR-005). Credentials are
# decided by AWS from the job's branch, so a pull request cannot deploy even
# if it edits this file. Jobs skip with a notice until the repository
# variables exist (runbook H6).
#
# Settings come from repository variables. AWS_ACCOUNT_ID alone is enough:
# the state bucket and role ARNs follow the bootstrap's naming convention,
# and an explicitly set variable wins (runbook, Repository variables).

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
      - ".github/scripts/**"
      # The Lambda package is built from these, so code changes redeploy.
      - "src/**"
      - "config/**"
      - "scripts/zip_lambda.py"
      - "scripts/check_handlers.py"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
      - ".github/scripts/**"
      # The Lambda package is built from these, so code changes redeploy.
      - "src/**"
      - "config/**"
      - "scripts/zip_lambda.py"
      - "scripts/check_handlers.py"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
  workflow_dispatch:
    inputs:
      allow_destroy:
        description: "Allow the deploy to delete or replace resources"
        type: boolean
        default: false

permissions:
  contents: read

# Pull request plans run side by side; runs on main queue behind each other.
concurrency:
  group: infra-${{ github.event_name == 'pull_request' && github.ref || 'prod' }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.16.6"
  TF_DIR: infra/envs/prod
  TF_IN_AUTOMATION: "true"
  AWS_REGION: eu-west-2
  # Not AWS_ACCOUNT_ID: AWS SDKs read that name for account-based endpoints.
  ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || (vars.AWS_ACCOUNT_ID && format('mtd-tfstate-{0}', vars.AWS_ACCOUNT_ID)) }}
  PLAN_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN || (vars.AWS_ACCOUNT_ID && format('arn:aws:iam::{0}:role/mtd-ci-plan', vars.AWS_ACCOUNT_ID)) }}
  APPLY_ROLE_ARN: ${{ vars.AWS_ROLE_ARN || (vars.AWS_ACCOUNT_ID && format('arn:aws:iam::{0}:role/mtd-ci-apply', vars.AWS_ACCOUNT_ID)) }}
  # Optional: without it the alerts topic has no email subscription.
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

jobs:
  not-configured:
    # Job conditions cannot read env, so the fallbacks are spelled out:
    # each setting is configured when its own variable or AWS_ACCOUNT_ID is.
    if: >-
      vars.AWS_ACCOUNT_ID == '' && (vars.TF_STATE_BUCKET == ''
      || (github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN == '')
      || (github.event_name != 'pull_request' && vars.AWS_ROLE_ARN == ''))
    runs-on: ubuntu-24.04
    steps:
      - run: echo "::notice title=infra skipped::Set the AWS_ACCOUNT_ID repository variable after the bootstrap apply (docs/runbook.md, H6)."

  plan:
    if: >-
      github.event_name == 'pull_request'
      && (vars.AWS_ACCOUNT_ID != '' || (vars.TF_STATE_BUCKET != '' && vars.AWS_PLAN_ROLE_ARN != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: check settings
        run: |
          if [ -n "$ACCOUNT_ID" ] && ! [[ "$ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error title=Bad AWS_ACCOUNT_ID::AWS_ACCOUNT_ID must be the 12-digit account id."
            exit 1
          fi
          echo "state bucket: $TF_STATE_BUCKET"

      # Terraform hashes dist/lambda.zip, so it must exist before plan. Built
      # before AWS credentials exist in the job, since it downloads packages.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.16"

      # Imports every handler Terraform names from the built zip, so a
      # schedule or function cannot deploy ahead of the code it calls.
      - name: build Lambda package and check handlers
        run: make handlers

      - name: alert email check
        if: vars.ALERT_EMAIL == ''
        run: echo "::warning title=No alert email::ALERT_EMAIL is not set, so collector alarms notify nobody (docs/runbook.md, Alert email)."

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: infra-plan-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform -chdir="$TF_DIR" init -input=false -backend-config="bucket=$TF_STATE_BUCKET"

      # The plan role is read-only, so no state lock is taken.
      - name: terraform plan
        run: |
          terraform -chdir="$TF_DIR" plan -input=false -lock=false -no-color -out=tfplan
          terraform -chdir="$TF_DIR" show -no-color tfplan > plan.txt
          ./.github/scripts/plan-summary.sh plan.txt "terraform plan (infra/envs/prod)"

      # Flag deletes and replacements on the pull request, where they can
      # still be questioned; the deploy blocks them without an opt-in.
      - name: destroy check
        run: |
          terraform -chdir="$TF_DIR" show -json tfplan > plan.json
          ./.github/scripts/destroy-guard.sh plan.json true

      # Evidence for the merge gate (ADR-011): each resource's address, mode,
      # type, actions and whether it is imported, with no attribute values,
      # so nothing secret leaves the job. The gate downloads it for the head
      # commit.
      - name: plan changes for the merge gate
        run: >-
          jq '[.resource_changes[]? | {address, mode, type, actions: .change.actions,
          importing: (.change.importing != null)}]'
          plan.json > plan-changes.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-changes
          path: plan-changes.json
          retention-days: 7
          if-no-files-found: error

  deploy:
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && (vars.AWS_ACCOUNT_ID != '' || (vars.TF_STATE_BUCKET != '' && vars.AWS_ROLE_ARN != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: check settings
        run: |
          if [ -n "$ACCOUNT_ID" ] && ! [[ "$ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error title=Bad AWS_ACCOUNT_ID::AWS_ACCOUNT_ID must be the 12-digit account id."
            exit 1
          fi
          echo "state bucket: $TF_STATE_BUCKET"

      # Terraform hashes dist/lambda.zip, so it must exist before plan. Built
      # before AWS credentials exist in the job, since it downloads packages.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.16"

      # Imports every handler Terraform names from the built zip, so a
      # schedule or function cannot deploy ahead of the code it calls.
      - name: build Lambda package and check handlers
        run: make handlers

      - name: alert email check
        if: vars.ALERT_EMAIL == ''
        run: echo "::warning title=No alert email::ALERT_EMAIL is not set, so collector alarms notify nobody (docs/runbook.md, Alert email)."

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: infra-deploy-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform -chdir="$TF_DIR" init -input=false -backend-config="bucket=$TF_STATE_BUCKET"

      # Plan again from main (it may have moved since the pull request's plan)
      # and record it in the run summary, then apply exactly that plan.
      - name: terraform plan
        run: |
          terraform -chdir="$TF_DIR" plan -input=false -no-color -out=tfplan
          terraform -chdir="$TF_DIR" show -no-color tfplan > plan.txt
          ./.github/scripts/plan-summary.sh plan.txt "terraform plan applied from main (infra/envs/prod)"

      # Deletes and replacements are what an approval step would have caught,
      # so they need an explicit opt-in: `[allow-destroy]` in the merged
      # pull request's title (it is always in the squash commit message), or
      # the allow_destroy input on a manual run.
      - name: destroy guard
        env:
          ALLOW_DESTROY: ${{ contains(github.event.head_commit.message, '[allow-destroy]') || inputs.allow_destroy == true }}
        run: |
          terraform -chdir="$TF_DIR" show -json tfplan > plan.json
          ./.github/scripts/destroy-guard.sh plan.json "$ALLOW_DESTROY"

      - name: terraform apply
        run: terraform -chdir="$TF_DIR" apply -input=false -no-color tfplan

      # One synchronous poll with the schedule's event, then a check that its
      # raw object landed; the reference function too if raw has none of its
      # data. Collision and double-write safety is explained in the script.
      # Warns and passes while the role cannot invoke functions.
      - name: smoke test
        timeout-minutes: 10
        run: |
          poller=$(terraform -chdir="$TF_DIR" output -raw poller_function_name)
          reference=$(terraform -chdir="$TF_DIR" output -raw reference_function_name)
          bucket=$(terraform -chdir="$TF_DIR" output -raw raw_bucket_name)
          ./.github/scripts/smoke-test.sh "$poller" "$reference" "$bucket"
