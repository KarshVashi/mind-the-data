  - name: stg_line_arrivals_parses_every_stop_and_dedupes_like_stg_arrivals
    description: >
      One line_arrivals poll for the Victoria line lists Oxford Circus twice
      (the same prediction, the copy with the older TfL timestamp dropped)
      and Green Park once: two rows, one per stop. A failed request for the
      Central line gives no rows. The placeholder timeToLive becomes null.
    model: stg_line_arrivals
    overrides: *full_history_window
    given:
      - input: source('raw', 'line_arrivals')
        format: sql
        rows: |
          select
              'p1' as poll_id,
              '2026-11-03T08:15:00.123Z' as polled_at,
              'line_arrivals' as feed,
              cast(row('/Line/victoria/Arrivals') as row(path varchar)) as request,
              200 as http_status,
              420 as latency_ms,
              cast(null as varchar) as error,
              '[{"id": "-1", "vehicleId": "205", "naptanId": "940GZZLUOXC",
                 "stationName": "Oxford Circus Underground Station", "lineId": "victoria",
                 "lineName": "Victoria", "platformName": "Southbound - Platform 5",
                 "direction": "inbound", "destinationNaptanId": "940GZZLUBXN",
                 "timestamp": "2026-11-03T08:14:20.1000000Z", "timeToStation": 100,
                 "expectedArrival": "2026-11-03T08:16:40Z",
                 "timeToLive": "0001-01-01T00:00:00", "modeName": "tube"},
                {"id": "-1", "vehicleId": "205", "naptanId": "940GZZLUOXC",
                 "lineId": "victoria", "platformName": "Southbound - Platform 5",
                 "direction": "inbound", "destinationNaptanId": "940GZZLUBXN",
                 "timestamp": "2026-11-03T08:14:50.1000000Z", "timeToStation": 70,
                 "expectedArrival": "2026-11-03T08:16:40Z",
                 "timeToLive": "0001-01-01T00:00:00", "modeName": "tube"},
                {"id": "-1", "vehicleId": "205", "naptanId": "940GZZLUGPK",
                 "stationName": "Green Park Underground Station", "lineId": "victoria",
                 "lineName": "Victoria", "platformName": "Southbound - Platform 4",
                 "direction": "inbound", "destinationNaptanId": "940GZZLUBXN",
                 "timestamp": "2026-11-03T08:14:50.1000000Z", "timeToStation": 160,
                 "expectedArrival": "2026-11-03T08:18:10Z",
                 "timeToLive": "0001-01-01T00:00:00", "modeName": "tube"}]' as payload,
              '2026-11-03' as dt,
              '08' as hour
          union all
          select
              'p1',
              '2026-11-03T08:15:00.456Z',
              'line_arrivals',
              cast(row('/Line/central/Arrivals') as row(path varchar)),
              503,
              900,
              'http_error',
              cast(null as varchar),
              '2026-11-03',
              '08'
    expect:
      rows:
        - {request_path: /Line/victoria/Arrivals, naptan_id: 940GZZLUOXC, line_id: victoria, vehicle_id: "205", time_to_station: 70, expected_arrival: "2026-11-03 08:16:40", prediction_timestamp: "2026-11-03 08:14:50.100", time_to_live: null}
        - {request_path: /Line/victoria/Arrivals, naptan_id: 940GZZLUGPK, line_id: victoria, vehicle_id: "205", time_to_station: 160, expected_arrival: "2026-11-03 08:18:10", prediction_timestamp: "2026-11-03 08:14:50.100", time_to_live: null}

