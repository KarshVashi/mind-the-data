name: transform-daily

# Daily `dbt build --target prod` at 03:30 Europe/London, as the transform
# role (never the apply role, ADR-005). GitHub cron is UTC only, so both
# 02:30 and 03:30 UTC are scheduled and the gate job keeps the one that is
# 03:30 in London today (docs/runbook.md, Daily transform).
#
# On Sundays (London date) the run then compacts and vacuums the curated
# Iceberg tables (dbt run-operation iceberg_maintenance, D64). A manual run
# can also rebuild named models from raw (full_refresh with select), so a
# staging key change (D8, D45) is rebuilt in prod by this role rather than
# from a laptop. A schedule never full-refreshes (docs/runbook.md, Full
# refresh in prod).
#
# AWS_ACCOUNT_ID alone is enough: the role ARN and dbt settings follow the
# naming convention in infra/, and an explicitly set variable wins
# (docs/runbook.md, Repository variables).

on:
  schedule:
    - cron: "30 2 * * *" # 03:30 BST
    - cron: "30 3 * * *" # 03:30 GMT
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Rebuild the selected models from raw (--full-refresh); needs select"
        type: boolean
        default: false
      select:
        description: "dbt selector, e.g. stg_arrivals+ (default: everything)"
        required: false
        default: ""
      maintenance:
        description: "Also run the Iceberg maintenance (Sunday runs always do)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  AWS_REGION: eu-west-2
  # Not AWS_ACCOUNT_ID: AWS SDKs read that name for account-based endpoints.
  ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  TRANSFORM_ROLE_ARN: ${{ vars.AWS_TRANSFORM_ROLE_ARN || (vars.AWS_ACCOUNT_ID && format('arn:aws:iam::{0}:role/mtd-ci-transform', vars.AWS_ACCOUNT_ID)) }}

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.clock.outputs.run }}
      maintenance: ${{ steps.clock.outputs.maintenance }}
      full_refresh: ${{ steps.options.outputs.full_refresh }}
      select: ${{ steps.options.outputs.select }}
    steps:
      # Decided by the slot that fired, not the start time, so a run GitHub
      # starts late still builds. Clocks change at 01:00 UTC, before either slot.
      - id: clock
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MAINTENANCE_INPUT: ${{ inputs.maintenance }}
        run: |
          offset=$(TZ=Europe/London date +%z)
          if [ "$EVENT" != "schedule" ]; then
            run=true
          else
            case "$SCHEDULE|$offset" in
              "30 2 * * *|+0100" | "30 3 * * *|+0000") run=true ;;
              *) run=false ;;
            esac
          fi
          # Weekly Iceberg maintenance on the London Sunday (PLAN M7, D64).
          maintenance=false
          if [ "$(TZ=Europe/London date +%u)" = "7" ]; then
            maintenance=true
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$MAINTENANCE_INPUT" = "true" ]; then
            maintenance=true
          fi
          echo "London UTC offset $offset, event $EVENT, slot '${SCHEDULE}': run=$run maintenance=$maintenance"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "maintenance=$maintenance" >> "$GITHUB_OUTPUT"

      # Inputs exist only on a manual run, so a schedule can never
      # full-refresh. The selector is checked here and reaches dbt as
      # separate words, never through an expansion of the raw input.
      - id: options
        env:
          EVENT: ${{ github.event_name }}
          FULL_REFRESH_INPUT: ${{ inputs.full_refresh }}
          SELECT_INPUT: ${{ inputs.select }}
        run: |
          full_refresh=false
          select=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            select="$SELECT_INPUT"
            if [ -n "$select" ] && ! [[ "$select" =~ ^[A-Za-z0-9_.:+*@,/\ -]+$ ]]; then
              echo "::error title=Bad selector::select may hold model names, paths and dbt selector characters only."
              exit 1
            fi
            # Each word becomes a dbt argument, so none may be an option
            # (--target, --full-refresh, --exclude would slip past the guards).
            if [[ " $select" == *" -"* ]]; then
              echo "::error title=Bad selector::select may not contain options (words starting with -)."
              exit 1
            fi
            if [ "$FULL_REFRESH_INPUT" = "true" ]; then
              if [ -z "${select// /}" ]; then
                echo "::error title=Selector needed::A full refresh rewrites tables from raw; name them in select (path:models for everything)."
                exit 1
              fi
              full_refresh=true
            fi
          fi
          echo "full_refresh=$full_refresh select='$select'"
          echo "full_refresh=$full_refresh" >> "$GITHUB_OUTPUT"
          echo "select=$select" >> "$GITHUB_OUTPUT"

  not-configured:
    needs: gate
    if: needs.gate.outputs.run == 'true' && vars.AWS_ACCOUNT_ID == '' && vars.AWS_TRANSFORM_ROLE_ARN == ''
    runs-on: ubuntu-24.04
    steps:
      - run: echo "::notice title=transform skipped::Set the AWS_ACCOUNT_ID repository variable after the bootstrap apply (docs/runbook.md, H6)."

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true' && (vars.AWS_ACCOUNT_ID != '' || vars.AWS_TRANSFORM_ROLE_ARN != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    # One prod build at a time, and never cancel one half way through
    # writing tables. Only the build job joins the group, so a slot the gate
    # skips cannot displace a queued manual run (GitHub keeps one pending run
    # per group).
    concurrency:
      group: transform-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      # Derived names match the dbt_athena_env output of infra/envs/prod.
      DBT_ATHENA_S3_STAGING_DIR_PROD: ${{ vars.DBT_ATHENA_S3_STAGING_DIR_PROD || (vars.AWS_ACCOUNT_ID && format('s3://mind-the-data-athena-results-{0}/prod/', vars.AWS_ACCOUNT_ID)) }}
      DBT_ATHENA_S3_DATA_DIR_PROD: ${{ vars.DBT_ATHENA_S3_DATA_DIR_PROD || (vars.AWS_ACCOUNT_ID && format('s3://mind-the-data-curated-{0}/prod/', vars.AWS_ACCOUNT_ID)) }}
      DBT_ATHENA_WORKGROUP_PROD: ${{ vars.DBT_ATHENA_WORKGROUP_PROD || (vars.AWS_ACCOUNT_ID && 'mind-the-data-prod') }}
      DBT_ATHENA_SCHEMA_PROD: ${{ vars.DBT_ATHENA_SCHEMA_PROD || (vars.AWS_ACCOUNT_ID && 'mind_the_data_prod') }}
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      # profiles.yml falls back to unusable values when these are missing;
      # failing here says which one.
      - name: check dbt settings
        run: |
          if [ -n "$ACCOUNT_ID" ] && ! [[ "$ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error title=Bad AWS_ACCOUNT_ID::AWS_ACCOUNT_ID must be the 12-digit account id."
            exit 1
          fi
          missing=""
          for v in DBT_ATHENA_S3_STAGING_DIR_PROD DBT_ATHENA_S3_DATA_DIR_PROD DBT_ATHENA_WORKGROUP_PROD DBT_ATHENA_SCHEMA_PROD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error title=dbt settings missing::Set AWS_ACCOUNT_ID, or these repository variables:$missing (docs/runbook.md, dbt connection settings)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.16"

      # Python and dbt packages are installed before AWS credentials exist
      # in the job, since both are downloads.
      - name: install
        run: uv sync --locked

      - name: dbt deps
        working-directory: transform
        run: |
          if [ -f packages.yml ]; then
            uv run --locked dbt deps --profiles-dir .
          else
            echo "no packages.yml; nothing to install"
          fi

      - id: creds
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.TRANSFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: transform-${{ github.run_id }}

      # A failed run can leave `__dbt_tmp` tables that make the next build
      # stop with TABLE_ALREADY_EXISTS. If this step fails, the build still
      # runs, which is no worse than not cleaning up.
      - name: drop stale tmp tables
        working-directory: transform
        continue-on-error: true
        run: uv run --locked dbt run-operation drop_stale_tmp_relations --target prod --profiles-dir .

      - name: dbt build
        working-directory: transform
        env:
          FULL_REFRESH: ${{ needs.gate.outputs.full_refresh }}
          SELECT: ${{ needs.gate.outputs.select }}
        run: |
          args=(build --target prod --profiles-dir .)
          if [ -n "${SELECT// /}" ]; then
            read -ra words <<< "$SELECT"
            args+=(--select "${words[@]}")
          fi
          if [ "$FULL_REFRESH" = "true" ]; then
            args+=(--full-refresh)
            echo "::notice title=full refresh::Rebuilding from raw: $SELECT"
          fi
          echo "dbt ${args[*]}"
          uv run --locked dbt "${args[@]}"

      # Runs after a failed build too: compaction does not depend on the
      # tests passing, and the job still ends failed.
      - name: iceberg maintenance
        if: ${{ !cancelled() && steps.creds.outcome == 'success' && needs.gate.outputs.maintenance == 'true' }}
        working-directory: transform
        run: uv run --locked dbt run-operation iceberg_maintenance --target prod --profiles-dir .
