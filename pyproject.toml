[project]
name = "mind-the-data"
version = "0.1.0"
description = "London rail reliability data products, starting with the Tube League Table."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "dbt-core>=1.10",
    "dbt-athena-community>=1.9",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
    "sqlfluff>=3.2",
    "sqlfluff-templater-dbt>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mind_the_data"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
