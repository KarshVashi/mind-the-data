  - name: rpt_weekly_highlights_by_hand
    description: >
      Five weeks. 26 Oct: nothing observed, so no Wooden Spoon, no incident,
      and no previous week (no_previous_week). 2 Nov: 70 % observed;
      Central is bottom (index 120, rank 2, provisional), so it takes the
      Wooden Spoon; the week before observed nothing (no_previous_week).
      9 Nov: Central and Jubilee share the bottom rank 2 (index 60); the
      spoon goes to central by line id, shared by 2. District (index 500)
      is not ranked (engineering works) and cannot take it. The previous
      week was 140 / 200 = 70 % observed, under 90 %:
      previous_week_incomplete. Worst incident: Central's 40-minute Minor
      Delays (40 severity-weighted minutes) ties Jubilee's 20-minute Severe
      Delays (40) and wins on duration; Victoria's 30 is lower.
      16 Nov: Central falls from 60 to 20 (improvement 40), Jubilee from 60
      to 40 (20), Victoria rises from 40 to 70, District was unranked last
      week: Line of the Week is Central, +40. Victoria is bottom (rank 4).
      Two incidents of 30 tie on weight and duration; Jubilee's started
      first. 23 Nov (not yet complete): every index equals the week before,
      so no line improved (no_line_improved); Victoria keeps the spoon.
    model: rpt_weekly_highlights
    overrides:
      vars:
        provisional_completeness: 0.9
    given:
