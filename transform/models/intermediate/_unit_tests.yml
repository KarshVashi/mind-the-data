          - {poll_id: p2, request_path: /s, polled_at: "2026-11-03 08:16:05.000", poll_minute: "2026-11-03 08:16:00", line_id: bakerloo, status_ordinal: 1, status_severity: 10, status_severity_description: Good Service, reason: null, is_planned: false, valid_from: null, valid_to: null, dt: "2026-11-03"}
          - {poll_id: p3, request_path: /s, polled_at: "2026-11-03 08:16:40.000", poll_minute: "2026-11-03 08:16:00", line_id: victoria, status_ordinal: 1, status_severity: 5, status_severity_description: Part Closure, reason: Works, is_planned: true, valid_from: "2026-11-03 00:00:00", valid_to: "2026-11-03 23:59:00", dt: "2026-11-03"}
          - {poll_id: p5, request_path: /s, polled_at: "2026-11-03 08:19:00.200", poll_minute: "2026-11-03 08:19:00", line_id: victoria, status_ordinal: 1, status_severity: 8, status_severity_description: Bus Service, reason: Rail replacement, is_planned: true, valid_from: "2026-11-03 06:00:00", valid_to: "2026-11-03 12:00:00", dt: "2026-11-03"}
