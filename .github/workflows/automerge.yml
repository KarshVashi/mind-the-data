name: automerge

# Squash-merges low-risk pull requests once ci passes. Off unless the
# repository variable AUTOMERGE_ENABLED is 'true', and it must stay off until
# the CI roles' OIDC trust is pinned to job_workflow_ref (docs/runbook.md,
# Ops workflows).
#
# Eligible only when all of these hold (src/mind_the_data/ops/automerge.py):
# the author is the repository owner, the branch is in this repository, not
# a draft, unchanged since ci ran, every check on it passed, and every
# changed file is under transform/models/, tests/ or docs/ (not docs/adr/).
#
# workflow_run always runs this file and the rule from the default branch,
# so a pull request cannot change the rule that judges it. Merges made with
# GITHUB_TOKEN start no other workflows: ci and infra do not run on main for
# them. Nothing in the allowed paths is deployed by infra, and the daily
# transform picks up model changes at its next run.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: automerge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  merge:
    if: >-
      vars.AUTOMERGE_ENABLED == 'true'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: src/mind_the_data

      - name: find the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          number=$(gh pr list --state open --head "$BRANCH" --json number,headRefOid \
            --jq '.[] | select(.headRefOid == env.SHA) | .number' | head -n 1)
          if [ -z "$number" ]; then
            echo "No open pull request at $SHA on $BRANCH; nothing to do."
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: decide and merge
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          PYTHONPATH: src
        run: |
          gh pr view "$NUMBER" \
            --json author,isDraft,isCrossRepository,headRefOid,statusCheckRollup > pr.json
          # The REST list carries previous_filename, so renames are judged on both ends.
          gh api --paginate "repos/$GH_REPO/pulls/$NUMBER/files" --jq '.[]' > files.jsonl
          if ! python3 -m mind_the_data.ops.automerge --owner "$OWNER" --sha "$SHA" \
            --pr pr.json --files files.jsonl; then
            echo "Pull request #$NUMBER left for a person to merge."
            exit 0
          fi
          # Auto-merge (--auto) needs a paid plan on private repositories, and
          # ci has already passed, so merge now. --match-head-commit refuses
          # if anything was pushed since the decision.
          gh pr merge "$NUMBER" --squash --match-head-commit "$SHA"
          echo "Merged #$NUMBER ($SHA)." >> "$GITHUB_STEP_SUMMARY"
