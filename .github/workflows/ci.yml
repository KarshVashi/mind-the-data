name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id is the required status check name in the main branch ruleset.
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.16"
          enable-cache: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: "v0.65.0"

      - name: Install Python environment
        run: uv sync --locked

      # Hygiene and secret hooks only; the tools they share with make check
      # run once, below.
      - name: pre-commit
        env:
          SKIP: ruff-check,ruff-format,mypy,sqlfluff-lint,terraform-fmt
        run: uv run --locked pre-commit run --all-files --show-diff-on-failure

      - name: make check
        env:
          # tflint --init downloads the AWS ruleset from GitHub; authenticated
          # requests avoid the anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: make check
