version: 2

models:
  - name: dim_lines
    description: Lines in scope, from config/lines.yaml through the `lines` seed.
    columns:
      - name: line_id
        description: TfL line id.
        data_tests: [unique, not_null]
      - name: line_name
        description: Display name.
        data_tests: [not_null]
      - name: mode_name
        description: TfL mode.
        data_tests: [not_null]
      - name: colour
        description: Line colour, hex.
      - name: is_low_volume
        description: Shown but flagged as low volume.
        data_tests: [not_null]

  - name: dim_service_hours
    description: >
      Scheduled operating minutes per line, London date and time band, the
      denominator before missing minutes are taken out. Counted in real
      minutes, so the clock-change Sundays have 25 and 23 London hours.
    columns:
      - name: service_hours_key
        description: Row key, a hash of (line_id, london_date, time_band).
        data_tests: [unique, not_null]
      - name: line_id
        description: TfL line id.
        data_tests: [not_null]
      - name: london_date
        description: London date.
        data_tests: [not_null]
      - name: week_start
        description: Monday of the London week.
      - name: day_type
        description: Day type of the date.
      - name: day_class
        description: weekday or weekend.
      - name: time_band
        description: Time band.
        data_tests: [not_null]
      - name: time_weight
        description: Weight of the band.
      - name: scheduled_minutes
        description: Scheduled minutes in the band.
        data_tests: [not_null]
      - name: scheduled_hours
        description: The same in hours.

  - name: fct_line_daily
    description: >
      Declared-view metrics per line and London date (PLAN 7.1), over
      scheduled minutes. Scored minutes are scheduled, observed, and neither
      engineering works nor Service Closed. Disruption Index = 100 x sum of
      (severity weight x time weight) / sum of time weight, over scored
      minutes: the time-weighted mean severity on a 0 to 800 scale (D19,
      decided 2026-11-14).
    columns:
      - name: line_daily_key
        description: Row key, a hash of (line_id, london_date).
        data_tests: [unique, not_null]
      - name: line_id
        description: TfL line id.
        data_tests: [not_null]
      - name: london_date
        description: London date.
        data_tests: [not_null]
      - name: week_start
        description: Monday of the London week.
        data_tests: [not_null]
      - name: scheduled_minutes
        description: Minutes inside scheduled hours.
      - name: observed_minutes
        description: Scheduled minutes with a known status.
      - name: missing_minutes
        description: Scheduled minutes without one.
      - name: engineering_works_minutes
        description: Scheduled minutes whose worst status is a closure.
      - name: service_closed_minutes
        description: Scheduled minutes TfL reported as Service Closed.
      - name: scored_minutes
        description: The denominator of every score.
      - name: good_service_minutes
        description: Scored minutes at Good Service (code 10).
      - name: disrupted_minutes
        description: Scored minutes with a weight above 0.
      - name: weighted_disruption_minutes
        description: Sum of severity weight x time weight over scored minutes.
      - name: time_weighted_scored_minutes
        description: Sum of time weight over scored minutes; the Disruption Index's denominator (D19).
        data_tests: [not_null]
      - name: incidents
        description: Incidents starting on the date.
      - name: median_recovery_minutes
        description: Median recovery of closed incidents starting on the date.
      - name: completeness
        description: observed_minutes / scheduled_minutes.
        data_tests: [not_null]
      - name: disruption_index
        description: 100 x weighted_disruption_minutes / time_weighted_scored_minutes, 0 to 800 (D19); null with no scored minutes.
      - name: good_service_pct
        description: Percentage of scored minutes at Good Service.
      - name: incidents_per_100_hours
        description: Incidents per 100 scored service hours.

  - name: fct_line_weekly
    description: >
      Declared-view metrics per line and ISO week (Monday to Sunday, London
      time). Sums of fct_line_daily with ratios recomputed, the week's rank
      by Disruption Index (ties: higher Good Service %, D20), and movement
      against the previous week. A line-week under `provisional_completeness`
      (0.9) is provisional. A line that ran under `min_open_share_to_rank`
      (0.5) of its scheduled minutes because of engineering works keeps its
      index but is not ranked (D22, decided 2026-11-14).
    columns:
      - name: line_weekly_key
        description: Row key, a hash of (line_id, week_start).
        data_tests: [unique, not_null]
      - name: line_id
        description: TfL line id.
        data_tests: [not_null]
      - name: week_start
        description: Monday of the London week.
        data_tests: [not_null]
      - name: week_end
        description: Sunday of the London week.
      - name: service_days
        description: London dates with scheduled minutes.
      - name: scheduled_minutes
        description: Minutes inside scheduled hours.
      - name: observed_minutes
        description: Scheduled minutes with a known status.
      - name: missing_minutes
        description: Scheduled minutes without one.
      - name: engineering_works_minutes
        description: Engineering works minutes.
      - name: service_closed_minutes
        description: Service Closed minutes in scheduled hours.
      - name: scored_minutes
        description: Denominator of every score.
      - name: good_service_minutes
        description: Scored minutes at Good Service.
      - name: disrupted_minutes
        description: Scored minutes with a weight above 0.
      - name: weighted_disruption_minutes
        description: Sum of severity weight x time weight.
      - name: time_weighted_scored_minutes
        description: Sum of time weight over scored minutes (D19).
        data_tests: [not_null]
      - name: incidents
        description: Incidents starting in the week.
      - name: median_recovery_minutes
        description: Median recovery of closed incidents starting in the week.
      - name: completeness
        description: observed_minutes / scheduled_minutes.
        data_tests: [not_null]
      - name: disruption_index
        description: 100 x weighted_disruption_minutes / time_weighted_scored_minutes, 0 to 800 (D19).
      - name: good_service_pct
        description: Percentage of scored minutes at Good Service.
      - name: incidents_per_100_hours
        description: Incidents per 100 scored service hours.
      - name: engineering_works_share
        description: engineering_works_minutes / scheduled_minutes; null with no scheduled minutes.
      - name: is_ranked
        description: The line has a rank this week (D20, D22).
        data_tests: [not_null]
      - name: unranked_reason
        description: >
          Why the line has no rank: `no_scored_minutes`, or
          `engineering_works` when works took more than half its scheduled
          minutes (D22). Null when ranked.
        data_tests:
          - accepted_values:
              arguments:
                values: [no_scored_minutes, engineering_works]
      - name: is_week_complete
        description: The week's last London minute has passed by the wall clock, whatever the data holds; completeness and is_provisional say how much was observed.
        data_tests: [not_null]
      - name: is_provisional
        description: Completeness under the threshold.
        data_tests: [not_null]
      - name: is_low_volume
        description: Low-volume line.
      - name: disruption_rank
        description: Rank in the week among ranked lines, 1 = least disrupted; null when unranked.
      - name: previous_disruption_rank
        description: Rank in the previous week.
      - name: rank_movement
        description: previous rank minus this rank; positive means the line climbed.
      - name: previous_disruption_index
        description: The line's Disruption Index in the previous week; Line of the Week compares with it (D47).
      - name: is_measured
        description: seed_measured_lines scores the line in the measured view (D43).
        data_tests: [not_null]
      - name: measurement_status
        description: >
          `measured`; `not_measured` when seed_measured_lines leaves the line
          out (no measured numbers are shown); `no_measured_hours` when no
          hour passed the quality gate.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [measured, not_measured, no_measured_hours]
      - name: scheduled_measurement_hours
        description: Station-direction-hours with scheduled service on days the collector ran (int_measured_hours).
      - name: measured_share
        description: measured_hours / scheduled_measurement_hours; the measured view's coverage.
      - name: observed_trains
        description: Trains observed on the boards in observed station-direction-hours (int_measured_hours, ADR-014).
      - name: observed_hours_scheduled_trains
        description: Scheduled trains in the same observed hours.
      - name: trains_run_share
        description: >
          observed_trains / observed_hours_scheduled_trains: trains run
          against the timetable (ADR-014). The boards may omit trains, so it
          is a lower bound. Withheld (null) for the lines in
          `trains_run_withheld_lines`, whose boards misfile trains.
      - name: is_measured_provisional
        description: measured_share below `min_measured_share` (0.5), so the line gets no experienced_rank (D42); null when the line is not measured.
      - name: excess_wait_hours
        description: Measured hours with at least one in-service headway, the denominator of excess_wait_minutes.
      - name: observed_measurement_hours
        description: Station-direction-hours with scheduled service and complete arrivals polling (int_measured_hours).
      - name: measured_hours
        description: Of those, hours inside the PLAN 7.2 quality gate, which feed the measured metrics.
      - name: excess_wait_minutes
        description: >
          PLAN 7.3 mean excess wait over measured hours, minutes: actual
          average wait from observed headways minus the scheduled one.
          Negative values are kept. Null when not measured.
      - name: long_gaps
        description: Headways over twice the longest scheduled gap of their hour (D34), in measured hours.
      - name: long_gaps_per_100_hours
        description: long_gaps per 100 measured station-direction-hours (D42).
      - name: honesty_gap_hours
        description: >
          PLAN 7.3 Honesty Gap: London hours in which the line's declared
          status was Good Service for the whole hour and at least one
          measured station-direction-hour of the line recorded a long gap.
      - name: good_service_measured_hours
        description: London hours of whole-hour Good Service with at least one measured station-direction-hour; the Honesty Gap's denominator.
      - name: honesty_gap_share
        description: honesty_gap_hours / good_service_measured_hours.
      - name: experienced_rank
        description: >
          PLAN 7.3 Experienced Reliability rank within the week: lowest excess
          wait first, ties to fewer long gaps per 100 hours, among line-weeks
          whose measured numbers are published (measured_withheld_reason
          null, D51) and that are not weak evidence (D53). Null otherwise.
      - name: sum_excess_wait_seconds
        description: Sum of excess wait over excess_wait_hours, seconds; the numerator of excess_wait_minutes.
      - name: fallback_measured_hours
        description: Measured hours judged against the fallback frequencies of seed_line_frequencies (D33).
      - name: is_weak_evidence
        description: >
          At least one measured hour was judged against an estimated
          timetable (D33; today only the Elizabeth line and the Overground). Their gate compares
          boards with estimates partly checked against the same boards.
        data_tests: [not_null]
      - name: gate_judged_hours
        description: Judged station-direction-hours (ADR-014) at the line's core and branch stations; the line-week gate's denominator (D51).
      - name: gate_in_band_hours
        description: Of those, hours inside the gate band.
      - name: gate_pass_share
        description: gate_in_band_hours / gate_judged_hours.
      - name: measured_withheld_reason
        description: >
          Why the line-week's measured numbers are not published, the first
          that applies: `line_not_measured` (D43), `shared_section_misfiled`
          (`measured_view_withheld_lines`, D52), `no_measured_hours`,
          `gate_not_judged` (no judged hour at a core or branch station),
          `gate_failed` (more than `gate_max_out_of_band_share` of judged
          hours out of band, D51), `too_few_measured_hours` (measured_share
          under `min_measured_share`, D42). Null when published.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - line_not_measured
                  - shared_section_misfiled
                  - no_measured_hours
                  - gate_not_judged
                  - gate_failed
                  - too_few_measured_hours
      - name: is_measured_published
        description: >
          measured_withheld_reason is null; the export publishes the measured
          numbers (D42, settled 2026-11-14). The measured columns keep their
          values for withheld line-weeks, for checking; any reader that shows
          them must filter on this flag.
        data_tests: [not_null]

  - name: fct_line_measured_daily
    description: >
      Measured-view sums per line and London date from int_measured_hours,
      measured lines only (D43). Every column adds up over days, so
      fct_line_weekly sums it for the ISO week and the publish code sums it
      for a custom window.
    columns:
      - name: line_measured_daily_key
        description: Row key, a hash of (line_id, london_date).
        data_tests: [unique, not_null]
      - name: line_id
        description: TfL line id.
        data_tests: [not_null]
      - name: london_date
        description: London calendar date.
        data_tests: [not_null]
      - name: week_start
        description: Monday of the London week.
        data_tests: [not_null]
      - name: scheduled_measurement_hours
        description: Station-direction-hours with scheduled service.
        data_tests: [not_null]
      - name: observed_measurement_hours
        description: Of those, hours with complete arrivals polling.
      - name: observed_trains
        description: Trains on the boards in observed hours (ADR-014).
      - name: observed_hours_scheduled_trains
        description: Scheduled trains in observed hours.
      - name: measured_hours
        description: Hours inside the quality gate, which feed the measured metrics.
        data_tests: [not_null]
      - name: excess_wait_hours
        description: Measured hours with at least one in-service headway.
      - name: sum_excess_wait_seconds
        description: Sum of excess wait over those hours, seconds.
      - name: long_gaps
        description: Long gaps in measured hours (D34).
      - name: fallback_measured_hours
        description: Measured hours judged against fallback frequencies (D33).
      - name: gate_judged_hours
        description: Judged hours at core and branch stations (D51).
      - name: gate_in_band_hours
        description: Of those, hours inside the gate band.
      - name: good_service_measured_hours
        description: London hours of whole-hour Good Service with at least one measured hour of the line.
      - name: honesty_gap_hours
        description: Of those, hours with at least one long gap (PLAN 7.3 Honesty Gap).

  - name: rpt_weekly_highlights
    description: >
      The week's headline facts (M6), one row per ISO week: the Wooden
      Spoon (bottom-ranked line, D48), Line of the Week (largest fall in
      Disruption Index since a complete previous week, D47) and the single
      worst incident (most severity-weighted minutes, D48).
    columns:
      - name: week_start
        description: Monday of the London week.
        data_tests: [unique, not_null]
      - name: week_end
        description: Sunday of the London week.
      - name: is_week_complete
        description: Every line's week has ended (fct_line_weekly.is_week_complete).
      - name: wooden_spoon_line_id
        description: The bottom-ranked line; lines sharing the bottom rank are split by line id. Null with no ranked line.
      - name: wooden_spoon_disruption_index
        description: Its Disruption Index.
      - name: wooden_spoon_is_provisional
        description: Its line-week is provisional (completeness under 90 %).
      - name: wooden_spoon_shared_by
        description: Lines sharing the bottom rank, the Wooden Spoon included.
      - name: line_of_the_week_line_id
        description: The most improved line, or null (see line_of_the_week_null_reason).
      - name: line_of_the_week_disruption_index
        description: Its Disruption Index this week.
      - name: line_of_the_week_previous_index
        description: Its Disruption Index the week before.
      - name: line_of_the_week_improvement
        description: previous index minus this week's, above 0.
      - name: line_of_the_week_null_reason
        description: Why there is no Line of the Week; null when there is one.
        data_tests:
          - accepted_values:
              arguments:
                values: [no_previous_week, previous_week_incomplete, no_line_improved]
      - name: worst_incident_line_id
        description: Line of the week's worst incident; null with none.
      - name: worst_incident_started_at
        description: Its first incident minute, UTC.
      - name: worst_incident_duration_minutes
        description: Its duration in minutes.
      - name: worst_incident_severity_weighted_minutes
        description: Its severity-weighted minutes, the ordering measure.
      - name: worst_incident_worst_status
        description: Its worst status.
      - name: worst_incident_is_open
        description: The incident may still be running.

  - name: rpt_monday_morning
    description: >
      Monday Morning Index per line and ISO week (M6, D49): the Disruption
      Index over Monday's AM peak (07:00 to 10:00 London time), with the
      weekly table's rules for scoring, completeness, ranking and works
      (D19, D20, D22).
    columns:
      - name: monday_morning_key
        description: Row key, a hash of (line_id, week_start).
        data_tests: [unique, not_null]
      - name: line_id
        description: TfL line id.
        data_tests: [not_null]
      - name: week_start
        description: The Monday.
        data_tests: [not_null]
      - name: scheduled_minutes
        description: Scheduled AM-peak minutes.
      - name: observed_minutes
        description: Of those, minutes with a known status.
      - name: engineering_works_minutes
        description: Of those, engineering works minutes.
      - name: scored_minutes
        description: Scored minutes, the Good Service % denominator.
      - name: good_service_minutes
        description: Scored minutes at Good Service.
      - name: weighted_disruption_minutes
        description: Sum of severity weight x time weight.
      - name: time_weighted_scored_minutes
        description: Sum of time weight over scored minutes.
      - name: completeness
        description: observed_minutes / scheduled_minutes.
      - name: engineering_works_share
        description: engineering_works_minutes / scheduled_minutes.
      - name: monday_morning_index
        description: 100 x weighted_disruption_minutes / time_weighted_scored_minutes, 0 to 800.
      - name: good_service_pct
        description: Percentage of scored minutes at Good Service.
      - name: is_provisional
        description: Completeness under `provisional_completeness`.
        data_tests: [not_null]
      - name: unranked_reason
        description: "`no_scored_minutes` or `engineering_works`; null when ranked."
        data_tests:
          - accepted_values:
              arguments:
                values: [no_scored_minutes, engineering_works]
      - name: monday_morning_rank
        description: Rank among ranked lines that Monday, 1 = least disrupted.

  - name: rpt_engineering_works
    description: >
      Engineering Works table per line and ISO week (PLAN 7.4, M6, D50):
      hours whose worst declared status was a closure, which the Disruption
      Index leaves out. Every line-week has a row; lines without works have
      0 hours.
    columns:
      - name: engineering_works_key
        description: Row key, a hash of (line_id, week_start).
        data_tests: [unique, not_null]
      - name: line_id
        description: TfL line id.
        data_tests: [not_null]
      - name: week_start
        description: Monday of the London week.
        data_tests: [not_null]
      - name: week_end
        description: Sunday of the London week.
      - name: scheduled_minutes
        description: Minutes inside scheduled hours.
      - name: engineering_works_minutes
        description: Scheduled minutes under a closure.
        data_tests: [not_null]
      - name: engineering_works_hours
        description: engineering_works_minutes / 60.
      - name: engineering_works_share
        description: engineering_works_minutes / scheduled_minutes.
      - name: is_unranked_for_works
        description: The works left the line unranked this week (D22).
        data_tests: [not_null]
      - name: is_week_complete
        description: The week has ended.
      - name: works_rank
        description: 1 = most hours closed that week; lines with equal hours share a rank.

  - name: rpt_division_seeding
    description: >
      Division seeding (M6, ADR-015, DECISIONS.md D56): every line ordered by
      its Disruption Index over the first `division_seeding_weeks` complete
      weeks (two, not the plan's four), ties to the higher Good Service %,
      then line id, unranked lines last. The first `division_one_size`
      start in Division One. Empty until enough complete weeks exist ("not
      yet seeded"). `seeding_status` is `provisional` while fewer than
      `division_full_seeding_weeks` complete weeks exist.
    columns:
      - name: line_id
        description: TfL line id.
        data_tests: [unique, not_null]
      - name: seed_position
        description: 1 = best over the seeding weeks; no ties.
        data_tests: [unique, not_null]
      - name: division
        description: 1 or 2.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: false
      - name: disruption_index
        description: Disruption Index over the seeding weeks (D19).
      - name: good_service_pct
        description: Good Service share of scored minutes over the seeding weeks.
      - name: completeness
        description: Observed over scheduled minutes in the seeding weeks.
      - name: engineering_works_share
        description: Closure minutes over scheduled minutes in the seeding weeks.
      - name: unranked_reason
        description: Why the line was seeded last (D20, D22); null when ranked.
      - name: seeding_start
        description: Monday of the first seeding week.
        data_tests: [not_null]
      - name: seeding_end
        description: Sunday of the last seeding week.
        data_tests: [not_null]
      - name: seeding_weeks
        description: Weeks the seeding used (`division_seeding_weeks`).
      - name: complete_weeks_available
        description: Complete weeks in the data at build time.
      - name: first_division_month
        description: First day of the first month the divisions play.
        data_tests: [not_null]
      - name: seeding_status
        description: "`provisional` or `confirmed` (ADR-015)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [provisional, confirmed]

  - name: rpt_divisions_monthly
    description: >
      Divisions per line and calendar month (PLAN 6.2, M6, D57), from the
      first division month: membership, the month's Disruption Index and
      rank within the division, and promotion and relegation of
      `division_moves` lines at the month's end. Unranked lines neither go
      up nor down. Empty until the divisions are seeded.
    columns:
      - name: line_month_key
        description: Row key, a hash of (line_id, month_start).
        data_tests: [unique, not_null]
      - name: line_id
        description: TfL line id.
        data_tests: [not_null]
      - name: month_start
        description: First London date of the month.
        data_tests: [not_null]
      - name: month_end
        description: Last London date of the month.
      - name: division
        description: The line's division this month, 1 or 2.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: false
      - name: joined_by
        description: "`seeded`, `promoted`, `relegated` or `stayed`: how the line got here."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [seeded, promoted, relegated, stayed]
      - name: scheduled_minutes
        description: Scheduled minutes in the month so far.
      - name: observed_minutes
        description: Observed scheduled minutes.
      - name: engineering_works_minutes
        description: Scheduled minutes under a closure.
      - name: scored_minutes
        description: Minutes in the score.
      - name: disruption_index
        description: Disruption Index over the month (D19).
      - name: good_service_pct
        description: Good Service share of scored minutes.
      - name: completeness
        description: Observed over scheduled minutes.
      - name: is_provisional
        description: Completeness under `provisional_completeness`.
      - name: engineering_works_share
        description: Closure minutes over scheduled minutes.
      - name: unranked_reason
        description: "`no_scored_minutes` or `engineering_works` (D22); null when ranked."
      - name: division_rank
        description: Rank within the division, 1 = lowest index; null when unranked.
      - name: movement
        description: >
          `promoted`, `relegated` or `stays` at the month's end; while the
          month is running, where the line stands.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [promoted, relegated, stays]
      - name: next_division
        description: The division the line plays in next month.
        data_tests: [not_null]
      - name: is_month_complete
        description: The month's last London date has passed.
        data_tests: [not_null]

  - name: rpt_season
    description: >
      The season table per line and season (PLAN 6.2, M6, D58): 1 April to
      31 March, resetting each April, cumulative declared-view standings
      with the weekly table's rules. The 2026-27 season starts with the
      collector, so until April 2027 it is the season to date.
    columns:
      - name: line_season_key
        description: Row key, a hash of (line_id, season start year).
        data_tests: [unique, not_null]
      - name: line_id
        description: TfL line id.
        data_tests: [not_null]
      - name: season
        description: Season label, e.g. 2026-27.
        data_tests: [not_null]
      - name: season_start
        description: 1 April.
        data_tests: [not_null]
      - name: season_end
        description: 31 March.
        data_tests: [not_null]
      - name: first_observed_date
        description: First London date with an observed minute this season.
      - name: last_observed_date
        description: Last London date with an observed minute this season.
      - name: scheduled_minutes
        description: Scheduled minutes in the season so far.
      - name: observed_minutes
        description: Observed scheduled minutes.
      - name: engineering_works_minutes
        description: Scheduled minutes under a closure.
      - name: scored_minutes
        description: Minutes in the score.
      - name: good_service_minutes
        description: Scored minutes at Good Service.
      - name: weighted_disruption_minutes
        description: Sum of severity weight x time weight over scored minutes.
      - name: time_weighted_scored_minutes
        description: Sum of time weight over scored minutes.
      - name: incidents
        description: Incidents starting in the season.
      - name: disruption_index
        description: Disruption Index over the season so far (D19).
      - name: good_service_pct
        description: Good Service share of scored minutes.
      - name: incidents_per_100_hours
        description: Incidents per 100 scored hours.
      - name: completeness
        description: Observed over scheduled minutes.
      - name: is_provisional
        description: Completeness under `provisional_completeness`.
      - name: engineering_works_share
        description: Closure minutes over scheduled minutes.
      - name: unranked_reason
        description: "`no_scored_minutes` or `engineering_works` (D22); null when ranked."
      - name: is_ranked
        description: The line has a season rank.
      - name: season_rank
        description: 1 = lowest index; equal lines share a rank; null when unranked.
      - name: is_season_complete
        description: 31 March has passed.

  - name: rpt_recovery_time
    description: >
      The Recovery Time table per line and ISO week (PLAN M6, D59).
      Provisional: it rests on D18, which is open; `definition_status` says
      so on every row. Median recovery of incidents starting in the week,
      quickest first; lines with no closed incident are not ranked.
    columns:
      - name: line_weekly_key
        description: Row key, a hash of (line_id, week_start).
        data_tests: [unique, not_null]
      - name: line_id
        description: TfL line id.
        data_tests: [not_null]
      - name: week_start
        description: Monday of the London week.
        data_tests: [not_null]
      - name: week_end
        description: Sunday of the London week.
      - name: is_week_complete
        description: The week has ended.
      - name: incidents
        description: Incidents starting in the week.
        data_tests: [not_null]
      - name: recovered_incidents
        description: Of those, incidents that have ended (D18).
        data_tests: [not_null]
      - name: open_incidents
        description: Incidents still open; no recovery yet.
      - name: median_recovery_minutes
        description: Exact median of the recovered incidents' recovery minutes.
      - name: mean_recovery_minutes
        description: Mean of the same.
      - name: longest_recovery_minutes
        description: Longest of the same.
      - name: unranked_reason
        description: "`no_recovered_incidents`, or null when ranked."
      - name: recovery_rank
        description: 1 = quickest median; ties to fewer incidents, then shared.
      - name: definition_status
        description: "`provisional_d18` until D18 is settled."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [provisional_d18]

  - name: rpt_league_strikes_excluded
    description: >
      The "strikes excluded" weekly league (PLAN 7.4, D60): each line's week
      without the London dates seed_industrial_action marks `held` or
      `announced` for it, ranked with the weekly table's rules. Equal to
      fct_line_weekly in weeks with no industrial action
      (assert_strikes_excluded_matches_league_without_strikes).
    columns:
      - name: line_weekly_key
        description: Row key, a hash of (line_id, week_start).
        data_tests: [unique, not_null]
      - name: line_id
        description: TfL line id.
        data_tests: [not_null]
      - name: week_start
        description: Monday of the London week.
        data_tests: [not_null]
      - name: week_end
        description: Sunday of the London week.
      - name: strike_days
        description: London dates left out for this line.
        data_tests: [not_null]
      - name: week_has_industrial_action
        description: Some line has a date left out this week.
        data_tests: [not_null]
      - name: scheduled_minutes
        description: Scheduled minutes on the dates kept.
      - name: observed_minutes
        description: Observed scheduled minutes on the dates kept.
      - name: engineering_works_minutes
        description: Closure minutes on the dates kept.
      - name: scored_minutes
        description: Scored minutes on the dates kept.
      - name: good_service_minutes
        description: Good Service minutes on the dates kept.
      - name: weighted_disruption_minutes
        description: Sum of severity weight x time weight over the scored minutes kept.
      - name: time_weighted_scored_minutes
        description: Sum of time weight over the scored minutes kept.
      - name: disruption_index
        description: Disruption Index over the dates kept (D19).
      - name: good_service_pct
        description: Good Service share of the scored minutes kept.
      - name: completeness
        description: Observed over scheduled minutes on the dates kept.
      - name: is_provisional
        description: Completeness under `provisional_completeness`.
      - name: unranked_reason
        description: "`no_scored_minutes` or `engineering_works` (D22); null when ranked."
      - name: is_ranked
        description: The line has a rank in the variant.
      - name: disruption_rank
        description: Rank in the variant; equal lines share a rank.

  - name: rpt_weekly_status_mix
    description: >
      Scored minutes per line, ISO week, worst status, planned flag and time
      band, unweighted (PLAN 7.5, D61). The publish code re-weights it to
      re-rank each week under the sensitivity weight sets.
      assert_status_mix_rebuilds_weekly_index checks it holds every scored
      minute of fct_line_weekly.
    columns:
      - name: status_mix_key
        description: Row key, a hash of the grain.
        data_tests: [unique, not_null]
      - name: line_id
        description: TfL line id.
        data_tests: [not_null]
      - name: week_start
        description: Monday of the London week.
        data_tests: [not_null]
      - name: status_severity
        description: The minute's worst status (ADR-004).
        data_tests: [not_null]
      - name: is_planned
        description: The worst status was filed as planned work.
        data_tests: [not_null]
      - name: time_band
        description: The minute's time band (time_bands seed).
        data_tests: [not_null]
      - name: scored_minutes
        description: Scored minutes in the group.
        data_tests: [not_null]
      - name: weighted_disruption_minutes
        description: Sum of base severity weight x time weight.
      - name: time_weighted_scored_minutes
        description: Sum of base time weight.
