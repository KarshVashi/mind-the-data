  - name: fct_line_weekly_sums_ranks_and_movement
    description: >
      Weekly sums, recomputed ratios, ranks, ties, the D22 rule and movement,
      over the weeks of 19 and 26 October 2026. Which week a minute belongs
      to across a clock change is decided upstream and tested there
      (int_line_minute_status_london_calendar_and_clock_changes,
      assert_clock_change_days_have_real_length); here the week is input.
      Week 19 Oct (a weekend, time weight 0.75), Victoria: 24 Oct (60
      scored, 30 Good Service, weighted 45, 1 incident) + 25 Oct (60
      scored, all Good Service) = 120 scored, time-weighted 45 + 45 = 90,
      weighted 45: index 100 x 45 / 90 = 50 (D19), Good Service 75 %, 1
      incident = 6000 x 1 / 120 = 50 per 100 hours, completeness 1. Median
      recovery of its closed incidents (12, and one open) = 12.
      Bakerloo: 120 scheduled, 90 observed and scored (time-weighted 67.5),
      45 Good Service, weighted 33.75: index 100 x 33.75 / 67.5 = 50, Good
      Service 50 %, completeness 0.75, so provisional. Equal index:
      Victoria's higher Good Service % ranks it 1, Bakerloo 2. Waterloo &
      City: 60 scheduled, none observed: no index, unranked
      (no_scored_minutes), completeness 0, provisional.
      Week 26 Oct (off-peak weekday, weight 1): Victoria 60 scored, 30 Good
      Service, weighted 60, index 100; Bakerloo 60 scored, all Good Service,
      index 0. District: 100 scheduled, 60 under engineering works (share
      0.6), 40 scored, all Good Service: index 0, but it ran only 40 % of
      its minutes, so it is not ranked (engineering_works, D22). Jubilee:
      100 scheduled, exactly 50 under works (share 0.5, ranked), 50 scored,
      25 Good Service, weighted 50: index 100 and Good Service 50 %, equal
      to Victoria, so both share rank 2. Northern is closed for all 100
      minutes: no index, and unranked for engineering works, not for want of
      scored minutes. Bakerloo ranks 1 (up 1 from 2,
      previous index 50), Victoria 2 (down 1, previous index 50).
    model: fct_line_weekly
    given:
      - input: ref('fct_line_daily')
        rows:
          - {line_id: victoria, london_date: "2026-10-24", week_start: "2026-10-19", scheduled_minutes: 60, observed_minutes: 60, missing_minutes: 0, engineering_works_minutes: 0, service_closed_minutes: 0, scored_minutes: 60, good_service_minutes: 30, disrupted_minutes: 30, weighted_disruption_minutes: 45, time_weighted_scored_minutes: 45, incidents: 1}
          - {line_id: victoria, london_date: "2026-10-25", week_start: "2026-10-19", scheduled_minutes: 60, observed_minutes: 60, missing_minutes: 0, engineering_works_minutes: 0, service_closed_minutes: 0, scored_minutes: 60, good_service_minutes: 60, disrupted_minutes: 0, weighted_disruption_minutes: 0, time_weighted_scored_minutes: 45, incidents: 0}
          - {line_id: bakerloo, london_date: "2026-10-25", week_start: "2026-10-19", scheduled_minutes: 120, observed_minutes: 90, missing_minutes: 30, engineering_works_minutes: 0, service_closed_minutes: 0, scored_minutes: 90, good_service_minutes: 45, disrupted_minutes: 45, weighted_disruption_minutes: 33.75, time_weighted_scored_minutes: 67.5, incidents: 0}
          - {line_id: waterloo-city, london_date: "2026-10-23", week_start: "2026-10-19", scheduled_minutes: 60, observed_minutes: 0, missing_minutes: 60, engineering_works_minutes: 0, service_closed_minutes: 0, scored_minutes: 0, good_service_minutes: 0, disrupted_minutes: 0, weighted_disruption_minutes: 0, time_weighted_scored_minutes: 0, incidents: 0}
          - {line_id: victoria, london_date: "2026-10-26", week_start: "2026-10-26", scheduled_minutes: 60, observed_minutes: 60, missing_minutes: 0, engineering_works_minutes: 0, service_closed_minutes: 0, scored_minutes: 60, good_service_minutes: 30, disrupted_minutes: 30, weighted_disruption_minutes: 60, time_weighted_scored_minutes: 60, incidents: 0}
          - {line_id: bakerloo, london_date: "2026-10-26", week_start: "2026-10-26", scheduled_minutes: 60, observed_minutes: 60, missing_minutes: 0, engineering_works_minutes: 0, service_closed_minutes: 0, scored_minutes: 60, good_service_minutes: 60, disrupted_minutes: 0, weighted_disruption_minutes: 0, time_weighted_scored_minutes: 60, incidents: 0}
          - {line_id: district, london_date: "2026-10-26", week_start: "2026-10-26", scheduled_minutes: 100, observed_minutes: 100, missing_minutes: 0, engineering_works_minutes: 60, service_closed_minutes: 0, scored_minutes: 40, good_service_minutes: 40, disrupted_minutes: 0, weighted_disruption_minutes: 0, time_weighted_scored_minutes: 40, incidents: 0}
