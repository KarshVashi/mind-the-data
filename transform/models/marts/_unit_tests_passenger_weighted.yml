version: 2

# Hand-computed cases for the passenger-weighted league (D78, exploratory).
# Demand per minute is the seed's hourly figure / 60, times the line's share.

unit_tests:
  - name: rpt_line_weekly_passenger_weighted_by_typical_demand
    description: >
      One week (9 Nov), five lines.
      Victoria: 10 boarders a minute at 08:00 (600 an hour), 10 at 14:00
      (600). Minutes on Tue 10 Nov: 08:00 Good Service, 08:01 sev 1, 14:00
      sev 5, 14:01 missing. Scheduled boarders 40, observed 30 (demand
      completeness 0.75), scored 30, disrupted 20. Passenger-disruption
      minutes 1 x 10 + 5 x 10 = 60; index 100 x 60 / 30 = 200. Link loads
      20 a minute at 08:00 (1,200 an hour) and 10 at 14:00 (600): scored 50,
      weighted 1 x 20 + 5 x 10 = 70, index 140.
      Circle: NUMBAT's "H&C and Circle" split 0.5. 08:00 Monday-to-Thursday
      1,200 an hour x 0.5 / 60 = 10 a minute; Friday service day hour 1
      1,200 x 0.5 / 60 = 10.
      Tue 08:00 sev 1, Tue 08:01 engineering works (observed, not scored),
      Sat 14 Nov 01:00 sev 8. Sat 01:00 is Friday's traffic day (NUMBAT
      runs 05:00 to 04:59), so it takes Friday's 10, not the 1,000 a minute
      the Saturday row would give. Scheduled 30, observed 30, scored 20,
      disrupted 20; minutes 1 x 10 + 8 x 10 = 90, index 450. Link loads
      2,400 an hour x 0.5 at 08:00 (20 a minute) and 3,600 x 0.5 at Friday
      hour 1 (30):
      scored 50, weighted 20 + 240 = 260, index 520.
      Northern: 100 a minute at 08:00 (6,000 an hour); 08:00 sev 1, 08:01
      Good Service. Scored 200, minutes 100, index 50; link loads the same.
      Tram: no demand rows, so unranked `no_demand_data`, totals null.
      District: demand, but unranked in the declared league for works, so
      unranked here with the same reason.
      The tram is first in the declared league (rank 1), so the declared
      rank is re-taken among the three lines ranked here: Victoria 1
      (index 40), Circle 2 (60), Northern 3 (70); the shifts use those.
      Index rank: Northern 50, Victoria 200, Circle 450. Impact rank (fewest
      minutes first): Victoria 60, Circle 90, Northern 100. Link-load impact:
      Victoria 70, Northern 100, Circle 260. Index shifts are +1, +1 and -2.
    model: rpt_line_weekly_passenger_weighted
    given:
      - input: ref('int_line_minute_status')
        rows:
          - {line_id: victoria, week_start: "2026-11-09", london_date: "2026-11-10", london_ts: "2026-11-10 08:00:00", is_scheduled: true, is_missing: false, is_scored: true, severity_weight: 0}
          - {line_id: victoria, week_start: "2026-11-09", london_date: "2026-11-10", london_ts: "2026-11-10 08:01:00", is_scheduled: true, is_missing: false, is_scored: true, severity_weight: 1}
          - {line_id: victoria, week_start: "2026-11-09", london_date: "2026-11-10", london_ts: "2026-11-10 14:00:00", is_scheduled: true, is_missing: false, is_scored: true, severity_weight: 5}
          - {line_id: victoria, week_start: "2026-11-09", london_date: "2026-11-10", london_ts: "2026-11-10 14:01:00", is_scheduled: true, is_missing: true, is_scored: false, severity_weight: null}
          - {line_id: victoria, week_start: "2026-11-09", london_date: "2026-11-10", london_ts: "2026-11-10 03:00:00", is_scheduled: false, is_missing: false, is_scored: false, severity_weight: 8}
          - {line_id: circle, week_start: "2026-11-09", london_date: "2026-11-10", london_ts: "2026-11-10 08:00:00", is_scheduled: true, is_missing: false, is_scored: true, severity_weight: 1}
          - {line_id: circle, week_start: "2026-11-09", london_date: "2026-11-10", london_ts: "2026-11-10 08:01:00", is_scheduled: true, is_missing: false, is_scored: false, severity_weight: 0}
          - {line_id: circle, week_start: "2026-11-09", london_date: "2026-11-14", london_ts: "2026-11-14 01:00:00", is_scheduled: true, is_missing: false, is_scored: true, severity_weight: 8}
          - {line_id: northern, week_start: "2026-11-09", london_date: "2026-11-10", london_ts: "2026-11-10 08:00:00", is_scheduled: true, is_missing: false, is_scored: true, severity_weight: 1}
          - {line_id: northern, week_start: "2026-11-09", london_date: "2026-11-10", london_ts: "2026-11-10 08:01:00", is_scheduled: true, is_missing: false, is_scored: true, severity_weight: 0}
          - {line_id: tram, week_start: "2026-11-09", london_date: "2026-11-10", london_ts: "2026-11-10 08:00:00", is_scheduled: true, is_missing: false, is_scored: true, severity_weight: 1}
          - {line_id: district, week_start: "2026-11-09", london_date: "2026-11-10", london_ts: "2026-11-10 08:00:00", is_scheduled: true, is_missing: false, is_scored: true, severity_weight: 0}
      - input: ref('day_types')
        rows:
          - {iso_day_of_week: 1, day_type: mon_thu}
          - {iso_day_of_week: 2, day_type: mon_thu}
          - {iso_day_of_week: 3, day_type: mon_thu}
          - {iso_day_of_week: 4, day_type: mon_thu}
          - {iso_day_of_week: 5, day_type: fri}
          - {iso_day_of_week: 6, day_type: sat}
          - {iso_day_of_week: 7, day_type: sun}
      - input: ref('seed_line_demand')
        rows:
          - {numbat_line: Victoria, service_day_type: mon_thu, hour_of_day: 8, boarders: 600, link_load_sum: 1200}
          - {numbat_line: Victoria, service_day_type: mon_thu, hour_of_day: 14, boarders: 600, link_load_sum: 600}
          - {numbat_line: H&C and Circle, service_day_type: mon_thu, hour_of_day: 8, boarders: 1200, link_load_sum: 2400}
          - {numbat_line: H&C and Circle, service_day_type: fri, hour_of_day: 1, boarders: 1200, link_load_sum: 3600}
          - {numbat_line: H&C and Circle, service_day_type: sat, hour_of_day: 1, boarders: 120000, link_load_sum: 120000}
          - {numbat_line: Northern, service_day_type: mon_thu, hour_of_day: 8, boarders: 6000, link_load_sum: 6000}
          - {numbat_line: District, service_day_type: mon_thu, hour_of_day: 8, boarders: 60, link_load_sum: 60}
      - input: ref('seed_demand_line_map')
        rows:
          - {numbat_line: Victoria, line_id: victoria, demand_share: 1}
          - {numbat_line: H&C and Circle, line_id: circle, demand_share: 0.5}
          - {numbat_line: H&C and Circle, line_id: hammersmith-city, demand_share: 0.5}
          - {numbat_line: Northern, line_id: northern, demand_share: 1}
          - {numbat_line: District, line_id: district, demand_share: 1}
      - input: ref('fct_line_weekly')
        rows:
          - {line_id: victoria, week_start: "2026-11-09", disruption_index: 40, good_service_pct: 90, disruption_rank: 2, is_ranked: true, unranked_reason: null, is_provisional: false, is_week_complete: true, completeness: 0.75}
          - {line_id: circle, week_start: "2026-11-09", disruption_index: 60, good_service_pct: 90, disruption_rank: 3, is_ranked: true, unranked_reason: null, is_provisional: false, is_week_complete: true, completeness: 1}
          - {line_id: northern, week_start: "2026-11-09", disruption_index: 70, good_service_pct: 90, disruption_rank: 4, is_ranked: true, unranked_reason: null, is_provisional: false, is_week_complete: true, completeness: 1}
          - {line_id: tram, week_start: "2026-11-09", disruption_index: 10, good_service_pct: 95, disruption_rank: 1, is_ranked: true, unranked_reason: null, is_provisional: false, is_week_complete: true, completeness: 1}
          - {line_id: district, week_start: "2026-11-09", disruption_index: 0, good_service_pct: 100, disruption_rank: null, is_ranked: false, unranked_reason: engineering_works, is_provisional: false, is_week_complete: true, completeness: 1}
    expect:
      rows:
        - {line_id: victoria, scheduled_minutes: 4, minutes_without_demand: 0, scheduled_boarders: 40, observed_boarders: 30, scored_boarders: 30, disrupted_boarders: 20, passenger_disruption_minutes: 60, scored_link_loads: 50, link_load_disruption_minutes: 70, demand_completeness: 0.75, passenger_disruption_index: 200, link_load_disruption_index: 140, is_ranked: true, unranked_reason: null, disruption_rank: 2, declared_rank_among_ranked: 1, passenger_index_rank: 2, passenger_impact_rank: 1, link_load_impact_rank: 1, index_rank_shift: 1, impact_rank_shift: 0}
        - {line_id: circle, scheduled_minutes: 3, minutes_without_demand: 0, scheduled_boarders: 30, observed_boarders: 30, scored_boarders: 20, disrupted_boarders: 20, passenger_disruption_minutes: 90, scored_link_loads: 50, link_load_disruption_minutes: 260, demand_completeness: 1, passenger_disruption_index: 450, link_load_disruption_index: 520, is_ranked: true, unranked_reason: null, disruption_rank: 3, declared_rank_among_ranked: 2, passenger_index_rank: 3, passenger_impact_rank: 2, link_load_impact_rank: 3, index_rank_shift: 1, impact_rank_shift: 0}
        - {line_id: northern, scheduled_minutes: 2, minutes_without_demand: 0, scheduled_boarders: 200, observed_boarders: 200, scored_boarders: 200, disrupted_boarders: 100, passenger_disruption_minutes: 100, scored_link_loads: 200, link_load_disruption_minutes: 100, demand_completeness: 1, passenger_disruption_index: 50, link_load_disruption_index: 50, is_ranked: true, unranked_reason: null, disruption_rank: 4, declared_rank_among_ranked: 3, passenger_index_rank: 1, passenger_impact_rank: 3, link_load_impact_rank: 2, index_rank_shift: -2, impact_rank_shift: 0}
        - {line_id: tram, scheduled_minutes: 1, minutes_without_demand: 1, scheduled_boarders: null, observed_boarders: null, scored_boarders: null, disrupted_boarders: null, passenger_disruption_minutes: null, scored_link_loads: null, link_load_disruption_minutes: null, demand_completeness: null, passenger_disruption_index: null, link_load_disruption_index: null, is_ranked: false, unranked_reason: no_demand_data, disruption_rank: 1, declared_rank_among_ranked: null, passenger_index_rank: null, passenger_impact_rank: null, link_load_impact_rank: null, index_rank_shift: null, impact_rank_shift: null}
        - {line_id: district, scheduled_minutes: 1, minutes_without_demand: 0, scheduled_boarders: 1, observed_boarders: 1, scored_boarders: 1, disrupted_boarders: 0, passenger_disruption_minutes: 0, scored_link_loads: 1, link_load_disruption_minutes: 0, demand_completeness: 1, passenger_disruption_index: 0, link_load_disruption_index: 0, is_ranked: false, unranked_reason: engineering_works, disruption_rank: null, declared_rank_among_ranked: null, passenger_index_rank: null, passenger_impact_rank: null, link_load_impact_rank: null, index_rank_shift: null, impact_rank_shift: null}

  - name: rpt_line_weekly_passenger_weighted_monday_night_and_missing_demand
    description: >
      Week of 16 Nov. Northern at Mon 16 Nov 00:30 London time: before
      05:00, so NUMBAT's Sunday traffic day (`sun`, hour 0: 600 an hour, 10
      a minute), not Monday's 60,000; the minute stays in the week of 16
      Nov. Sev 3: minutes 30, index 300, ranked 1st.
      Waterloo & City has demand on weekdays only. One Tue 08:00 minute (60
      a minute) and one Sat 08:00 minute with no demand row: the Saturday
      minute would drop out of both halves unseen, so the line is unranked
      `incomplete_demand`, with its partial sums kept.
    model: rpt_line_weekly_passenger_weighted
    given:
      - input: ref('int_line_minute_status')
        rows:
          - {line_id: northern, week_start: "2026-11-16", london_date: "2026-11-16", london_ts: "2026-11-16 00:30:00", is_scheduled: true, is_missing: false, is_scored: true, severity_weight: 3}
          - {line_id: waterloo-city, week_start: "2026-11-16", london_date: "2026-11-17", london_ts: "2026-11-17 08:00:00", is_scheduled: true, is_missing: false, is_scored: true, severity_weight: 1}
          - {line_id: waterloo-city, week_start: "2026-11-16", london_date: "2026-11-21", london_ts: "2026-11-21 08:00:00", is_scheduled: true, is_missing: false, is_scored: true, severity_weight: 8}
      - input: ref('day_types')
        rows:
          - {iso_day_of_week: 1, day_type: mon_thu}
          - {iso_day_of_week: 2, day_type: mon_thu}
          - {iso_day_of_week: 3, day_type: mon_thu}
          - {iso_day_of_week: 4, day_type: mon_thu}
          - {iso_day_of_week: 5, day_type: fri}
          - {iso_day_of_week: 6, day_type: sat}
          - {iso_day_of_week: 7, day_type: sun}
      - input: ref('seed_line_demand')
        rows:
          - {numbat_line: Northern, service_day_type: sun, hour_of_day: 0, boarders: 600, link_load_sum: 600}
          - {numbat_line: Northern, service_day_type: mon_thu, hour_of_day: 0, boarders: 60000, link_load_sum: 60000}
          - {numbat_line: Waterloo & City, service_day_type: mon_thu, hour_of_day: 8, boarders: 3600, link_load_sum: 3600}
      - input: ref('seed_demand_line_map')
        rows:
          - {numbat_line: Northern, line_id: northern, demand_share: 1}
          - {numbat_line: Waterloo & City, line_id: waterloo-city, demand_share: 1}
      - input: ref('fct_line_weekly')
        rows:
          - {line_id: northern, week_start: "2026-11-16", disruption_index: 300, good_service_pct: 0, disruption_rank: 1, is_ranked: true, unranked_reason: null, is_provisional: true, is_week_complete: false, completeness: 1}
          - {line_id: waterloo-city, week_start: "2026-11-16", disruption_index: 450, good_service_pct: 0, disruption_rank: 2, is_ranked: true, unranked_reason: null, is_provisional: true, is_week_complete: false, completeness: 1}
    expect:
      rows:
        - {line_id: northern, week_start: "2026-11-16", scheduled_boarders: 10, scored_boarders: 10, passenger_disruption_minutes: 30, passenger_disruption_index: 300, minutes_without_demand: 0, unranked_reason: null, passenger_index_rank: 1, declared_rank_among_ranked: 1}
        - {line_id: waterloo-city, week_start: "2026-11-16", scheduled_boarders: 60, scored_boarders: 60, passenger_disruption_minutes: 60, passenger_disruption_index: 100, minutes_without_demand: 1, unranked_reason: incomplete_demand, passenger_index_rank: null, declared_rank_among_ranked: null}

  - name: rpt_line_disrupted_spells_by_service_day
    description: >
      Mon 16 Nov 00:30 and 00:31 London time, sev 3, belong to Sunday's
      NUMBAT traffic day (`sun`, hour 0) but stay in the week of 16 Nov.
      Tue 08:00 sev 1 is `mon_thu`, hour 8. A Good Service minute and an
      unscored minute are left out.
    model: rpt_line_disrupted_spells
    given:
      - input: ref('int_line_minute_status')
        rows:
          - {line_id: northern, week_start: "2026-11-16", london_date: "2026-11-16", london_ts: "2026-11-16 00:30:00", status_severity_description: Severe Delays, reason: x, severity_weight: 3, is_scored: true}
          - {line_id: northern, week_start: "2026-11-16", london_date: "2026-11-16", london_ts: "2026-11-16 00:31:00", status_severity_description: Severe Delays, reason: x, severity_weight: 3, is_scored: true}
          - {line_id: northern, week_start: "2026-11-16", london_date: "2026-11-17", london_ts: "2026-11-17 08:00:00", status_severity_description: Minor Delays, reason: y, severity_weight: 1, is_scored: true}
          - {line_id: northern, week_start: "2026-11-16", london_date: "2026-11-17", london_ts: "2026-11-17 09:00:00", status_severity_description: Good Service, reason: null, severity_weight: 0, is_scored: true}
          - {line_id: northern, week_start: "2026-11-16", london_date: "2026-11-17", london_ts: "2026-11-17 10:00:00", status_severity_description: Part Closure, reason: z, severity_weight: 0, is_scored: false}
      - input: ref('day_types')
        rows:
          - {iso_day_of_week: 1, day_type: mon_thu}
          - {iso_day_of_week: 2, day_type: mon_thu}
          - {iso_day_of_week: 7, day_type: sun}
    expect:
      rows:
        - {line_id: northern, week_start: "2026-11-16", status: Severe Delays, reason: x, severity_weight: 3, service_day_type: sun, hour_of_day: 0, minutes: 2}
        - {line_id: northern, week_start: "2026-11-16", status: Minor Delays, reason: y, severity_weight: 1, service_day_type: mon_thu, hour_of_day: 8, minutes: 1}
