name: bootstrap-plan

# Read-only plan of infra/bootstrap, which only the owner applies
# (make bootstrap-apply, runbook H6).
# - Pull requests that touch the bootstrap get its plan in the run summary.
# - Weekly on main, a non-empty plan (drift) opens or updates an issue.
# - A manual run can also probe the CI role trust (ADR-010).
# Jobs that need AWS skip with a notice until the bootstrap state is in S3
# and the plan role can read it (BOOTSTRAP_PLAN_ENABLED, set by
# scripts/bootstrap.sh after an apply).

on:
  pull_request:
    paths:
      - "infra/bootstrap/**"
      - "infra/modules/ci_role/**"
      - ".github/workflows/bootstrap-plan.yml"
      - ".github/scripts/plan-summary.sh"
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC
  workflow_dispatch:
    inputs:
      trust_probe:
        description: "Check that other CI roles refuse this workflow (ADR-010). new-roles: observer and publish (bound from the start); all-roles: also transform and apply (after enforce_workflow_binding)."
        type: choice
        options: [none, new-roles, all-roles]
        default: none

permissions:
  contents: read

concurrency:
  group: bootstrap-plan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_VERSION: "1.16.6"
  TF_DIR: infra/bootstrap
  TF_IN_AUTOMATION: "true"
  AWS_REGION: eu-west-2

jobs:
  # Shows the two claims the role trust policies match on, so their exact
  # form is on record for each kind of run. The token itself is never printed.
  oidc-claims:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      id-token: write
    steps:
      - name: show sub and job_workflow_ref
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          payload=$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          claims=$(printf '%s' "$payload" | base64 -d | jq '{sub, job_workflow_ref}')
          echo "$claims"
          { echo '### OIDC claims used by the role trust policies'; echo '```json'; echo "$claims"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  not-configured:
    if: vars.BOOTSTRAP_PLAN_ENABLED != 'true' || vars.TF_STATE_BUCKET == '' || vars.AWS_PLAN_ROLE_ARN == '' || vars.ALERT_EMAIL == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo "::notice title=bootstrap plan skipped::Runs once the bootstrap state is in S3 and re-applied (docs/runbook.md, H6). Needs BOOTSTRAP_PLAN_ENABLED, TF_STATE_BUCKET, AWS_PLAN_ROLE_ARN and ALERT_EMAIL."

  # Outside pull requests the plan role trusts main only, so a manual run
  # from another branch skips rather than failing with AccessDenied.
  plan:
    if: >-
      vars.BOOTSTRAP_PLAN_ENABLED == 'true' && vars.TF_STATE_BUCKET != '' && vars.AWS_PLAN_ROLE_ARN != '' && vars.ALERT_EMAIL != ''
      && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      drift: ${{ steps.plan.outputs.drift }}
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: bootstrap-plan-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform -chdir="$TF_DIR" init -input=false -backend-config="bucket=$TF_STATE_BUCKET"

      # The plan role is read-only: no state lock, and nothing is applied.
      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform -chdir="$TF_DIR" plan -input=false -lock=false -no-color -detailed-exitcode -out=tfplan
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then exit 1; fi
          terraform -chdir="$TF_DIR" show -no-color tfplan > plan.txt
          ./.github/scripts/plan-summary.sh plan.txt "terraform plan (infra/bootstrap)"
          if [ "$code" -eq 2 ]; then echo "drift=true" >> "$GITHUB_OUTPUT"; else echo "drift=false" >> "$GITHUB_OUTPUT"; fi

  # Holds no AWS credentials; only files the issue.
  drift-issue:
    needs: plan
    if: github.event_name != 'pull_request' && needs.plan.outputs.drift == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: |
          title="Bootstrap drift: plan is not empty"
          body="The bootstrap plan on main has changes: $RUN_URL. Review the run summary, then run make bootstrap-plan and, if the change is wanted, make bootstrap-apply (docs/runbook.md, H6)."
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  # Self-contained check that AWS evaluates job_workflow_ref (ADR-010). The
  # plan role, which trusts this workflow on main, must accept the token: it
  # is the positive control, so a refusal below means "wrong workflow", not
  # "key unsupported" or "token unusable". Every other role must refuse it.
  # STS cannot tell a missing role from an untrusted one, so all expected
  # role variables must be set. Credentials returned are discarded unread.
  trust-probe:
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.trust_probe != 'none' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      id-token: write
    env:
      SCOPE: ${{ inputs.trust_probe }}
      PLAN_ROLE: ${{ vars.AWS_PLAN_ROLE_ARN }}
      OBSERVER_ROLE: ${{ vars.AWS_OBSERVER_ROLE_ARN }}
      PUBLISH_ROLE: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
      TRANSFORM_ROLE: ${{ vars.AWS_TRANSFORM_ROLE_ARN }}
      APPLY_ROLE: ${{ vars.AWS_ROLE_ARN }}
    steps:
      - name: only the plan role accepts bootstrap-plan.yml
        run: |
          names="OBSERVER_ROLE PUBLISH_ROLE"
          if [ "$SCOPE" = "all-roles" ]; then names="$names TRANSFORM_ROLE APPLY_ROLE"; fi
          for name in PLAN_ROLE $names; do
            if [ -z "${!name}" ]; then echo "::error title=trust probe::$name is not set (repository variable)."; exit 1; fi
          done

          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          assume() {
            aws sts assume-role-with-web-identity --region "$AWS_REGION" --role-arn "$1" \
              --role-session-name trust-probe --web-identity-token "$token" \
              --query AssumedRoleUser.Arn --output text >/dev/null 2>err.txt
          }

          if ! assume "$PLAN_ROLE"; then
            echo "::error title=trust probe::the plan role refused bootstrap-plan.yml on main; the probe proves nothing."
            cat err.txt
            exit 1
          fi
          echo "accepted as expected: plan role"

          failed=0
          for name in $names; do
            role="${!name}"
            if assume "$role"; then
              echo "::error title=trust probe::$role accepted bootstrap-plan.yml; it is not bound to its workflow."
              failed=1
            elif grep -q AccessDenied err.txt; then
              echo "refused as expected: $role"
            else
              echo "::error title=trust probe::$role: unexpected error"; cat err.txt; failed=1
            fi
          done
          exit "$failed"
