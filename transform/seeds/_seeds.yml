version: 2

seeds:
  - name: lines
    description: >
      Lines in scope, copied from config/lines.yaml (a unit test keeps the
      two in step). Feeds dim_lines.
    columns:
      - name: line_id
        description: TfL line id.
        data_tests: [unique, not_null]
      - name: line_name
        description: Display name.
        data_tests: [not_null]
      - name: mode_name
        description: TfL mode.
        data_tests: [not_null]
      - name: colour
        description: Line colour, hex.
      - name: is_low_volume
        description: Shown but flagged as low volume (PLAN 7.4).
        data_tests: [not_null]

  - name: severity_weights
    description: >
      Weight of each TfL status severity code (PLAN 7.1, ADR-004). The
      higher weight wins a minute. `weight_planned` applies when the entry's
      disruption is filed as planned work; only Bus Service differs.
      Codes 4 and 5 are closures: a minute whose worst status is a closure is
      engineering works and leaves the score. Code 20 (Service Closed) is not
      in the plan; it is TfL's overnight status and is weighted 0 and left out
      of the score (DECISIONS.md D16). A code missing here fails
      assert_line_status_codes_are_weighted rather than defaulting.
    columns:
      - name: severity_code
        description: TfL statusSeverity.
        data_tests: [unique, not_null]
      - name: description
        description: TfL's text for the code, checked against what TfL sends.
        data_tests: [not_null]
      - name: weight_unplanned
        description: Weight when the entry is not planned work.
        data_tests: [not_null]
      - name: weight_planned
        description: Weight when the entry is planned work.
        data_tests: [not_null]
      - name: is_closure
        description: Planned Closure or Part Closure.
        data_tests: [not_null]
      - name: is_service_closed
        description: TfL's Service Closed status.
        data_tests: [not_null]
      - name: source
        description: "`plan` (PLAN 7.1) or the DECISIONS.md item that set it."
        data_tests: [not_null]

  - name: time_bands
    description: >
      Time weights by London wall-clock time (PLAN 7.1): weekday 07:00 to
      10:00 and 16:00 to 19:00 weigh 2, other weekday minutes 1, Saturday and
      Sunday 0.75. Night Tube runs only into Saturday and Sunday mornings, so
      it falls in the weekend band. Bands are [start, end) minutes after
      London midnight and cover each day class exactly once (unit test).
    columns:
      - name: day_class
        description: weekday or weekend, from day_types.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [weekday, weekend]
      - name: time_band
        description: Band name.
        data_tests: [not_null]
      - name: band_start_minute
        description: First minute of the band after London midnight.
        data_tests: [not_null]
      - name: band_end_minute
        description: Minute after the band's last, after London midnight.
        data_tests: [not_null]
      - name: time_weight
        description: The band's weight.
        data_tests: [not_null]

  - name: day_types
    description: >
      ISO day of week (London date) to the operating-hours day type and the
      time-band day class. Public holidays are not modelled in v1.
    columns:
      - name: iso_day_of_week
        description: 1 = Monday to 7 = Sunday.
        data_tests: [unique, not_null]
      - name: day_name
        description: Day name.
      - name: day_type
        description: mon_thu, fri, sat or sun, the day types of line_operating_hours.
        data_tests: [not_null]
      - name: day_class
        description: weekday or weekend.
        data_tests: [not_null]

  - name: line_operating_hours
    description: >
      v1 scheduled hours per line and day type, in minutes after the London
      midnight that starts the service day; an end past 1440 runs into the
      next day (Night Tube Fridays and Saturdays). [start, end).
      `tfl_timetable_2026_11_05`: first and last departures at the line's
      measurement stations in TfL's Line/{id}/Timetable responses recorded on
      2026-11-05 (stg_timetable), rounded out to 5 minutes. Waterloo & City
      has no weekend rows because TfL timetables no weekend service.
      `estimate_2026_11_08`: TfL returns 404 for Elizabeth line and Overground
      timetables, so these lines use 05:30 to 00:30 (Sunday 07:30 to 00:00),
      cut back where boards showed earlier last trains (Liberty, Suffragette).
      DECISIONS.md D17 tracks replacing them.
    columns:
      - name: line_id
        description: TfL line id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('lines')
                field: line_id
      - name: day_type
        description: Day type of the service day.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [mon_thu, fri, sat, sun]
      - name: service_start_minute
        description: First scheduled minute after the service day's London midnight.
        data_tests: [not_null]
      - name: service_end_minute
        description: Minute after the last scheduled one; may pass 1440.
        data_tests: [not_null]
      - name: source
        description: Where the hours come from (see the model description).
        data_tests: [not_null]

  - name: timetable_schedule_day_types
    description: >
      TfL timetable schedule names (`stg_timetable.schedule_name`) to the
      day types of line_operating_hours. A name covering several day types
      has a row for each. Holidays named in a schedule ("also Good Friday",
      "and Public Holidays") are not modelled (day_types has no holidays). A
      name missing here drops its departures from int_scheduled_headways, so
      assert_timetable_schedules_are_mapped fails the build instead.
    columns:
      - name: schedule_name
        description: TfL's schedule name, exactly as sent.
        data_tests: [not_null]
      - name: day_type
        description: Day type the schedule runs on.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [mon_thu, fri, sat, sun]

  - name: seed_line_frequencies
    description: >
      Fallback scheduled frequencies (PLAN 6.2) for measurement stations
      whose TfL timetable is unusable: TfL returns 404 for every Elizabeth
      line and Overground timetable request. Trains per hour in each
      scheduled direction, over service-day hours [from_hour, to_hour) (hours
      past 23 run into the next morning). A terminus has only the direction
      its board labels trains with; other stations have `both`. Only whole hours inside line_operating_hours
      are covered, so a part hour at either end of service has no scheduled
      headway and is not measured. Weekday peaks are 07:00 to 10:00 and
      16:00 to 19:00, as in time_bands. `estimate_2026_11_08`: from published
      service patterns, checked at mid-line stations against one weekday of
      inferred arrivals; lower where the two disagree (DECISIONS.md D33).
      Every row int_scheduled_headways takes from here is flagged
      `is_fallback`. A station that also has a timetable uses the timetable.
    columns:
      - name: line_id
        description: TfL line id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('lines')
                field: line_id
      - name: naptan_id
        description: Measurement station (config/stations.yaml; a unit test keeps them in step).
        data_tests: [not_null]
      - name: direction
        description: "`inbound`, `outbound` or `both`."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [inbound, outbound, both]
      - name: day_type
        description: Day type of the service day.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [mon_thu, fri, sat, sun]
      - name: from_hour
        description: First service-day hour the frequency covers.
        data_tests: [not_null]
      - name: to_hour
        description: Hour after the last one covered; may pass 24.
        data_tests: [not_null]
      - name: trains_per_hour
        description: Scheduled trains per hour in each direction.
        data_tests: [not_null]
      - name: source
        description: Where the frequency comes from (see the seed description).
        data_tests: [not_null]

  - name: seed_vehicle_id_lines
    description: >
      Which lines link a train's sightings by vehicle id in
      int_inferred_arrivals (PLAN 7.2 rule 1, "where it is stable";
      DECISIONS.md D26, D27). Flip `link_by_vehicle_id` and rebuild to change
      a line. The current setting is the week-one review's recommendation
      for now (docs/data-quality/2026-11-08-week-one.md): Victoria only. It
      waits for the owner, which `decision_status` shows; the review's
      advice per line is in `review_recommendation`.
    columns:
      - name: line_id
        description: TfL line id.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('lines')
                field: line_id
      - name: link_by_vehicle_id
        description: True to link sightings by vehicle id on this line; false to use expected arrival only.
        data_tests: [not_null]
      - name: decision_status
        description: "`pending_owner_d26_d27` until the owner settles D26 and D27; then the date and outcome."
        data_tests: [not_null]
      - name: review_recommendation
        description: The week-one review's advice for the line.

  - name: seed_measurement_stations
    description: >
      Measurement stations per line with their role (core, branch,
      terminus), copied from config/stations.yaml; a unit test keeps the two
      in step. The M4 quality gate is judged on core stations (PLAN M4).
    columns:
      - name: line_id
        description: TfL line id.
        data_tests: [not_null]
      - name: naptan_id
        description: Station-level NaPTAN id whose board is polled.
        data_tests: [not_null]
      - name: station_name
        description: Station name.
      - name: role
        description: "`core`, `branch` or `terminus` (config/stations.yaml)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [core, branch, terminus]

  - name: seed_measured_lines
    description: >
      Which lines the measured view scores. A line set to false gets a
      "not measured" flag in fct_line_weekly instead of numbers. Set to the
      week-one review's recommendation (docs/data-quality/2026-11-08-week-one.md):
      the DLR, trams, Waterloo & City and the Suffragette line are not
      measured. Waiting for the owner, as `decision_status` shows
      (DECISIONS.md D43).
    columns:
      - name: line_id
        description: TfL line id.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('lines')
                field: line_id
      - name: is_measured
        description: True to score the line in the measured view.
        data_tests: [not_null]
      - name: reason
        description: Why a line is not measured; empty when it is.
      - name: decision_status
        description: "`pending_owner` until the owner settles D43; then the date and outcome."
        data_tests: [not_null]
