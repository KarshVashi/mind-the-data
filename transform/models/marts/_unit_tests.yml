  - name: fct_line_measured_daily_by_hand
    description: >
      Tuesday 27 October 2026. Victoria has five observed station-direction-
      hours; four are in the gate band and count: 08:00 at two stations
      (excess wait 60 s with 1 long gap, and 0 s) and 09:00 at two (30 s and
      30 s). The 10:00 hour is out of band (600 s, 5 long gaps) and is left
      out. Measured hours 4, excess-wait hours 4, excess wait summed 120 s,
      long gaps 1. Trains run sums observed hours at core and branch stations
      only (D66): core a, 30 on the boards against 40 + 10 + 10 = 60
      scheduled, plus branch c (observed, not judged), 8 against 10:
      38 of 70. Terminus b is left out. Station b is a
      terminus, so the line-week gate (D51) judges station a only: 3 judged
      hours, 2 in band. Declared status: 08:00 is Good Service in every
      minute, 09:00 has a Minor Delays minute, so 1 Good Service hour with a
      measurement. Its long gap, with a Good Service span, is at station a
      only, so it is not corroborated (D68): Honesty Gap 0 of 1.
      Bakerloo: one counted hour, excess -30 s (kept, not clipped), judged
      against fallback frequencies (D33), Good Service: Honesty Gap 0 of 1.
      Central: 4 scheduled hours, 2 observed, 1 counted; 10:00 has 5 trains
      on the boards but is not observed, so trains run is 0 of 20. 2 judged,
      1 in band; no declared minutes, so no Good Service hour.
      DLR is not measured (D43) and gets no row.
