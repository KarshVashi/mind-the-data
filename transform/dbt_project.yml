name: mind_the_data
version: "0.1.0"
config-version: 2
profile: mind_the_data

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Which raw days a staging run reads (macros/staging_window.sql). Raw `dt` is
# the UTC date of the poll. Every read of a raw table is bounded by these, so
# no query ever scans the whole raw prefix.
vars:
  # First raw day read by a full refresh.
  raw_start_date: "2026-11-01"
  # Whole UTC days an incremental run reprocesses, counting back from today,
  # so a late raw object or a rerun after a failure is picked up.
  lookback_days: 2
  # Explicit backfill window ('YYYY-MM-DD', inclusive). Override both on the
  # command line, e.g. --vars '{start_date: "2026-11-03", end_date: "2026-11-05"}'.
  start_date: null
  end_date: null
  # Minutes int_utc_minutes leaves off the end, so the minute a run starts
  # in (whose poll may still be in flight) is never read as missing.
  minute_settle_minutes: 2
  # int_line_minute_status trims at most this many of the newest spine
  # minutes back to the latest staged status poll (a build-order race).
  tail_trim_minutes: 30
  # PLAN 6.2: unplanned disruptions separated by fewer quiet minutes than
  # this are one incident.
  incident_merge_gap_minutes: 5
  # PLAN 7.4: a line-week under this completeness is provisional.
  provisional_completeness: 0.9
  # D22 (decided 2026-11-14): a line is ranked only when it ran at least
  # this share of its scheduled minutes, engineering works taking the rest.
  # Mirrored by MIN_OPEN_SHARE_TO_RANK in src/mind_the_data/publish/league.py.
  min_open_share_to_rank: 0.5
  # Vehicle ids several trains share at once (week-one review, Q2): read as
  # no id by int_inferred_arrivals, as by the Python reference.
  placeholder_vehicle_ids: ["000", "001"]
  # Quality gate (ADR-014, amending PLAN 7.2): a station-direction-hour
  # counts only when its inferred trains are within this share of the
  # trains observed on the boards (int_vehicle_passes, plus inferred
  # arrivals without a vehicle id).
  gate_low_ratio: 0.8
  gate_high_ratio: 1.2
  # int_vehicle_passes: sightings of one vehicle id at a station and
  # direction more than this far apart are separate visits, and a visit is
  # a pass when it came within this many seconds of the station.
  vehicle_pass_visit_gap_seconds: 600
  vehicle_pass_threshold_seconds: 120
  # Lines whose trains-run share fct_line_weekly withholds: the Circle and
  # Hammersmith & City boards file one line's trains under the other on the
  # shared section (ADR-014).
  trains_run_withheld_lines: ["circle", "hammersmith-city"]
  # Lines whose whole measured view fct_line_weekly withholds until their
  # trains are split on the shared section (D52, ADR-014 follow-up): the
  # misfiling also distorts their headways.
  measured_view_withheld_lines: ["circle", "hammersmith-city"]
  # The M4 gate test fails when more than this share of core-station hours
  # on measured Tube lines with trains on the boards fall outside the band.
  # The same limit decides each line-week's own gate, over its core and
  # branch stations (D51).
  gate_max_out_of_band_share: 0.3
  # `error` since the M4 acceptance passed (D44, settled 2026-11-14): a
  # failing gate stops the build.
  gate_test_severity: error
  # A headway is dropped, not read as a long gap, when the station went
  # longer than this between successful arrivals polls inside it (D28).
  collection_gap_seconds: 150
  # An hour is observed with at least this many successful arrivals polls
  # at the station (of 60) and no collection gap touching it.
  min_polls_per_hour: 54
  # fct_line_weekly ranks a line on the measured view only when at least
  # this share of its scheduled station-direction-hours passed the gate.
  min_measured_share: 0.5
  # Divisions (M6, ADR-015): seeded from the first this-many complete weeks
  # (every line's week ended, at least `provisional_completeness` observed).
  # The plan's four weeks were shortened to two; the seeding is marked
  # provisional while fewer than `division_full_seeding_weeks` complete
  # weeks exist.
  division_seeding_weeks: 2
  division_full_seeding_weeks: 4
  # Lines in Division One; the rest are in Division Two.
  division_one_size: 10
  # Lines promoted and relegated at the end of each month (PLAN M6).
  division_moves: 3
  # Last month rpt_divisions_monthly builds ('YYYY-MM-DD'); null means the
  # current month. Unit tests pin it.
  division_months_through: null
  # Weekly Iceberg maintenance (macros/iceberg_maintenance.sql, D64): OPTIMIZE
  # rewrites only partitions this many days back, which covers a week of
  # daily merges plus their lookback_days.
  maintenance_lookback_days: 9
  # analyses/league_preview.sql: a week to show instead of the latest
  # complete one ('YYYY-MM-DD', a Monday).
  preview_week_start: null

# Every layer of a target lands in that target's single Glue database (`dev`
# or `prod`, section 2 of the plan); the stg_/int_/fct_ prefixes carry the
# layer. Hence no per-folder +schema, which would create dev_staging etc.
models:
  mind_the_data:
    +table_type: iceberg
    +format: parquet
    # Staging is idempotent per day: a run re-reads whole raw days and merges
    # on each model's row key, so rerunning a day rewrites the same rows
    # instead of appending copies (ADR-008).
    staging:
      +materialized: incremental
      +incremental_strategy: merge
      +partitioned_by: ["dt"]
      +on_schema_change: fail

# Intermediate and mart models are tables or merges declared in each model.
# Seeds hold the metric definitions (severity weights, time bands, service
# hours); column types are pinned so a seed edit cannot change a type.
seeds:
  mind_the_data:
    +table_type: iceberg
    lines:
      +column_types:
        line_id: varchar
        line_name: varchar
        mode_name: varchar
        colour: varchar
        is_low_volume: boolean
    severity_weights:
      +column_types:
        severity_code: integer
        description: varchar
        weight_unplanned: double
        weight_planned: double
        is_closure: boolean
        is_service_closed: boolean
        source: varchar
    time_bands:
      +column_types:
        day_class: varchar
        time_band: varchar
        band_start_minute: integer
        band_end_minute: integer
        time_weight: double
    day_types:
      +column_types:
        iso_day_of_week: integer
        day_name: varchar
        day_type: varchar
        day_class: varchar
    line_operating_hours:
      +column_types:
        line_id: varchar
        day_type: varchar
        service_start_minute: integer
        service_end_minute: integer
        source: varchar
    timetable_schedule_day_types:
      +column_types:
        schedule_name: varchar
        day_type: varchar
    seed_measurement_stations:
      +column_types:
        line_id: varchar
        naptan_id: varchar
        station_name: varchar
        role: varchar
    seed_measured_lines:
      +column_types:
        line_id: varchar
        is_measured: boolean
        reason: varchar
        decision_status: varchar
    seed_vehicle_id_lines:
      +column_types:
        line_id: varchar
        link_by_vehicle_id: boolean
        decision_status: varchar
        review_recommendation: varchar
    seed_line_frequencies:
      +column_types:
        line_id: varchar
        naptan_id: varchar
        direction: varchar
        day_type: varchar
        from_hour: integer
        to_hour: integer
        trains_per_hour: integer
        source: varchar
    seed_industrial_action:
      +column_types:
        action_id: varchar
        union_name: varchar
        applies_to: varchar
        applies_to_id: varchar
        start_london_date: date
        end_london_date: date
        status: varchar
        description: varchar
        source_publisher: varchar
        source_title: varchar
        source_date: date
        source_url: varchar
    sensitivity_weight_sets:
      +column_types:
        weight_set: varchar
        description: varchar
        factor: varchar
        factor_key: varchar
        weight: double

# Staging tests cover the last 7 days. Older days were tested when they were
# built; rescanning all history on every daily run would only add cost.
# (Project vars are not visible here, hence the literal.)
data_tests:
  mind_the_data:
    staging:
      +where: "dt >= current_date - interval '7' day"
