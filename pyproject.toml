[project]
name = "mind-the-data"
version = "0.1.0"
description = "London rail reliability data products, starting with the Tube League Table."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14",
]

[dependency-groups]
dev = [
    "dbt-core>=1.12,<2",
    "dbt-athena-community>=1.11,<2",
    "mypy>=2.4",
    "pre-commit>=4.7",
    "pytest>=9.2",
    "ruff>=0.17,<0.18",
    "sqlfluff>=4.5,<5",
    "sqlfluff-templater-dbt>=4.5,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mind_the_data"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
