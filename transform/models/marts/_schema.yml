version: 2

models:
  - name: dim_lines
    description: Lines in scope, from config/lines.yaml through the `lines` seed.
    config:
      contract:
        enforced: true
    columns:
      - name: line_id
        data_type: varchar
        description: TfL line id.
        data_tests: [unique, not_null]
      - name: line_name
        data_type: varchar
        description: Display name.
        data_tests: [not_null]
      - name: mode_name
        data_type: varchar
        description: TfL mode.
        data_tests: [not_null]
      - name: colour
        data_type: varchar
        description: Line colour, hex.
      - name: is_low_volume
        data_type: boolean
        description: Shown but flagged as low volume.
        data_tests: [not_null]

  - name: dim_line_station_role
    description: >
      Whether a station is an end of a line (D70), one row per line and
      station on the line's latest route sequences, plus each `terminus` of
      seed_measurement_stations that those sequences do not list. A terminus is the first
      or last stop of any ordered route of the line (branch ends and turned
      back routes included) or a `terminus` of seed_measurement_stations
      (D66). Read by fct_station_weekly_measured, which withholds a
      terminus's measured figures.
    columns:
      - name: line_station_key
        description: Row key, a hash of (line_id, naptan_id).
        data_tests: [unique, not_null]
      - name: line_id
        description: TfL line id.
        data_tests: [not_null]
      - name: naptan_id
        description: Station-level NaPTAN id (dim_station).
        data_tests: [not_null]
      - name: is_terminus
        description: True when the station is an end of the line's routes or a seeded terminus.
        data_tests: [not_null]
      - name: terminus_source
        description: "`route`, `seed` or `route_and_seed` for a terminus; null otherwise."
  - name: rpt_segment_run_times_weekly
    description: >
      Run times between adjacent stations per London week, line, direction
      and segment (D72, exploratory, not published): runs, p10, p50 and p90
      in seconds (nearest rank), and variability as p90 minus p50. Segments
      with fewer than `segment_min_runs` runs in the week are left out.
      Times are arrival to arrival and include dwell. paired_share is the
      runs over the vehicle-id passes at the first station, the coverage
      measure for lines with partial ids (is_partial_id_line).
    columns:
      - name: segment_week_key
        description: Row key, a hash of (line_id, direction, from_naptan_id, to_naptan_id, week_start).
        data_tests: [unique, not_null]
      - name: week_start
        description: Monday of the London week.
        data_tests: [not_null]
      - name: iso_week
        description: "ISO week of week_start, 'YYYY-Www'."
        data_tests: [not_null]
      - name: line_id
        description: TfL line id.
        data_tests: [not_null]
      - name: direction
        description: "`inbound` or `outbound`."
        data_tests: [not_null]
      - name: from_naptan_id
        description: First station of the segment.
        data_tests: [not_null]
      - name: to_naptan_id
        description: Next station in route order.
        data_tests: [not_null]
      - name: from_station_name
        description: Name of the first station (dim_station).
      - name: to_station_name
        description: Name of the next station (dim_station).
      - name: runs
        description: Runs in the week, at least the minimum.
        data_tests: [not_null]
      - name: days_with_runs
        description: London days of the week with a run.
        data_tests: [not_null]
      - name: p10_seconds
        description: 10th percentile run, seconds.
        data_tests: [not_null]
      - name: p50_seconds
        description: Median run, seconds.
        data_tests: [not_null]
      - name: p90_seconds
        description: 90th percentile run, seconds.
        data_tests: [not_null]
      - name: variability_seconds
        description: p90 minus p50, seconds.
        data_tests: [not_null]
      - name: paired_share
        description: Runs over the vehicle-id passes at the first station; null if none counted.
      - name: is_partial_id_line
        description: The line's vehicle ids are only partly reliable (`segment_partial_id_lines`).
        data_tests: [not_null]

  - name: dim_station
    description: >
      Every station on every line in scope (M8), one row per station-level
      NaPTAN id, from each line's latest route sequences (both directions).
      Name and coordinates come from the latest route sequence listing the
      station. An interchange TfL gives both a 940G and a 910G id (e.g.
      Canada Water) is two rows, matching the ids the arrivals and
      disruption feeds use.
    config:
      contract:
        enforced: true
    columns:
      - name: naptan_id
        data_type: varchar
        description: Station-level NaPTAN id (940GZZ... or 910G...).
        data_tests: [unique, not_null]
      - name: station_name
        data_type: varchar
        description: >
          TfL's name without its stop-type suffix (" Underground Station",
          " Rail Station", " DLR Station", " Tram Stop"); null if no route
          sequence's `stations` list describes the station.
      - name: tfl_station_name
        data_type: varchar
        description: TfL's name as sent, e.g. `Green Park Underground Station`.
      - name: lat
        data_type: double
        description: Latitude, WGS84.
      - name: lon
        data_type: double
        description: Longitude, WGS84.
      - name: line_ids
        data_type: array(varchar)
        description: Lines in scope that stop here, sorted.
        data_tests: [not_null]
      - name: modes
        data_type: array(varchar)
        description: Modes of those lines (the `lines` seed's mode_name), sorted.
        data_tests: [not_null]
      - name: is_measurement_station
        data_type: boolean
        description: True when the station is in seed_measurement_stations for any line.
        data_tests: [not_null]

  - name: rpt_step_free_weekly
    description: >
      Step-free outages per ISO week (London) and station (D73), from the
      5-minute stop disruption feed. One row per week for every station with
      an outage seen in any week; stations never seen with one have no row.
      Hours are a lower bound: the feed lists only current faults and has no
      clear time. Time with no successful poll inside an episode is counted in
      missing_hours_inside, never in the hours seen. No collected data says
      which stations have step-free access, so there is no denominator of
      step-free stations. repeat_offender needs four weeks of feed.
    columns:
      - name: step_free_weekly_key
        description: Row key, a hash of (naptan_id, week_start).
        data_tests: [unique, not_null]
      - name: week_start
        description: Monday of the London week.
        data_tests: [not_null]
      - name: iso_week
        description: "ISO week of week_start, 'YYYY-Www'."
        data_tests: [not_null]
      - name: naptan_id
        description: Station id.
        data_tests: [not_null]
      - name: station_name
        description: Station name from dim_station; null for a station not in it.
      - name: line_ids
        description: Lines serving the station from dim_station; null for a station not in it.
      - name: outage_hours_seen
        description: Hours with a step-free outage listed (observed slots only). A lower bound.
        data_tests: [not_null]
      - name: planned_hours_seen
        description: Of those, hours in which every listed outage was planned work.
        data_tests: [not_null]
      - name: unplanned_hours_seen
        description: Of those, hours with at least one outage that was not planned work.
        data_tests: [not_null]
      - name: missing_hours_inside
        description: Unobserved hours between sightings inside episodes, kept out of the hours seen.
        data_tests: [not_null]
      - name: episodes
        description: Episodes with a slot in the week.
        data_tests: [not_null]
      - name: episodes_started
        description: Episodes whose first slot is in the week.
        data_tests: [not_null]
      - name: outage_weeks_last4
        description: Weeks among this and the 3 before with an outage seen.
        data_tests: [not_null]
      - name: repeat_offender
        description: Outages seen in at least 3 of the last 4 weeks; null until there are 4 weeks of feed, and when under-observed weeks leave it open.
      - name: expected_slots
        description: 5-minute slots the week should hold (from fct_station_disruption_weekly).
        data_tests: [not_null]
      - name: observed_slots
        description: Slots with a successful poll.
        data_tests: [not_null]
      - name: observed_share
        description: observed_slots over expected_slots. Hours are a lower bound when under 1.
        data_tests: [not_null]

  - name: fct_station_disruption_weekly
    description: >
      Station disruption per ISO week (London) and station (M8), from the
      network-wide stop disruption feed (every 5 minutes). Time is counted
      in 5-minute UTC slots; a slot counts toward a category when a
      successful poll in it lists a disruption of that category in force
      for the station. Failed or missing polls never count as undisrupted:
      they lower observed_share, so hours are a lower bound when it is
      under 1. Categories in order: closure (TfL type Closure or Part
      Closure), step_free (text names step-free access or a lift), other.
      Standing notices (appearance Information) are left out. One row per
      week for every dim_station station, plus any other station with a
      counted disruption that week. The model comment has the full rules.
    config:
      contract:
        enforced: true
    columns:
      - name: station_disruption_weekly_key
        data_type: varchar
        description: Row key, a hash of (naptan_id, week_start).
        data_tests: [unique, not_null]
      - name: iso_week
        data_type: varchar
        description: "ISO week of week_start, 'YYYY-Www'."
        data_tests: [not_null]
      - name: week_start
        data_type: date
        description: Monday of the London week.
        data_tests: [not_null]
      - name: naptan_id
        data_type: varchar
        description: >
          Station id: the disrupted point's parent station code, or its own
          code when TfL gives no parent.
        data_tests: [not_null]
      - name: closure_hours
        data_type: double
        description: Hours the station was closed or not served by some of its trains (observed slots only).
        data_tests: [not_null]
      - name: step_free_hours
        data_type: double
        description: Hours with a step-free access or lift outage (observed slots only).
        data_tests: [not_null]
      - name: other_disruption_hours
        data_type: double
        description: Hours with any other disruption, e.g. escalator faults (observed slots only).
        data_tests: [not_null]
      - name: disruptions
        data_type: integer
        description: Distinct disruptions (station, type, appearance, description) in force in the week.
        data_tests: [not_null]
      - name: expected_slots
        data_type: bigint
        description: 5-minute slots in the week up to the feed's latest poll attempt.
        data_tests: [not_null]
      - name: observed_slots
        data_type: bigint
        description: Of those, slots with a successful poll.
        data_tests: [not_null]
      - name: observed_share
        data_type: double
        description: observed_slots / expected_slots, the share of the week's 5-minute polls that succeeded.
        data_tests: [not_null]

  - name: fct_station_weekly_measured
    description: >
      The measured view per ISO week (London), station, line and direction
      (M8), one row for each with any hour of service in
      int_station_measured_hours. The same inference, gate and long-gap rule
      as fct_line_weekly_measured, judged for the station's own hours.
      measured_status is `withheld` when the line-level view withholds the
      whole line (line_not_measured: seed_measured_lines; or
      shared_section_misfiled: measured_view_withheld_lines),
      `withheld` also at an end of the line (terminus, D70:
      dim_line_station_role), whose departures TfL lists with no direction
      and whose arrivals it lists on several platforms,
      `not_measured` when the station-direction-week fails (no_observed_hours,
      gate_not_judged, gate_failed, too_few_measured_hours, in that order),
      else `measured`. Gap measures are null unless measured; train counts
      are null when withheld. Stations without a TfL timetable (Elizabeth
      line, Overground) have null scheduled trains, trains-on-boards share,
      excess wait and long-gap rate. Missing polls never read as good: those
      hours are not observed and not judged.
    config:
      contract:
        enforced: true
    columns:
      - name: station_weekly_measured_key
        data_type: varchar
        description: Row key, a hash of (naptan_id, line_id, direction, week_start).
        data_tests: [unique, not_null]
      - name: iso_week
        data_type: varchar
        description: "ISO week of week_start, 'YYYY-Www'."
        data_tests: [not_null]
      - name: week_start
        data_type: date
        description: Monday of the London week.
        data_tests: [not_null]
      - name: naptan_id
        data_type: varchar
        description: Station (dim_station).
        data_tests: [not_null]
      - name: line_id
        data_type: varchar
        description: TfL line id.
        data_tests: [not_null]
      - name: direction
        data_type: varchar
        description: "`inbound` or `outbound`, TfL's direction on the line."
        data_tests: [not_null]
      - name: measured_status
        data_type: varchar
        description: "`measured`, `not_measured` or `withheld`; see the model description."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [measured, not_measured, withheld]
      - name: measured_withheld_reason
        data_type: varchar
        description: Why the row is not measured; null when it is.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - line_not_measured
                  - shared_section_misfiled
                  - terminus
                  - no_observed_hours
                  - gate_not_judged
                  - gate_failed
                  - too_few_measured_hours
      - name: observed_hours
        data_type: double
        description: Hours of service that were observed (enough polls, no collection gap).
        data_tests: [not_null]
      - name: trains_observed
        data_type: integer
        description: Trains on the boards (vehicle-id passes plus inferred trains without an id) in observed hours; null when withheld.
      - name: trains_per_hour
        data_type: double
        description: trains_observed / observed_hours; null when withheld or with no observed hour.
      - name: median_gap_minutes
        data_type: double
        description: Median in-service gap ending in a gated hour, in minutes (mean of the two middle gaps for an even count); null unless measured.
      - name: long_gaps
        data_type: integer
        description: Gaps over twice the hour's longest scheduled gap, in gated timetabled hours; null unless measured with at least one gated timetabled hour (no timetable means not computable, not 0).
      - name: long_gaps_per_100_hours
        data_type: double
        description: 100 x long_gaps / gated timetabled hours; null unless measured or without a timetable.
      - name: scheduled_trains
        data_type: integer
        description: Timetabled trains in observed hours, the denominator of trains_on_boards_share; null when the week has no timetabled hour (no TfL timetable, e.g. Elizabeth line and Overground).
      - name: trains_on_boards_share
        data_type: double
        description: Trains on the boards / scheduled trains, in observed timetabled hours (trains run, ADR-014); null when withheld, for trains_run_withheld_lines, or with no scheduled trains.
      - name: excess_wait_minutes
        data_type: double
        description: Mean over gated timetabled hours with an in-service gap of actual minus scheduled average wait (PLAN 7.3), minutes; null unless measured or without a timetable.
      - name: gate_judged_hours
        data_type: integer
        description: Observed hours with anything on the boards or inferred.
        data_tests: [not_null]
      - name: gate_pass_share
        data_type: double
        description: Share of judged hours inside the gate band; null when none was judged.
      - name: service_hours
        data_type: bigint
        description: Hours of service in the week (timetabled, or hours with trains without a timetable), the denominator of the too_few_measured_hours rule.
      - name: scheduled_hours
        data_type: bigint
        description: Of those, hours from a timetable.
      - name: measured_hours
        data_type: bigint
        description: Hours inside the gate band.
      - name: gate_in_band_hours
        data_type: bigint
        description: Judged hours inside the gate band.
      - name: fallback_measured_hours
        data_type: bigint
        description: Gated hours judged against seed_line_frequencies' estimate rather than a TfL timetable (weak evidence, D33).

  - name: dim_service_hours
    description: >
      Scheduled operating minutes per line, London date and time band, the
      denominator before missing minutes are taken out. Counted in real
      minutes, so the clock-change Sundays have 25 and 23 London hours.
    columns:
      - name: service_hours_key
        description: Row key, a hash of (line_id, london_date, time_band).
        data_tests: [unique, not_null]
      - name: line_id
        description: TfL line id.
        data_tests: [not_null]
      - name: london_date
        description: London date.
        data_tests: [not_null]
      - name: week_start
        description: Monday of the London week.
      - name: day_type
        description: Day type of the date.
      - name: day_class
        description: weekday or weekend.
      - name: time_band
        description: Time band.
        data_tests: [not_null]
      - name: time_weight
        description: Weight of the band.
      - name: scheduled_minutes
        description: Scheduled minutes in the band.
        data_tests: [not_null]
      - name: scheduled_hours
        description: The same in hours.

  - name: fct_line_daily
    description: >
      Declared-view metrics per line and London date (PLAN 7.1), over
      scheduled minutes. Scored minutes are scheduled, observed, and neither
      engineering works nor Service Closed. Disruption Index = 100 x sum of
      (severity weight x time weight) / sum of time weight, over scored
      minutes: the time-weighted mean severity on a 0 to 800 scale (D19,
      decided 2026-11-14).
    config:
      contract:
        enforced: true
    columns:
      - name: line_daily_key
        data_type: varchar
        description: Row key, a hash of (line_id, london_date).
        data_tests: [unique, not_null]
      - name: line_id
        data_type: varchar
        description: TfL line id.
        data_tests: [not_null]
      - name: london_date
        data_type: date
        description: London date.
        data_tests: [not_null]
      - name: week_start
        data_type: date
        description: Monday of the London week.
        data_tests: [not_null]
      - name: scheduled_minutes
        data_type: bigint
        description: Minutes inside scheduled hours.
      - name: observed_minutes
        data_type: bigint
        description: Scheduled minutes with a known status.
      - name: missing_minutes
        data_type: bigint
        description: Scheduled minutes without one.
      - name: engineering_works_minutes
        data_type: bigint
        description: Scheduled minutes whose worst status is a closure.
      - name: service_closed_minutes
        data_type: bigint
        description: Scheduled minutes TfL reported as Service Closed.
      - name: scored_minutes
        data_type: bigint
        description: The denominator of every score.
      - name: good_service_minutes
        data_type: bigint
        description: Scored minutes at Good Service (code 10).
      - name: disrupted_minutes
        data_type: bigint
        description: Scored minutes with a weight above 0.
      - name: weighted_disruption_minutes
        data_type: double
        description: Sum of severity weight x time weight over scored minutes.
      - name: time_weighted_scored_minutes
        data_type: double
        description: Sum of time weight over scored minutes; the Disruption Index's denominator (D19).
        data_tests: [not_null]
      - name: incidents
        data_type: bigint
        description: Incidents starting on the date.
      - name: median_recovery_minutes
        data_type: double
        description: Median recovery of closed incidents starting on the date.
      - name: completeness
        data_type: double
        description: observed_minutes / scheduled_minutes.
        data_tests: [not_null]
      - name: disruption_index
        data_type: double
        description: 100 x weighted_disruption_minutes / time_weighted_scored_minutes, 0 to 800 (D19); null with no scored minutes.
      - name: good_service_pct
        data_type: double
        description: Percentage of scored minutes at Good Service.
      - name: incidents_per_100_hours
        data_type: double
        description: Incidents per 100 scored service hours.

  - name: fct_line_weekly
    description: >
      Declared-view metrics per line and ISO week (Monday to Sunday, London
      time). Sums of fct_line_daily with ratios recomputed, the week's rank
      by Disruption Index (ties: higher Good Service %, D20), and movement
      against the previous week. A line-week under `provisional_completeness`
      (0.9) is provisional. A line that ran under `min_open_share_to_rank`
      (0.5) of its scheduled minutes because of engineering works keeps its
      index but is not ranked (D22, decided 2026-11-14). Holds no measured
      columns and does not depend on int_measured_hours, so a failing
      quality gate never skips it (ADR-014).
    config:
      contract:
        enforced: true
    columns:
      - name: line_weekly_key
        data_type: varchar
        description: Row key, a hash of (line_id, week_start).
        data_tests: [unique, not_null]
      - name: line_id
        data_type: varchar
        description: TfL line id.
        data_tests: [not_null]
      - name: week_start
        data_type: date
        description: Monday of the London week.
        data_tests: [not_null]
      - name: week_end
        data_type: date
        description: Sunday of the London week.
      - name: service_days
        data_type: bigint
        description: London dates with scheduled minutes.
      - name: scheduled_minutes
        data_type: bigint
        description: Minutes inside scheduled hours.
      - name: observed_minutes
        data_type: bigint
        description: Scheduled minutes with a known status.
      - name: missing_minutes
        data_type: bigint
        description: Scheduled minutes without one.
      - name: engineering_works_minutes
        data_type: bigint
        description: Engineering works minutes.
      - name: service_closed_minutes
        data_type: bigint
        description: Service Closed minutes in scheduled hours.
      - name: scored_minutes
        data_type: bigint
        description: Denominator of every score.
      - name: good_service_minutes
        data_type: bigint
        description: Scored minutes at Good Service.
      - name: disrupted_minutes
        data_type: bigint
        description: Scored minutes with a weight above 0.
      - name: weighted_disruption_minutes
        data_type: double
        description: Sum of severity weight x time weight.
      - name: time_weighted_scored_minutes
        data_type: double
        description: Sum of time weight over scored minutes (D19).
        data_tests: [not_null]
      - name: incidents
        data_type: bigint
        description: Incidents starting in the week.
      - name: median_recovery_minutes
        data_type: double
        description: Median recovery of closed incidents starting in the week.
      - name: completeness
        data_type: double
        description: observed_minutes / scheduled_minutes.
        data_tests: [not_null]
      - name: disruption_index
        data_type: double
        description: 100 x weighted_disruption_minutes / time_weighted_scored_minutes, 0 to 800 (D19).
      - name: good_service_pct
        data_type: double
        description: Percentage of scored minutes at Good Service.
      - name: incidents_per_100_hours
        data_type: double
        description: Incidents per 100 scored service hours.
      - name: engineering_works_share
        data_type: double
        description: engineering_works_minutes / scheduled_minutes; null with no scheduled minutes.
      - name: is_ranked
        data_type: boolean
        description: The line has a rank this week (D20, D22).
        data_tests: [not_null]
      - name: unranked_reason
        data_type: varchar
        description: >
          Why the line has no rank: `no_scored_minutes`, or
          `engineering_works` when works took more than half its scheduled
          minutes (D22). Null when ranked.
        data_tests:
          - accepted_values:
              arguments:
                values: [no_scored_minutes, engineering_works]
      - name: is_week_complete
        data_type: boolean
        description: The week's last London minute has passed by the wall clock, whatever the data holds; completeness and is_provisional say how much was observed.
        data_tests: [not_null]
      - name: is_provisional
        data_type: boolean
        description: Completeness under the threshold.
        data_tests: [not_null]
      - name: is_low_volume
        data_type: boolean
        description: Low-volume line.
      - name: disruption_rank
        data_type: bigint
        description: Rank in the week among ranked lines, 1 = least disrupted; null when unranked.
      - name: previous_disruption_rank
        data_type: bigint
        description: Rank in the previous week.
      - name: rank_movement
        data_type: bigint
        description: previous rank minus this rank; positive means the line climbed.
      - name: previous_disruption_index
        data_type: double
        description: The line's Disruption Index in the previous week; Line of the Week compares with it (D47).
      - name: built_at
        data_type: timestamp
        description: When this table was built (UTC). The export compares it with fct_line_weekly_measured.built_at.
        data_tests: [not_null]

  - name: fct_line_weekly_measured
    description: >
      Measured-view metrics per line and ISO week (PLAN 7.3), one row for
      every line-week of fct_line_weekly: sums of fct_line_measured_daily,
      the line-week gate (D51), weak evidence (D53) and the Experienced
      Reliability rank. Downstream of int_measured_hours, so a failing
      quality gate test skips it and the table keeps its last good build;
      the export then withholds every week that was not complete at
      `built_london_date` (`measured_not_rebuilt`).
    config:
      contract:
        enforced: true
    columns:
      - name: line_weekly_measured_key
        data_type: varchar
        description: Row key, a hash of (line_id, week_start).
        data_tests: [unique, not_null]
      - name: line_id
        data_type: varchar
        description: TfL line id.
        data_tests: [not_null]
      - name: week_start
        data_type: date
        description: Monday of the London week.
        data_tests: [not_null]
      - name: is_measured
        data_type: boolean
        description: seed_measured_lines scores the line in the measured view (D43).
        data_tests: [not_null]
      - name: measurement_status
        data_type: varchar
        description: >
          `measured`; `not_measured` when seed_measured_lines leaves the line
          out (no measured numbers are shown); `no_measured_hours` when no
          hour passed the quality gate.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [measured, not_measured, no_measured_hours]
      - name: scheduled_measurement_hours
        data_type: bigint
        description: Station-direction-hours with scheduled service on days the collector ran (int_measured_hours).
      - name: measured_share
        data_type: double
        description: measured_hours / scheduled_measurement_hours; the measured view's coverage.
      - name: observed_trains
        data_type: bigint
        description: Trains observed on the boards in observed station-direction-hours at core and branch stations (int_measured_hours, ADR-014, D66).
      - name: observed_hours_scheduled_trains
        data_type: bigint
        description: Scheduled trains in the same observed hours, core and branch stations only (D66).
      - name: trains_run_share
        data_type: double
        description: >
          observed_trains / observed_hours_scheduled_trains: trains run
          against the timetable at core and branch stations (ADR-014, D66).
          The boards may omit trains, so it is a lower bound. Withheld (null) for the lines in
          `trains_run_withheld_lines`, whose boards misfile trains.
      - name: is_measured_provisional
        data_type: boolean
        description: measured_share below `min_measured_share` (0.5), so the line gets no experienced_rank (D42); null when the line is not measured.
      - name: excess_wait_hours
        data_type: bigint
        description: Measured hours with at least one in-service headway, the denominator of excess_wait_minutes.
      - name: observed_measurement_hours
        data_type: bigint
        description: Station-direction-hours with scheduled service and complete arrivals polling (int_measured_hours).
      - name: measured_hours
        data_type: bigint
        description: Of those, hours inside the PLAN 7.2 quality gate, which feed the measured metrics.
      - name: excess_wait_minutes
        data_type: double
        description: >
          PLAN 7.3 mean excess wait over measured hours, minutes: actual
          average wait from observed headways minus the scheduled one.
          Negative values are kept. Null when not measured.
      - name: long_gaps
        data_type: bigint
        description: Headways over twice the longest scheduled gap of their hour (D34), in measured hours.
      - name: long_gaps_per_100_hours
        data_type: double
        description: long_gaps per 100 measured station-direction-hours (D42).
      - name: honesty_gap_hours
        data_type: bigint
        description: >
          PLAN 7.3 Honesty Gap (D68): London hours in which the line's
          declared status was Good Service for the whole hour and at least
          two measurement stations in the same direction each had a measured
          hour with a long gap ending in it whose whole span was Good
          Service. Termini do not count toward the two. Null, with
          honesty_gap_withheld_reason, on a line with too few core and
          branch measurement stations to corroborate any hour.
      - name: good_service_measured_hours
        data_type: bigint
        description: London hours of whole-hour Good Service with at least one measured station-direction-hour; the Honesty Gap's denominator.
      - name: honesty_gap_share
        data_type: double
        description: honesty_gap_hours / good_service_measured_hours; null when honesty_gap_hours is.
      - name: honesty_gap_withheld_reason
        data_type: varchar
        description: >
          `honesty_gap_not_corroborable` when the line is measured but has
          fewer than `honesty_gap_min_stations` core and branch measurement
          stations (Lioness, Windrush and Liberty), so no hour can be
          corroborated and the Honesty Gap is null rather than 0 (D68).
          Null otherwise.
        data_tests:
          - accepted_values:
              arguments:
                values: [honesty_gap_not_corroborable]
      - name: experienced_rank
        data_type: bigint
        description: >
          PLAN 7.3 Experienced Reliability rank within the week: lowest excess
          wait first, ties to fewer long gaps per 100 hours, among line-weeks
          whose measured numbers are published (measured_withheld_reason
          null, D51) and that are not weak evidence (D53). Null otherwise.
      - name: sum_excess_wait_seconds
        data_type: double
        description: Sum of excess wait over excess_wait_hours, seconds; the numerator of excess_wait_minutes.
      - name: fallback_measured_hours
        data_type: bigint
        description: Measured hours judged against the fallback frequencies of seed_line_frequencies (D33).
      - name: is_weak_evidence
        data_type: boolean
        description: >
          At least one measured hour was judged against an estimated
          timetable (D33; today only the Elizabeth line and the Overground). Their gate compares
          boards with estimates partly checked against the same boards.
        data_tests: [not_null]
      - name: gate_judged_hours
        data_type: bigint
        description: Judged station-direction-hours (ADR-014) at the line's core and branch stations; the line-week gate's denominator (D51).
      - name: gate_in_band_hours
        data_type: bigint
        description: Of those, hours inside the gate band.
      - name: gate_pass_share
        data_type: double
        description: gate_in_band_hours / gate_judged_hours.
      - name: measured_withheld_reason
        data_type: varchar
        description: >
          Why the line-week's measured numbers are not published, the first
          that applies: `line_not_measured` (D43), `shared_section_misfiled`
          (`measured_view_withheld_lines`, D52), `no_measured_hours`,
          `gate_not_judged` (no judged hour at a core or branch station),
          `gate_failed` (more than `gate_max_out_of_band_share` of judged
          hours out of band, D51), `too_few_measured_hours` (measured_share
          under `min_measured_share`, D42). Null when published.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - line_not_measured
                  - shared_section_misfiled
                  - no_measured_hours
                  - gate_not_judged
                  - gate_failed
                  - too_few_measured_hours
      - name: is_measured_published
        data_type: boolean
        description: >
          measured_withheld_reason is null; the export publishes the measured
          numbers (D42, settled 2026-11-14). The measured columns keep their
          values for withheld line-weeks, for checking; any reader that shows
          them must filter on this flag.
        data_tests: [not_null]
      - name: built_at
        data_type: timestamp
        description: When this table was built (UTC).
        data_tests: [not_null]
      - name: built_london_date
        data_type: date
        description: The London date of the build; weeks that ended before it were complete when the table was built.
        data_tests: [not_null]

  - name: fct_line_measured_daily
    description: >
      Measured-view sums per line and London date from int_measured_hours,
      measured lines only (D43). Every column adds up over days, so
      fct_line_weekly sums it for the ISO week and the publish code sums it
      for a custom window.
    config:
      contract:
        enforced: true
    columns:
      - name: line_measured_daily_key
        data_type: varchar
        description: Row key, a hash of (line_id, london_date).
        data_tests: [unique, not_null]
      - name: line_id
        data_type: varchar
        description: TfL line id.
        data_tests: [not_null]
      - name: london_date
        data_type: date
        description: London calendar date.
        data_tests: [not_null]
      - name: week_start
        data_type: date
        description: Monday of the London week.
        data_tests: [not_null]
      - name: scheduled_measurement_hours
        data_type: bigint
        description: Station-direction-hours with scheduled service.
        data_tests: [not_null]
      - name: observed_measurement_hours
        data_type: bigint
        description: Of those, hours with complete arrivals polling.
      - name: observed_trains
        data_type: bigint
        description: Trains on the boards in observed hours at core and branch stations (ADR-014, D66).
      - name: observed_hours_scheduled_trains
        data_type: bigint
        description: Scheduled trains in observed hours, core and branch stations only (D66).
      - name: measured_hours
        data_type: bigint
        description: Hours inside the quality gate, which feed the measured metrics.
        data_tests: [not_null]
      - name: excess_wait_hours
        data_type: bigint
        description: Measured hours with at least one in-service headway.
      - name: sum_excess_wait_seconds
        data_type: double
        description: Sum of excess wait over those hours, seconds.
      - name: long_gaps
        data_type: bigint
        description: Long gaps in measured hours (D34).
      - name: fallback_measured_hours
        data_type: bigint
        description: Measured hours judged against fallback frequencies (D33).
      - name: gate_judged_hours
        data_type: bigint
        description: Judged hours at core and branch stations (D51).
      - name: gate_in_band_hours
        data_type: bigint
        description: Of those, hours inside the gate band.
      - name: good_service_measured_hours
        data_type: bigint
        description: London hours of whole-hour Good Service with at least one measured hour of the line.
      - name: honesty_gap_hours
        data_type: bigint
        description: >
          Of those, hours in which long gaps with a whole Good Service span
          ended at at least `honesty_gap_min_stations` core and branch
          measurement stations in the same direction (PLAN 7.3 Honesty Gap,
          D68). Null, not 0, on a line seed_measurement_stations gives fewer
          than that many core and branch stations: none of its hours can be
          corroborated.

  - name: rpt_weekly_highlights
    description: >
      The week's headline facts (M6), one row per ISO week: the Wooden
      Spoon (bottom-ranked line, D48), Line of the Week (largest fall in
      Disruption Index since a complete previous week, D47) and the single
      worst incident (most severity-weighted minutes, D48).
    columns:
      - name: week_start
        description: Monday of the London week.
        data_tests: [unique, not_null]
      - name: week_end
        description: Sunday of the London week.
      - name: is_week_complete
        description: Every line's week has ended (fct_line_weekly.is_week_complete).
      - name: wooden_spoon_line_id
        description: The bottom-ranked line; lines sharing the bottom rank are split by line id. Null with no ranked line.
      - name: wooden_spoon_disruption_index
        description: Its Disruption Index.
      - name: wooden_spoon_is_provisional
        description: Its line-week is provisional (completeness under 90 %).
      - name: wooden_spoon_shared_by
        description: Lines sharing the bottom rank, the Wooden Spoon included.
      - name: line_of_the_week_line_id
        description: The most improved line, or null (see line_of_the_week_null_reason).
      - name: line_of_the_week_disruption_index
        description: Its Disruption Index this week.
      - name: line_of_the_week_previous_index
        description: Its Disruption Index the week before.
      - name: line_of_the_week_improvement
        description: previous index minus this week's, above 0.
      - name: line_of_the_week_null_reason
        description: Why there is no Line of the Week; null when there is one.
        data_tests:
          - accepted_values:
              arguments:
                values: [no_previous_week, previous_week_incomplete, no_line_improved]
      - name: worst_incident_line_id
        description: Line of the week's worst incident; null with none.
      - name: worst_incident_started_at
        description: Its first incident minute, UTC.
      - name: worst_incident_duration_minutes
        description: Its duration in minutes.
      - name: worst_incident_severity_weighted_minutes
        description: Its severity-weighted minutes, the ordering measure.
      - name: worst_incident_worst_status
        description: Its worst status.
      - name: worst_incident_is_open
        description: The incident may still be running.

  - name: rpt_monday_morning
    description: >
      Monday Morning Index per line and ISO week (M6, D49): the Disruption
      Index over Monday's AM peak (07:00 to 10:00 London time), with the
      weekly table's rules for scoring, completeness, ranking and works
      (D19, D20, D22).
    config:
      contract:
        enforced: true
    columns:
      - name: monday_morning_key
        data_type: varchar
        description: Row key, a hash of (line_id, week_start).
        data_tests: [unique, not_null]
      - name: line_id
        data_type: varchar
        description: TfL line id.
        data_tests: [not_null]
      - name: week_start
        data_type: date
        description: The Monday.
        data_tests: [not_null]
      - name: scheduled_minutes
        data_type: bigint
        description: Scheduled AM-peak minutes.
      - name: observed_minutes
        data_type: bigint
        description: Of those, minutes with a known status.
      - name: engineering_works_minutes
        data_type: bigint
        description: Of those, engineering works minutes.
      - name: scored_minutes
        data_type: bigint
        description: Scored minutes, the Good Service % denominator.
      - name: good_service_minutes
        data_type: bigint
        description: Scored minutes at Good Service.
      - name: weighted_disruption_minutes
        data_type: double
        description: Sum of severity weight x time weight.
      - name: time_weighted_scored_minutes
        data_type: double
        description: Sum of time weight over scored minutes.
      - name: completeness
        data_type: double
        description: observed_minutes / scheduled_minutes.
      - name: engineering_works_share
        data_type: double
        description: engineering_works_minutes / scheduled_minutes.
      - name: monday_morning_index
        data_type: double
        description: 100 x weighted_disruption_minutes / time_weighted_scored_minutes, 0 to 800.
      - name: good_service_pct
        data_type: double
        description: Percentage of scored minutes at Good Service.
      - name: is_provisional
        data_type: boolean
        description: Completeness under `provisional_completeness`.
        data_tests: [not_null]
      - name: unranked_reason
        data_type: varchar
        description: "`no_scored_minutes` or `engineering_works`; null when ranked."
        data_tests:
          - accepted_values:
              arguments:
                values: [no_scored_minutes, engineering_works]
      - name: monday_morning_rank
        data_type: bigint
        description: Rank among ranked lines that Monday, 1 = least disrupted.

  - name: rpt_engineering_works
    description: >
      Engineering Works table per line and ISO week (PLAN 7.4, M6, D50):
      hours whose worst declared status was a closure, which the Disruption
      Index leaves out. Every line-week has a row; lines without works have
      0 hours.
    columns:
      - name: engineering_works_key
        description: Row key, a hash of (line_id, week_start).
        data_tests: [unique, not_null]
      - name: line_id
        description: TfL line id.
        data_tests: [not_null]
      - name: week_start
        description: Monday of the London week.
        data_tests: [not_null]
      - name: week_end
        description: Sunday of the London week.
      - name: scheduled_minutes
        description: Minutes inside scheduled hours.
      - name: engineering_works_minutes
        description: Scheduled minutes under a closure.
        data_tests: [not_null]
      - name: engineering_works_hours
        description: engineering_works_minutes / 60.
      - name: engineering_works_share
        description: engineering_works_minutes / scheduled_minutes.
      - name: is_unranked_for_works
        description: The works left the line unranked this week (D22).
        data_tests: [not_null]
      - name: is_week_complete
        description: The week has ended.
      - name: works_rank
        description: 1 = most hours closed that week; lines with equal hours share a rank.

  - name: rpt_division_seeding
    description: >
      Division seeding (M6, ADR-015, DECISIONS.md D56): every line ordered by
      its Disruption Index over the first `division_seeding_weeks` complete
      weeks (two, not the plan's four), ties to the higher Good Service %,
      then line id, unranked lines last. The first `division_one_size`
      start in Division One. Empty until enough complete weeks exist ("not
      yet seeded"). `seeding_status` is `provisional` while fewer than
      `division_full_seeding_weeks` complete weeks exist.
    config:
      contract:
        enforced: true
    columns:
      - name: line_id
        data_type: varchar
        description: TfL line id.
        data_tests: [unique, not_null]
      - name: seed_position
        data_type: bigint
        description: 1 = best over the seeding weeks; no ties.
        data_tests: [unique, not_null]
      - name: division
        data_type: integer
        description: 1 or 2.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: false
      - name: disruption_index
        data_type: double
        description: Disruption Index over the seeding weeks (D19).
      - name: good_service_pct
        data_type: double
        description: Good Service share of scored minutes over the seeding weeks.
      - name: completeness
        data_type: double
        description: Observed over scheduled minutes in the seeding weeks.
      - name: engineering_works_share
        data_type: double
        description: Closure minutes over scheduled minutes in the seeding weeks.
      - name: unranked_reason
        data_type: varchar
        description: Why the line was seeded last (D20, D22); null when ranked.
      - name: seeding_start
        data_type: date
        description: Monday of the first seeding week.
        data_tests: [not_null]
      - name: seeding_end
        data_type: date
        description: Sunday of the last seeding week.
        data_tests: [not_null]
      - name: seeding_weeks
        data_type: bigint
        description: Weeks the seeding used (`division_seeding_weeks`).
      - name: complete_weeks_available
        data_type: bigint
        description: Complete weeks in the data at build time.
      - name: first_division_month
        data_type: date
        description: First day of the first month the divisions play.
        data_tests: [not_null]
      - name: seeding_status
        data_type: varchar
        description: "`provisional` or `confirmed` (ADR-015)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [provisional, confirmed]

  - name: rpt_divisions_monthly
    description: >
      Divisions per line and calendar month (PLAN 6.2, M6, D57), from the
      first division month: membership, the month's Disruption Index and
      rank within the division, and promotion and relegation of
      `division_moves` lines at the month's end. Unranked lines neither go
      up nor down, and nobody moves in a provisional month (a ranked line
      observed under `provisional_completeness`, D57). Empty until the
      divisions are seeded.
    config:
      contract:
        enforced: true
    columns:
      - name: line_month_key
        data_type: varchar
        description: Row key, a hash of (line_id, month_start).
        data_tests: [unique, not_null]
      - name: line_id
        data_type: varchar
        description: TfL line id.
        data_tests: [not_null]
      - name: month_start
        data_type: date
        description: First London date of the month.
        data_tests: [not_null]
      - name: month_end
        data_type: date
        description: Last London date of the month.
      - name: division
        data_type: integer
        description: The line's division this month, 1 or 2.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: false
      - name: joined_by
        data_type: varchar
        description: "`seeded`, `promoted`, `relegated` or `stayed`: how the line got here."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [seeded, promoted, relegated, stayed]
      - name: scheduled_minutes
        data_type: bigint
        description: Scheduled minutes in the month so far.
      - name: observed_minutes
        data_type: bigint
        description: Observed scheduled minutes.
      - name: engineering_works_minutes
        data_type: bigint
        description: Scheduled minutes under a closure.
      - name: scored_minutes
        data_type: bigint
        description: Minutes in the score.
      - name: disruption_index
        data_type: double
        description: Disruption Index over the month (D19).
      - name: good_service_pct
        data_type: double
        description: Good Service share of scored minutes.
      - name: completeness
        data_type: double
        description: Observed over scheduled minutes.
      - name: is_provisional
        data_type: boolean
        description: Completeness under `provisional_completeness`.
      - name: engineering_works_share
        data_type: double
        description: Closure minutes over scheduled minutes.
      - name: unranked_reason
        data_type: varchar
        description: "`no_scored_minutes` or `engineering_works` (D22); null when ranked."
      - name: division_rank
        data_type: bigint
        description: Rank within the division, 1 = lowest index; null when unranked.
      - name: movement
        data_type: varchar
        description: >
          `promoted`, `relegated` or `stays` at the month's end; while the
          month is running, where the line stands.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [promoted, relegated, stays]
      - name: movement_held_reason
        data_type: varchar
        description: >
          `provisional_month` when the month is provisional (a ranked line
          observed under `provisional_completeness`), so every line stays in
          its division whatever its rank (D57); null otherwise.
        data_tests:
          - accepted_values:
              arguments:
                values: [provisional_month]
      - name: next_division
        data_type: integer
        description: The division the line plays in next month.
        data_tests: [not_null]
      - name: is_month_complete
        data_type: boolean
        description: The month's last London date has passed.
        data_tests: [not_null]

  - name: rpt_season
    description: >
      The season table per line and season (PLAN 6.2, M6, D58): 1 April to
      31 March, resetting each April, cumulative declared-view standings
      with the weekly table's rules. The 2026-27 season starts with the
      collector, so until April 2027 it is the season to date.
    config:
      contract:
        enforced: true
    columns:
      - name: line_season_key
        data_type: varchar
        description: Row key, a hash of (line_id, season start year).
        data_tests: [unique, not_null]
      - name: line_id
        data_type: varchar
        description: TfL line id.
        data_tests: [not_null]
      - name: season
        data_type: varchar
        description: Season label, e.g. 2026-27.
        data_tests: [not_null]
      - name: season_start
        data_type: date
        description: 1 April.
        data_tests: [not_null]
      - name: season_end
        data_type: date
        description: 31 March.
        data_tests: [not_null]
      - name: first_observed_date
        data_type: date
        description: First London date with an observed minute this season.
      - name: last_observed_date
        data_type: date
        description: Last London date with an observed minute this season.
      - name: scheduled_minutes
        data_type: bigint
        description: Scheduled minutes in the season so far.
      - name: observed_minutes
        data_type: bigint
        description: Observed scheduled minutes.
      - name: engineering_works_minutes
        data_type: bigint
        description: Scheduled minutes under a closure.
      - name: scored_minutes
        data_type: bigint
        description: Minutes in the score.
      - name: good_service_minutes
        data_type: bigint
        description: Scored minutes at Good Service.
      - name: weighted_disruption_minutes
        data_type: double
        description: Sum of severity weight x time weight over scored minutes.
      - name: time_weighted_scored_minutes
        data_type: double
        description: Sum of time weight over scored minutes.
      - name: incidents
        data_type: bigint
        description: Incidents starting in the season.
      - name: disruption_index
        data_type: double
        description: Disruption Index over the season so far (D19).
      - name: good_service_pct
        data_type: double
        description: Good Service share of scored minutes.
      - name: incidents_per_100_hours
        data_type: double
        description: Incidents per 100 scored hours.
      - name: completeness
        data_type: double
        description: Observed over scheduled minutes.
      - name: is_provisional
        data_type: boolean
        description: Completeness under `provisional_completeness`.
      - name: engineering_works_share
        data_type: double
        description: Closure minutes over scheduled minutes.
      - name: unranked_reason
        data_type: varchar
        description: "`no_scored_minutes` or `engineering_works` (D22); null when ranked."
      - name: is_ranked
        data_type: boolean
        description: The line has a season rank.
      - name: season_rank
        data_type: bigint
        description: 1 = lowest index; equal lines share a rank; null when unranked.
      - name: is_season_complete
        data_type: boolean
        description: 31 March has passed.

  - name: rpt_recovery_time
    description: >
      The Recovery Time table per line and ISO week (PLAN M6, D59).
      Provisional: it rests on D18, which is open; `definition_status` says
      so on every row. Median recovery of incidents starting in the week,
      quickest first; lines with no closed incident are not ranked.
    columns:
      - name: line_weekly_key
        description: Row key, a hash of (line_id, week_start).
        data_tests: [unique, not_null]
      - name: line_id
        description: TfL line id.
        data_tests: [not_null]
      - name: week_start
        description: Monday of the London week.
        data_tests: [not_null]
      - name: week_end
        description: Sunday of the London week.
      - name: is_week_complete
        description: The week has ended.
      - name: incidents
        description: Incidents starting in the week.
        data_tests: [not_null]
      - name: recovered_incidents
        description: Of those, incidents that have ended (D18).
        data_tests: [not_null]
      - name: open_incidents
        description: Incidents still open; no recovery yet.
      - name: median_recovery_minutes
        description: Exact median of the recovered incidents' recovery minutes.
      - name: mean_recovery_minutes
        description: Mean of the same.
      - name: longest_recovery_minutes
        description: Longest of the same.
      - name: unranked_reason
        description: "`no_recovered_incidents`, or null when ranked."
      - name: recovery_rank
        description: 1 = quickest median; ties to fewer incidents, then shared.
      - name: definition_status
        description: "`provisional_d18`: the accepted D18 draft stays labelled provisional until a month of incidents has been reviewed (D59)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [provisional_d18]

  - name: rpt_league_strikes_excluded
    description: >
      The "strikes excluded" weekly league (PLAN 7.4, D60): each line's week
      without the London dates seed_industrial_action marks `held` or
      `announced` for it, ranked with the weekly table's rules. Equal to
      fct_line_weekly in weeks with no industrial action
      (assert_strikes_excluded_matches_league_without_strikes).
    config:
      contract:
        enforced: true
    columns:
      - name: line_weekly_key
        data_type: varchar
        description: Row key, a hash of (line_id, week_start).
        data_tests: [unique, not_null]
      - name: line_id
        data_type: varchar
        description: TfL line id.
        data_tests: [not_null]
      - name: week_start
        data_type: date
        description: Monday of the London week.
        data_tests: [not_null]
      - name: week_end
        data_type: date
        description: Sunday of the London week.
      - name: strike_days
        data_type: bigint
        description: London dates left out for this line.
        data_tests: [not_null]
      - name: week_has_industrial_action
        data_type: boolean
        description: Some line has a date left out this week.
        data_tests: [not_null]
      - name: scheduled_minutes
        data_type: bigint
        description: Scheduled minutes on the dates kept.
      - name: observed_minutes
        data_type: bigint
        description: Observed scheduled minutes on the dates kept.
      - name: engineering_works_minutes
        data_type: bigint
        description: Closure minutes on the dates kept.
      - name: scored_minutes
        data_type: bigint
        description: Scored minutes on the dates kept.
      - name: good_service_minutes
        data_type: bigint
        description: Good Service minutes on the dates kept.
      - name: weighted_disruption_minutes
        data_type: double
        description: Sum of severity weight x time weight over the scored minutes kept.
      - name: time_weighted_scored_minutes
        data_type: double
        description: Sum of time weight over the scored minutes kept.
      - name: disruption_index
        data_type: double
        description: Disruption Index over the dates kept (D19).
      - name: good_service_pct
        data_type: double
        description: Good Service share of the scored minutes kept.
      - name: completeness
        data_type: double
        description: Observed over scheduled minutes on the dates kept.
      - name: is_provisional
        data_type: boolean
        description: Completeness under `provisional_completeness`.
      - name: unranked_reason
        data_type: varchar
        description: "`no_scored_minutes` or `engineering_works` (D22); null when ranked."
      - name: is_ranked
        data_type: boolean
        description: The line has a rank in the variant.
      - name: disruption_rank
        data_type: bigint
        description: Rank in the variant; equal lines share a rank.

  - name: rpt_weekly_status_mix
    description: >
      Scored minutes per line, ISO week, worst status, planned flag and time
      band, unweighted (PLAN 7.5, D61). The publish code re-weights it to
      re-rank each week under the sensitivity weight sets.
      assert_status_mix_rebuilds_weekly_index checks it holds every scored
      minute of fct_line_weekly.
    config:
      contract:
        enforced: true
    columns:
      - name: status_mix_key
        data_type: varchar
        description: Row key, a hash of the grain.
        data_tests: [unique, not_null]
      - name: line_id
        data_type: varchar
        description: TfL line id.
        data_tests: [not_null]
      - name: week_start
        data_type: date
        description: Monday of the London week.
        data_tests: [not_null]
      - name: status_severity
        data_type: integer
        description: The minute's worst status (ADR-004).
        data_tests: [not_null]
      - name: is_planned
        data_type: boolean
        description: TfL filed the worst status as planned work, or the D69 rule classed it as planned works.
        data_tests: [not_null]
      - name: time_band
        data_type: varchar
        description: The minute's time band (time_bands seed).
        data_tests: [not_null]
      - name: scored_minutes
        data_type: bigint
        description: Scored minutes in the group.
        data_tests: [not_null]
      - name: weighted_disruption_minutes
        data_type: double
        description: Sum of base severity weight x time weight.
      - name: time_weighted_scored_minutes
        data_type: double
        description: Sum of base time weight.

  - name: rpt_prediction_accuracy
    description: >
      Countdown accuracy per line, London week and horizon (D71, pending),
      from int_prediction_errors. Measures how far TfL's countdown drifts
      before the train leaves the board, not accuracy against an
      independent clock: the arrival time is inferred from TfL's own last
      prediction, at about one-minute poll resolution. Percentiles are
      nearest-rank. A row may be shown only with at least
      `prediction_accuracy_min_matched` matched predictions. Not published.
    columns:
      - name: prediction_accuracy_key
        description: Row key, a hash of (week_start, line_id, horizon_minutes).
        data_tests: [unique, not_null]
      - name: week_start
        description: The Monday.
        data_tests: [not_null]
      - name: line_id
        description: TfL line id.
        data_tests: [not_null]
      - name: horizon_minutes
        description: The countdown scored, in minutes.
        data_tests: [not_null]
      - name: days_with_arrivals
        description: London days of the week with at least one eligible arrival; under 7 for a partial week.
        data_tests: [not_null]
      - name: eligible_arrivals
        description: Inferred arrivals with a vehicle id and a direction at core and branch measurement stations.
        data_tests: [not_null]
      - name: matched_predictions
        description: Of those, arrivals with a prediction at this horizon.
        data_tests: [not_null]
      - name: matched_share
        description: matched_predictions / eligible_arrivals.
        data_tests: [not_null]
      - name: median_abs_error_seconds
        description: Nearest-rank median of the absolute error; null with no match.
      - name: p90_abs_error_seconds
        description: Nearest-rank 90th percentile of the absolute error.
      - name: median_signed_error_seconds
        description: Nearest-rank median of the signed error; negative means trains tend to come earlier than the countdown said.
      - name: within_60s_share
        description: Share of matched predictions within 60 seconds of the arrival.
      - name: countdown_minute_seconds
        description: Real seconds per countdown minute, 60 x the sum of actual over the sum of predicted seconds; over 60 means the countdown runs slow.
      - name: is_shown
        description: At least `prediction_accuracy_min_matched` matched predictions, so the row may be shown.
        data_tests: [not_null]
