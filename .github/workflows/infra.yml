name: infra

# Plans infra/envs/prod on pull requests and applies it on main behind the
# protected `production` environment. Until the bootstrap has been applied and
# the repository variables are set (human step H6), both jobs are skipped and
# a notice explains why, so CI stays green.

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-prod
  cancel-in-progress: false

env:
  TF_VERSION: "1.16.6"
  TF_DIR: infra/envs/prod
  TF_IN_AUTOMATION: "true"
  AWS_REGION: eu-west-2

jobs:
  not-configured:
    if: vars.AWS_ROLE_ARN == '' || vars.AWS_PLAN_ROLE_ARN == '' || vars.TF_STATE_BUCKET == ''
    runs-on: ubuntu-24.04
    steps:
      - run: echo "::notice title=infra skipped::Set AWS_PLAN_ROLE_ARN, AWS_ROLE_ARN and TF_STATE_BUCKET repository variables after the bootstrap apply (docs/runbook.md, H6)."

  plan:
    if: github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN != '' && vars.TF_STATE_BUCKET != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: infra-plan-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform -chdir="$TF_DIR" init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      # The plan role is read-only, so no state lock is taken.
      - name: terraform plan
        run: |
          terraform -chdir="$TF_DIR" plan -input=false -lock=false -no-color -out=tfplan
          {
            echo '### terraform plan (infra/envs/prod)'
            echo '```'
            terraform -chdir="$TF_DIR" show -no-color tfplan | tail -n 200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != '' && vars.TF_STATE_BUCKET != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Required reviewer and main-only deployment branches are set on this
    # environment (human step H7); the apply role trusts only this environment.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: infra-apply-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform -chdir="$TF_DIR" init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: terraform plan
        run: terraform -chdir="$TF_DIR" plan -input=false -no-color -out=tfplan

      - name: terraform apply
        run: terraform -chdir="$TF_DIR" apply -input=false -no-color tfplan
