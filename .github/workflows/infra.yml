name: infra

# Plans infra/envs/prod on pull requests. On main, plans first (ungated,
# read-only), then applies exactly that saved plan once a reviewer approves
# the `production` environment, so the approval is given with the plan in
# view. Jobs skip with a notice until the repository variables exist
# (runbook H6, H7).

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions:
  contents: read

# PR plans run side by side; main runs queue behind each other.
concurrency:
  group: infra-${{ github.event_name == 'pull_request' && github.ref || 'prod' }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.16.6"
  TF_DIR: infra/envs/prod
  TF_IN_AUTOMATION: "true"
  AWS_REGION: eu-west-2
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  not-configured:
    if: vars.AWS_PLAN_ROLE_ARN == '' || vars.TF_STATE_BUCKET == ''
    runs-on: ubuntu-24.04
    steps:
      - run: echo "::notice title=infra plan skipped::Set the TF_STATE_BUCKET and AWS_PLAN_ROLE_ARN repository variables after the bootstrap apply (docs/runbook.md, H6)."

  apply-not-enabled:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN == ''
    runs-on: ubuntu-24.04
    steps:
      - run: echo "::notice title=infra apply skipped::AWS_ROLE_ARN is not set, so nothing is applied from CI (docs/runbook.md, H7)."

  plan:
    if: vars.AWS_PLAN_ROLE_ARN != '' && vars.TF_STATE_BUCKET != '' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: infra-plan-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform -chdir="$TF_DIR" init -input=false -backend-config="bucket=$TF_STATE_BUCKET"

      # The plan role is read-only, so no state lock is taken. If state moves
      # before the apply, Terraform rejects the saved plan as stale.
      - name: terraform plan
        run: |
          terraform -chdir="$TF_DIR" plan -input=false -lock=false -no-color -out=tfplan
          terraform -chdir="$TF_DIR" show -no-color tfplan > plan.txt
          lines=$(wc -l < plan.txt)
          {
            echo '### terraform plan (infra/envs/prod)'
            echo '```'
            head -n 400 plan.txt
            echo '```'
            if [ "$lines" -gt 400 ]; then
              echo "Truncated: showing 400 of $lines lines. The full plan is in the job log and the tfplan artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat plan.txt

      - name: upload plan for apply
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 3
          if-no-files-found: error

  apply:
    needs: plan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Required reviewer and main-only deployment branches are set on this
    # environment (runbook H7); the apply role trusts only this environment.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: infra-apply-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform -chdir="$TF_DIR" init -input=false -backend-config="bucket=$TF_STATE_BUCKET"

      - name: terraform apply (the plan approved above)
        run: terraform -chdir="$TF_DIR" apply -input=false -no-color tfplan
