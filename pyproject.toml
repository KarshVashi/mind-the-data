[project]
name = "mind-the-data"
version = "0.1.0"
description = "London rail reliability data products, starting with the Tube League Table."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.40",
    "httpx>=0.28",
    "pydantic>=2.11",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "dbt-core>=1.10,<2",
    "dbt-athena-community>=1.9,<2",
    "mypy>=2.0",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.15,<0.18",
    "sqlfluff>=3.4,<5",
    "sqlfluff-templater-dbt>=3.4,<5",
    "types-pyyaml>=6.0.12",
    "moto[cloudwatch,s3,ssm]>=5.1",
    "respx>=0.22",
    "boto3-stubs[cloudwatch,s3,ssm]>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mind_the_data"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["transform/target", "transform/dbt_packages"]

[tool.ruff.lint]
# ruff defaults plus import sorting.
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["mind_the_data"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

[tool.uv]
# Supply-chain hygiene: resolve only releases at least two weeks old at the
# time of the last bump. Move this date forward deliberately when upgrading.
exclude-newer = "2026-10-19T00:00:00Z"
