version: 2

# Hand-computed cases for the declared-view logic (PLAN M3, task 4). Every
# expected value is worked out in the description; none was copied from a
# model run. The seeds are given in full where the logic reads them, so a
# seed edit cannot silently change what these tests check.

unit_tests:
  - name: int_line_minute_status_worst_status_polls_and_gaps
    description: >
      Tuesday 2026-11-03, GMT, so London time equals UTC and 08:15 to 08:20
      sit in the weekday am_peak band (weight 2); both lines are in service
      (Victoria 05:25 to 00:45, Bakerloo 05:35 to 00:40).
      08:15: Victoria has Severe Delays (weight 3) and a planned Part Closure
      (0): the delay wins, the closure is noted, the minute is scored, not
      engineering works. Bakerloo has Good Service with no validity period.
      08:16: two polls. The later one (p3) lists Victoria with only the
      Part Closure, so Victoria is engineering works. p3 omits Bakerloo, so
      Bakerloo is read from p2 (Good Service), not marked missing.
      08:17: the only poll failed; 08:18: no poll. Both lines missing,
      never Good Service.
      08:19: Victoria has a planned Bus Service (weight 0 when planned) and
      Minor Delays valid only from 09:00, which does not count yet. Bakerloo's
      only entry expired at 08:19:00, so it has no current entry: missing.
      08:20: a successful poll without Bakerloo: missing, line_not_in_poll.
      08:21: two polls. Victoria's later poll (p8) lists only an entry that
      expired at 08:21:00, so Victoria is missing (no_current_entry) even
      though p7 had Good Service: the latest poll listing the line decides
      (ADR-013). Bakerloo (p7 only) has Good Service and code 1, which the
      weights seed lacks: the unweighted code wins the minute with a null
      weight, so the severity_weight not_null test fails the build.
      08:25: no poll, missing. 09:00 is the spine's last minute; the latest
      staged poll is 08:21, so the trim keeps everything up to
      max(08:21, 09:00 - 30 min) = 08:30. 09:00 has no row yet, and 08:25,
      inside the bound, is kept as missing.
    model: int_line_minute_status
    overrides:
      vars:
        raw_start_date: "2026-11-03"
    given:
      - input: ref('int_utc_minutes')
        rows:
          - {minute_utc: "2026-11-03 08:15:00", dt: "2026-11-03"}
          - {minute_utc: "2026-11-03 08:16:00", dt: "2026-11-03"}
          - {minute_utc: "2026-11-03 08:17:00", dt: "2026-11-03"}
          - {minute_utc: "2026-11-03 08:18:00", dt: "2026-11-03"}
          - {minute_utc: "2026-11-03 08:19:00", dt: "2026-11-03"}
          - {minute_utc: "2026-11-03 08:20:00", dt: "2026-11-03"}
          - {minute_utc: "2026-11-03 08:21:00", dt: "2026-11-03"}
          - {minute_utc: "2026-11-03 08:25:00", dt: "2026-11-03"}
          - {minute_utc: "2026-11-03 09:00:00", dt: "2026-11-03"}
      - input: ref('dim_lines')
        rows:
          - {line_id: victoria}
          - {line_id: bakerloo}
      - input: ref('day_types')
        rows: &day_types
          - {iso_day_of_week: 1, day_type: mon_thu, day_class: weekday}
          - {iso_day_of_week: 2, day_type: mon_thu, day_class: weekday}
          - {iso_day_of_week: 3, day_type: mon_thu, day_class: weekday}
          - {iso_day_of_week: 4, day_type: mon_thu, day_class: weekday}
          - {iso_day_of_week: 5, day_type: fri, day_class: weekday}
          - {iso_day_of_week: 6, day_type: sat, day_class: weekend}
          - {iso_day_of_week: 7, day_type: sun, day_class: weekend}
      - input: ref('time_bands')
        rows: &time_bands
          - {day_class: weekday, time_band: early, band_start_minute: 0, band_end_minute: 420, time_weight: 1}
          - {day_class: weekday, time_band: am_peak, band_start_minute: 420, band_end_minute: 600, time_weight: 2}
          - {day_class: weekday, time_band: inter_peak, band_start_minute: 600, band_end_minute: 960, time_weight: 1}
          - {day_class: weekday, time_band: pm_peak, band_start_minute: 960, band_end_minute: 1140, time_weight: 2}
          - {day_class: weekday, time_band: evening, band_start_minute: 1140, band_end_minute: 1440, time_weight: 1}
          - {day_class: weekend, time_band: weekend, band_start_minute: 0, band_end_minute: 1440, time_weight: 0.75}
      - input: ref('line_operating_hours')
        rows: &operating_hours
          - {line_id: victoria, day_type: mon_thu, service_start_minute: 325, service_end_minute: 1485}
          - {line_id: victoria, day_type: fri, service_start_minute: 325, service_end_minute: 1635}
          - {line_id: victoria, day_type: sat, service_start_minute: 195, service_end_minute: 1635}
          - {line_id: victoria, day_type: sun, service_start_minute: 195, service_end_minute: 1450}
          - {line_id: bakerloo, day_type: mon_thu, service_start_minute: 335, service_end_minute: 1480}
          - {line_id: bakerloo, day_type: fri, service_start_minute: 335, service_end_minute: 1480}
          - {line_id: bakerloo, day_type: sat, service_start_minute: 335, service_end_minute: 1480}
          - {line_id: bakerloo, day_type: sun, service_start_minute: 435, service_end_minute: 1440}
      - input: ref('severity_weights')
        rows: &severity_weights
          - {severity_code: 5, description: Part Closure, weight_unplanned: 0, weight_planned: 0, is_closure: true, is_service_closed: false}
          - {severity_code: 6, description: Severe Delays, weight_unplanned: 3, weight_planned: 3, is_closure: false, is_service_closed: false}
          - {severity_code: 8, description: Bus Service, weight_unplanned: 5, weight_planned: 0, is_closure: false, is_service_closed: false}
          - {severity_code: 9, description: Minor Delays, weight_unplanned: 1, weight_planned: 1, is_closure: false, is_service_closed: false}
          - {severity_code: 10, description: Good Service, weight_unplanned: 0, weight_planned: 0, is_closure: false, is_service_closed: false}
          - {severity_code: 20, description: Service Closed, weight_unplanned: 0, weight_planned: 0, is_closure: false, is_service_closed: true}
      - input: ref('stg_polls')
        rows:
          - {poll_id: p1, feed: line_status, is_ok: true, poll_minute: "2026-11-03 08:15:00", dt: "2026-11-03"}
          - {poll_id: p2, feed: line_status, is_ok: true, poll_minute: "2026-11-03 08:16:00", dt: "2026-11-03"}
          - {poll_id: p3, feed: line_status, is_ok: true, poll_minute: "2026-11-03 08:16:00", dt: "2026-11-03"}
          - {poll_id: p4, feed: line_status, is_ok: false, poll_minute: "2026-11-03 08:17:00", dt: "2026-11-03"}
          - {poll_id: p4, feed: arrivals, is_ok: true, poll_minute: "2026-11-03 08:17:00", dt: "2026-11-03"}
          - {poll_id: p5, feed: line_status, is_ok: true, poll_minute: "2026-11-03 08:19:00", dt: "2026-11-03"}
          - {poll_id: p6, feed: line_status, is_ok: true, poll_minute: "2026-11-03 08:20:00", dt: "2026-11-03"}
          - {poll_id: p7, feed: line_status, is_ok: true, poll_minute: "2026-11-03 08:21:00", dt: "2026-11-03"}
          - {poll_id: p8, feed: line_status, is_ok: true, poll_minute: "2026-11-03 08:21:00", dt: "2026-11-03"}
      - input: ref('stg_line_status')
        rows:
          - {poll_id: p1, request_path: /s, polled_at: "2026-11-03 08:15:00.100", poll_minute: "2026-11-03 08:15:00", line_id: victoria, status_ordinal: 1, status_severity: 6, status_severity_description: Severe Delays, reason: Signal failure, is_planned: false, valid_from: "2026-11-03 08:01:00", valid_to: "2026-11-03 09:30:00", dt: "2026-11-03"}
          - {poll_id: p1, request_path: /s, polled_at: "2026-11-03 08:15:00.100", poll_minute: "2026-11-03 08:15:00", line_id: victoria, status_ordinal: 2, status_severity: 5, status_severity_description: Part Closure, reason: Works, is_planned: true, valid_from: "2026-11-03 00:00:00", valid_to: "2026-11-03 23:59:00", dt: "2026-11-03"}
          - {poll_id: p1, request_path: /s, polled_at: "2026-11-03 08:15:00.100", poll_minute: "2026-11-03 08:15:00", line_id: bakerloo, status_ordinal: 1, status_severity: 10, status_severity_description: Good Service, reason: null, is_planned: false, valid_from: null, valid_to: null, dt: "2026-11-03"}
