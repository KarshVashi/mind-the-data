version: 2

macros:
  - name: staging_window
    description: >
      The raw days a staging run reads, as {start, end} 'YYYY-MM-DD' strings
      (inclusive, UTC). `start_date`/`end_date` vars win; otherwise an
      incremental run starts `lookback_days` before today and a full refresh
      starts at `raw_start_date`. The end defaults to today. Fails compilation
      on a malformed date or an inverted window.
  - name: raw_dt_filter
    description: "`dt between '<start>' and '<end>'` for the current staging window, as literals so partition projection prunes."
  - name: staging_incremental_predicates
    description: >
      The merge's predicate on the existing staging table: `target.dt` from
      `start_date` when set, otherwise from current_date minus
      (lookback_days + 1) days. The extra day covers a run that crosses
      midnight UTC (ADR-008).
  - name: resolve_table_type
    description: >
      Overrides dbt_athena.resolve_table_type (checked against dbt-athena
      1.11.1). For a unit test it returns iceberg, the table type of every
      model here, because dbt drops the model's config for the test's
      temporary table and dbt-athena would build it as Hive, which rejects
      timestamp(6). Everything else defers to dbt-athena.
  - name: iceberg_maintenance
    description: >
      Weekly Iceberg maintenance (PLAN M7, D64), run with `dbt run-operation`:
      OPTIMIZE (bin pack) then VACUUM on every incremental Iceberg model that
      exists in the target. OPTIMIZE covers the partitions from
      `maintenance_lookback_days` back, or all of them with `full`. Retries
      while Athena asks for more runs.
    arguments:
      - name: dry_run
        type: bool
        description: Log the statements and run nothing (default false).
      - name: full
        type: bool
        description: Compact every partition, not just recent ones (default false).
  - name: iceberg_maintenance_targets
    description: The enabled incremental Iceberg models among the given graph nodes, by name.
    arguments:
      - name: nodes
        type: list[dict[str, any]]
        description: Graph nodes, e.g. graph.nodes.values().
  - name: iceberg_maintenance_sql
    description: >
      The OPTIMIZE and VACUUM statements for one table. Refuses names that are
      not plain lower-case identifiers and a `since` that is not YYYY-MM-DD.
    arguments:
      - name: schema
        type: string
        description: Glue database.
      - name: identifier
        type: string
        description: Table name.
      - name: partitioned_by
        type: list[string]
        description: The model's partition columns; the first bounds OPTIMIZE.
      - name: since
        type: string
        description: First partition date to compact, or none for all.
  - name: raw_feeds
    description: Names of the raw feed tables in the `raw` source.
  - name: envelope_is_ok
    description: True when an envelope is 2xx, has no collector error and has a payload; never null.
    arguments:
      - name: http_status
        type: string
        description: Expression for the HTTP status.
      - name: error
        type: string
        description: Expression for the collector error.
      - name: payload
        type: string
        description: Expression for the payload text.
  - name: raw_envelopes
    description: >
      Select of one raw feed's envelopes inside the staging window, one row
      per (poll_id, request_path), with `polled_at` as UTC timestamp(6), `dt`
      as a date and `is_ok`. Duplicate copies keep the successful one, then
      the earliest.
    arguments:
      - name: feed
        type: string
        description: Raw table name in the `raw` source.
      - name: successful_only
        type: bool
        description: Keep only `is_ok` envelopes (default true).
  - name: utc_timestamp
    description: ISO 8601 text with a zone to a zoneless UTC timestamp(6), the type Iceberg on Athena stores.
    arguments:
      - name: expr
        type: string
        description: SQL expression yielding ISO 8601 text.
  - name: tfl_timestamp
    description: Like utc_timestamp, but TfL's '0001-01-01...' placeholder and null become null.
    arguments:
      - name: expr
        type: string
        description: SQL expression yielding a TfL date string.
  - name: json_text
    description: A JSON string field with empty strings read as null.
    arguments:
      - name: json_expr
        type: string
        description: SQL expression of type json.
      - name: path
        type: string
        description: JSONPath, e.g. '$.reason'.
  - name: json_array_or_null
    description: >
      The JSON array at `path` as array(json), or array[null] when it is
      missing or empty, so unnesting keeps the parent row.
    arguments:
      - name: json_expr
        type: string
        description: SQL expression of type json.
      - name: path
        type: string
        description: JSONPath of the array.
  - name: row_key
    description: md5 hex of the given columns joined with '|', nulls spelled out. Staging merge key.
    arguments:
      - name: columns
        type: list[string]
        description: Column expressions making up the grain.
  - name: stale_tmp_identifiers
    description: "The names, sorted, that end in `__dbt_tmp`: tables dbt-athena leaves behind when a run fails part way."
    arguments:
      - name: identifiers
        type: list[string]
        description: Table names in the target schema.
  - name: drop_stale_tmp_relations
    description: >
      Run with `dbt run-operation` before the daily build: drops every
      `__dbt_tmp` table in the target schema, so a leftover from a failed run
      does not stop the next one with TABLE_ALREADY_EXISTS. A tmp table that
      shares its base table's S3 location is skipped. `dry_run` only logs
      what it would drop.
    arguments:
      - name: dry_run
        type: bool
        description: Log what would be dropped without dropping it.
