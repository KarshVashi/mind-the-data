version: 2

macros:
  - name: staging_window
    description: >
      The raw days a staging run reads, as {start, end} 'YYYY-MM-DD' strings
      (inclusive, UTC). `start_date`/`end_date` vars win; otherwise an
      incremental run starts `lookback_days` before today and a full refresh
      starts at `raw_start_date`, or with `initial_days` that many days back
      (not before raw_start_date). The end defaults to today. Fails
      compilation on a malformed date or an inverted window.
    arguments:
      - name: initial_days
        type: integer
        description: Optional bound on a first build or full refresh without start_date (station models).
  - name: raw_dt_filter
    description: "`dt between '<start>' and '<end>'` for the current staging window, as literals so partition projection prunes."
    arguments:
      - name: initial_days
        type: integer
        description: Passed to staging_window.
  - name: staging_incremental_predicates
    description: >
      The merge's predicate on the existing staging table: `target.dt` from
      `start_date` when set, otherwise from current_date minus
      (lookback_days + 1) days. The extra day covers a run that crosses
      midnight UTC (ADR-008).
  - name: resolve_table_type
    description: >
      Overrides dbt_athena.resolve_table_type (checked against dbt-athena
      1.11.1). For a unit test it returns iceberg, the table type of every
      model here, because dbt drops the model's config for the test's
      temporary table and dbt-athena would build it as Hive, which rejects
      timestamp(6). Everything else defers to dbt-athena.
  - name: iceberg_maintenance
    description: >
      Weekly Iceberg maintenance (PLAN M7, D64), run with `dbt run-operation`:
      OPTIMIZE (bin pack) then VACUUM on every incremental Iceberg model that
      exists in the target. OPTIMIZE covers the partitions from
      `maintenance_lookback_days` back, or all of them with `full`. Retries
      while Athena asks for more runs.
    arguments:
      - name: dry_run
        type: bool
        description: Log the statements and run nothing (default false).
      - name: full
        type: bool
        description: Compact every partition, not just recent ones (default false).
  - name: iceberg_maintenance_targets
    description: The enabled incremental Iceberg models among the given graph nodes, by name.
    arguments:
      - name: nodes
        type: list[dict[str, any]]
        description: Graph nodes, e.g. graph.nodes.values().
  - name: iceberg_maintenance_sql
    description: >
      The OPTIMIZE and VACUUM statements for one table. Refuses names that are
      not plain lower-case identifiers and a `since` that is not YYYY-MM-DD.
    arguments:
      - name: schema
        type: string
        description: Glue database.
      - name: identifier
        type: string
        description: Table name.
      - name: partitioned_by
        type: list[string]
        description: The model's partition columns; the first bounds OPTIMIZE.
      - name: since
        type: string
        description: First partition date to compact, or none for all.
  - name: raw_feeds
    description: Names of the raw feed tables in the `raw` source.
  - name: envelope_is_ok
    description: True when an envelope is 2xx, has no collector error and has a payload; never null.
    arguments:
      - name: http_status
        type: string
        description: Expression for the HTTP status.
      - name: error
        type: string
        description: Expression for the collector error.
      - name: payload
        type: string
        description: Expression for the payload text.
  - name: raw_envelopes
    description: >
      Select of one raw feed's envelopes inside the staging window, one row
      per (poll_id, request_path), with `polled_at` as UTC timestamp(6), `dt`
      as a date and `is_ok`. Duplicate copies keep the successful one, then
      the earliest.
    arguments:
      - name: feed
        type: string
        description: Raw table name in the `raw` source.
      - name: successful_only
        type: bool
        description: Keep only `is_ok` envelopes (default true).
      - name: initial_days
        type: integer
        description: Passed to staging_window; bounds a first build or full refresh.
  - name: utc_timestamp
    description: ISO 8601 text with a zone to a zoneless UTC timestamp(6), the type Iceberg on Athena stores.
    arguments:
      - name: expr
        type: string
        description: SQL expression yielding ISO 8601 text.
  - name: tfl_timestamp
    description: Like utc_timestamp, but TfL's '0001-01-01...' placeholder and null become null.
    arguments:
      - name: expr
        type: string
        description: SQL expression yielding a TfL date string.
  - name: json_text
    description: A JSON string field with empty strings read as null.
    arguments:
      - name: json_expr
        type: string
        description: SQL expression of type json.
      - name: path
        type: string
        description: JSONPath, e.g. '$.reason'.
  - name: json_array_or_null
    description: >
      The JSON array at `path` as array(json), or array[null] when it is
      missing or empty, so unnesting keeps the parent row.
    arguments:
      - name: json_expr
        type: string
        description: SQL expression of type json.
      - name: path
        type: string
        description: JSONPath of the array.
  - name: row_key
    description: md5 hex of the given columns joined with '|', nulls spelled out. Staging merge key.
    arguments:
      - name: columns
        type: list[string]
        description: Column expressions making up the grain.
  - name: stale_tmp_identifiers
    description: "The names, sorted, that end in `__dbt_tmp`: tables dbt-athena leaves behind when a run fails part way."
    arguments:
      - name: identifiers
        type: list[string]
        description: Table names in the target schema.
  - name: drop_stale_tmp_relations
    description: >
      Run with `dbt run-operation` before the daily build: drops every
      `__dbt_tmp` table in the target schema, so a leftover from a failed run
      does not stop the next one with TABLE_ALREADY_EXISTS. A tmp table that
      shares its base table's S3 location is skipped. `dry_run` only logs
      what it would drop.
    arguments:
      - name: dry_run
        type: bool
        description: Log what would be dropped without dropping it.
  - name: athena__safe_cast
    description: >
      Overrides dbt_athena.athena__safe_cast (checked against dbt-athena
      1.11.1) so a YAML list in a unit-test fixture row casts as an Athena
      array (`array['a', 'b']`); everything else is try_cast as before.
    arguments:
      - name: field
        type: string
        description: SQL expression, or a list of values from a fixture row.
      - name: type
        type: string
        description: Target Athena type.
  - name: fill_missing_direction
    description: >
      Predictions with a missing direction filled where the boards show it
      (D65): from the same vehicle id's sightings on the platform that UTC
      day on vehicle-id lines, else from a one-way platform away from
      turnbacks; never for a train terminating at the stop or on "Platform
      Unknown". Used by int_arrivals_directed and int_station_arrivals_directed.
    arguments:
      - name: predictions
        type: string
        description: Relation shaped like stg_arrivals, read in full; the reading model's dt filter bounds it.
  - name: inferred_arrivals
    description: >
      The train-arrival inference (PLAN 7.2), shared by int_inferred_arrivals
      (per-station feed) and int_station_inferred_arrivals (line feed). With
      the measurement-station arguments it renders the SQL
      int_inferred_arrivals held before it was shared.
    arguments:
      - name: predictions
        type: string
        description: Relation shaped like stg_arrivals.
      - name: polls
        type: string
        description: Relation shaped like stg_polls.
      - name: predictions_where
        type: string
        description: Predicate bounding the predictions read (alias `arrivals`).
      - name: polls_where
        type: string
        description: Predicate choosing the successful polls read.
      - name: output_where
        type: string
        description: Optional predicate on the arrivals written (on expected_arrival).
  - name: vehicle_passes
    description: Vehicle-id passes (ADR-014), shared by int_vehicle_passes and int_station_vehicle_passes.
    arguments:
      - name: predictions
        type: string
        description: Relation shaped like stg_arrivals.
      - name: predictions_where
        type: string
        description: Predicate bounding the predictions read.
      - name: output_where
        type: string
        description: Optional predicate on the visits written (on pass_time).
  - name: headways
    description: Gaps between inferred arrivals with collection-gap flags (D28), shared by int_headways and int_station_headways.
    arguments:
      - name: arrivals
        type: string
        description: Relation shaped like int_inferred_arrivals.
      - name: polls
        type: string
        description: Relation shaped like stg_polls.
      - name: polls_where
        type: string
        description: Predicate choosing the successful polls read.
      - name: stations
        type: string
        description: Optional relation of (line_id, naptan_id) pairs to keep.
  - name: window_rebuild_bounds
    description: >
      The every-station inference models' window as {read_start, start, end}
      'YYYY-MM-DD' strings: the staging window, plus one day read before it.
  - name: delete_window_rows
    description: Pre-hook for the windowed models; on an incremental run, deletes the window's rows of `column`.
    arguments:
      - name: column
        type: string
        description: Date column the window applies to.
  - name: window_incremental_predicates
    description: As staging_incremental_predicates, on any date column of the target.
    arguments:
      - name: column
        type: string
        description: Date column of the target.
  - name: journey_passes
    description: The vehicle-id passes the Should I Run models read, by `journey_source` (ADR-018).
  - name: journey_measured_hours
    description: The measured hours (the quality gate) matching journey_passes.
  - name: latest_route_stops
    description: Stops of every route in the latest route-sequence fetch per line and direction, for lines that link by vehicle id.
  - name: in_journey_windows
    description: True when a London minute of the day is inside a `journey_slot_windows` window, optionally widened at the start.
    arguments:
      - name: minute_expr
        type: string
        description: SQL for the London minute of the day.
      - name: lookback
        type: integer
        description: Minutes to widen each window at its start.
  - name: nearest_rank
    description: Nearest-rank percentile as an aggregate, given a row number and a row count per group.
    arguments:
      - name: value
        type: string
        description: SQL for the value.
      - name: rank
        type: string
        description: SQL for the row's rank in ascending order of value.
      - name: n
        type: string
        description: SQL for the group's row count.
      - name: p
        type: float
        description: The percentile, 0 to 1.
