  - name: int_measured_hours_gate_observation_and_excess_wait
    description: >
      Station X (Victoria outbound, core) on Wednesday 4 November 2026, GMT,
      so London time is UTC. Scheduled: service hour 24 of Tuesday's
      mon_thu timetable (6 trains, gaps of 600 s) is London hour 0 on the
      4th (Night Tube rule, D30); hour 5 has 10 trains (gaps 360 s); hours 8
      and 9 have 30 each (gaps 120 s). Polls every minute from 00:00:10 to
      05:58:10, then 06:01:10 to 09:52:10.
      Hour 0: 60 polls, observed; 8 arrivals, 8/6 = 1.33, out of band. One
      600 s gap: actual wait 600^2/(2 x 600) = 300 s, scheduled 300 s,
      excess 0. Hour 5: 59 polls and the 05:58:10 to 06:01:10 gap (180 s
      over 150) touches it, so not observed and never in band. Its gap from
      00:55 to 05:10 spans unscheduled hours 1 to 4 and is dropped; the 360 s
      gap counts: excess 180 - 180 = 0. Hour 8: 60 polls, 24 arrivals, 24/30
      = 0.8 exactly, in band. Gaps 120, 120 and 300 s count (sum 540, squares
      118,800: actual 110 s, scheduled 60 s, excess 50 s); 300 > 2 x 120 is
      one long gap; a 600 s gap across a collection gap is left out. Hour 9:
      53 polls, not observed; its gap from 08:59 to 09:01 spans two scheduled
      hours and counts. Station Y on Sunday 25 October, the fall-back day:
      London 01:00 to 01:59 happens twice, 120 polls over two UTC hours and
      12 arrivals against 6 scheduled (Saturday service hour 25): not
      observed, so not a gate failure.
      The gate (ADR-014) compares inferred trains with trains observed on
      the boards: vehicle-id passes plus inferred arrivals without an id.
      Hour 0: 8 inferred, all with ids, against 6 passes: 8/6 = 1.33, out
      of band; trains run 6/6 = 1. Hour 8: 24 inferred, 4 without an id,
      and 16 passes: observed 16 + 4 = 20, 24/20 = 1.2 exactly, in band;
      trains run 20/30 = 0.67 (it would have been 0.8 against the
      timetable). Hour 2 (Tuesday's service hour 26, 6 scheduled) is
      observed but no train was on the boards and none inferred: not
      judged, so not in band and not a gate failure. Hour 3 (service hour
      27, 6 scheduled) is observed with 3 trains inferred, all with ids, and
      none on the boards: judged and out of band.
    model: int_measured_hours
    overrides:
      vars:
        raw_start_date: "2026-10-01"
        collection_gap_seconds: 150
        min_polls_per_hour: 54
        gate_low_ratio: 0.8
        gate_high_ratio: 1.2
    given:
      - input: ref('seed_measurement_stations')
        rows:
          - {line_id: victoria, naptan_id: X, station_name: X, role: core}
          - {line_id: victoria, naptan_id: Y, station_name: Y, role: core}
      - input: ref('seed_measured_lines')
        rows:
          - {line_id: victoria, is_measured: true}
      - input: ref('day_types')
        rows:
          - {iso_day_of_week: 1, day_type: mon_thu}
