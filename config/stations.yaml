# Measurement stations: whose Arrivals board is polled every minute, per line.
#
# Chosen from Line/{id}/Route/Sequence/outbound (scripts/discover_lines.py,
# 2026-11-03). Rules, from PLAN 5.2 and 5.3:
# - 3 to 5 stations per line: busy core stations plus branch ends. Fewer only
#   where lines.yaml sets min_stations because the line is that short.
# - One Arrivals call returns every line serving that StopPoint, so interchanges
#   are reused wherever they fit. Each distinct naptan_id costs one call a
#   minute; line status and line disruption add two, and stop disruption adds
#   one more every fifth minute. Budget: 52 calls a minute (53 every fifth
#   minute), so at most 50 distinct stations; the loader enforces this.
# - Entries are station-level, not platform-level: one Arrivals call returns
#   every platform at the station, and grouping by platform and direction
#   happens downstream in dbt.
# - Where one station sees every train from several branches (a junction or
#   the station just inside it), it stands in for those branch ends.
# - naptan_id is the station-level StopPoint id the Arrivals endpoint accepts:
#   940GZZ... for Underground, DLR and tram; 910G... for Elizabeth line and
#   Overground. The same place can have two ids (Paddington H&C vs Bakerloo,
#   Bank tube vs Bank DLR), and each one is a separate call.
#
# role: core = busy trunk station every (or nearly every) train calls at;
#       branch = on a branch, seeing all trains for one or more branch ends;
#       terminus = the end of the line or of a branch.

