      5 November (b is later that day, so b is the 5 November version and a
      is ignored) and `c` on 12 November. b is the first version, so it has
      no valid_from and is valid to 12 November; c is valid from 12 November.
      b's "Monday - Friday" schedule maps to both mon_thu and fri, with
      departures 07:58, 08:02, 08:02, 08:10, 08:30. Hour 7 has one departure
      and no gap (the first of the day). Hour 8 has four departures and the
      gaps ending in it are 4, 0, 8 and 20 minutes: sum 32 min = 1920 s,
      squares 16 + 0 + 64 + 400 = 480 min² = 1,728,000 s², mean 480 s,
      longest 1200 s, average wait 1,728,000 / (2 x 1920) = 450 s. b's
      Sunday schedule departs 23:50 and 24:05 (00:05 the next morning): hour
      23 has no gap, hour 24 has a 15-minute gap (900 s, 810,000 s², wait
      450 s), London hour 0 of the next calendar day. c has one Sunday
      departure at 10:00. Fallback: Elizabeth at Tottenham Court Road has no
      timetable; 24 trains an hour over hours 7 and 8 gives each direction
      24 gaps of 150 s per hour: sum 3600 s, squares 24 x 22,500 = 540,000
      s², wait 540,000 / 7200 = 75 s. The seed's Victoria row (`both`, 30
      an hour) is ignored outbound, which has a timetable, but applies
      inbound, which has none: 30 gaps of 120 s, squares 30 x 14,400 =
      432,000 s², wait 60 s. Liberty at Upminster is a terminus with only
      `inbound` in the seed: 2 gaps of 1800 s in hour 7, squares 6,480,000
